        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #94a3b8; cursor: pointer; flex: 1; padding: 8px 0; border-radius: 9999px; transition: all 0.2s ease; }
        .nav-item.active { color: #2563eb; font-weight: 800; background-color: #eff6ff; }
        .nav-item i { margin-bottom: 3px; }
        
        .file-input-wrapper { position: relative; overflow: hidden; display: block; width: 100%; cursor: pointer; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    
                    setUploadAmountMan(0);
                    setPendingFile({ data, name: file.name });
                };
                reader.readAsBinaryString(file);
                e.target.value = null; 
            };

            const confirmUpload = () => {
                if (!pendingFile) return;
                const finalAmount = (Number(uploadAmountMan) || 0) * 10000;
                processExcelData(pendingFile.data, pendingFile.name, uploadMonth, uploadType, finalAmount);
                setPendingFile(null);
            };

            const processExcelData = (data, fileName, targetMonth, targetType, customAmount) => {
                let headerIdx = -1;
                let colMap = {};
                for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    if (!row || !Array.isArray(row)) continue;
                    const rowStr = row.join(" ");
                    if (rowStr.includes("상호") && rowStr.includes("대표자")) {
                        headerIdx = i;
                        row.forEach((val, idx) => {
                            if (val !== null && val !== undefined) {
                                const cleanVal = String(val).replace(/\s+/g, "");
                                if (cleanVal.includes("번호") && !cleanVal.includes("전화") && !cleanVal.includes("코드")) colMap.no = idx;
                                else if (cleanVal.includes("상호")) colMap.name = idx;
                                else if (cleanVal.includes("대표자")) colMap.rep = idx;
                                else if (cleanVal.includes("주소")) colMap.address = idx;
                                else if (cleanVal.includes("전화")) colMap.phone = idx;
                                // 미국산(포)가 국산(포)를 덮어쓰지 못하도록 엄격히 분리!
                                else if (cleanVal.includes("미국산") && (cleanVal.includes("포") || !cleanVal.includes("kg"))) colMap.usSack = idx;
                                else if ((cleanVal.includes("국산") || cleanVal.includes("25kg") || cleanVal.includes("포")) && !cleanVal.includes("미국산") && !cleanVal.includes("kg")) {
                                    if (colMap.krSack === undefined) colMap.krSack = idx;
                                }
                            }
                        });
                        break;
                    }
                }

                if (headerIdx === -1 || colMap.name === undefined) {
                    showToast("엑셀에서 '상호', '대표자' 열을 찾을 수 없습니다.", "error");
                    return;
                }

                // 만약 수량 열을 못 찾았다면 대표자 바로 다음 열을 기본 수량 열로 지정
                if (colMap.krSack === undefined) {
                    colMap.krSack = colMap.rep !== undefined ? colMap.rep + 1 : 3;
                }

                const parsedList = [];
                let unclassifiedCount = 0;
                let totalSacks = 0;

                for (let i = headerIdx + 1; i < data.length; i++) {
                    const row = data[i];
                    if (!row || row.length === 0) continue;
                    
                    const name = row[colMap.name];
                    if (!name) continue;
                    const cleanName = String(name).trim();
                    if (cleanName === '' || cleanName.includes("합계") || cleanName.includes("총합") || cleanName.includes("계")) continue;

                    const origNo = (colMap.no !== undefined && row[colMap.no] !== undefined && row[colMap.no] !== "") ? row[colMap.no] : (parsedList.length + 1);
                    const rep = (colMap.rep !== undefined && row[colMap.rep] !== undefined) ? String(row[colMap.rep]).trim() : "";
                    
                    const rawKr = colMap.krSack !== undefined ? row[colMap.krSack] : 0;
                    const sacks = parseInt(String(rawKr || "0").replace(/[^0-9]/g, ''), 10) || 0;
                    
                    const rawUs = colMap.usSack !== undefined ? row[colMap.usSack] : 0;
                    const usSacks = parseInt(String(rawUs || "0").replace(/[^0-9]/g, ''), 10) || 0;
                    
                    // 수량이 아예 없는(0포) 업체는 제외
                    if (sacks === 0 && usSacks === 0) continue;

                    const master = masterData[cleanName];
                    let region = master ? master.region : "미분류";
                    let address = (master && master.address) ? master.address : (colMap.address !== undefined && row[colMap.address] ? String(row[colMap.address]).trim() : "");
                    let phone = (master && master.phone) ? master.phone : (colMap.phone !== undefined && row[colMap.phone] ? String(row[colMap.phone]).trim() : "");

                    if (region === "미분류") {
                        unclassifiedCount++;
                    }

                    totalSacks += sacks;

                    parsedList.push({
                        no: origNo,
                        name: cleanName,
                        rep: rep,
                        region: region,
                        address: address,
                        phone: phone,
                        sacks: sacks,
                        usSacks: usSacks,
                        originalRow: row
                    });
                }

                if (parsedList.length === 0) {
                    showToast("추출된 배송 업체가 0곳입니다. 엑셀의 수량 데이터를 확인해주세요.", "error");
                    return;
                }

                const newHistory = {
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('ko-KR'),
                    fileName,
                    month: targetMonth,
                    type: targetType,
                    totalCompanies: parsedList.length,
                    unclassifiedCount,
                    totalSacks,
                    expectedAmount: customAmount,
                    data: parsedList
                };

                    const { db, doc, setDoc } = fbApi;
                    const docId = `history_${Date.now()}`;
                    const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'history', docId);

                        setCurrentProcess({...newHistory, id: docId});

            const downloadExcel = (processData) => {
                if (!processData || !processData.data) {
                    showToast("다운로드할 데이터가 없습니다.", "error");
                    return;
                }

                const wb = XLSX.utils.book_new();
                
                // 구버전 내역(수량이 0으로 잘못 저장된 내역)도 originalRow에서 수량을 강제 복구!
                const recoveredData = [];
                processData.data.forEach((item, idx) => {
                    let sacks = Number(item.sacks) || 0;
                    let usSacks = Number(item.usSacks) || 0;
                    let origNo = item.no || (idx + 1);
                    let phoneFromRow = "";

                    if (sacks === 0 && item.originalRow && Array.isArray(item.originalRow)) {
                        const r = item.originalRow;
                        if (r[0] && !isNaN(parseInt(r[0]))) origNo = r[0];
                        const cand3 = parseInt(String(r[3] || "0").replace(/[^0-9]/g, ''), 10) || 0;
                        const cand4 = parseInt(String(r[4] || "0").replace(/[^0-9]/g, ''), 10) || 0;
                        if (cand3 > 0 && cand3 < 1000) sacks = cand3;
                        else if (cand4 > 0 && cand4 < 1000) sacks = cand4;

                        r.forEach(cell => {
                            if (cell && String(cell).includes("010-")) phoneFromRow = String(cell).trim();
                        });
                    }

                    if (sacks > 0 || usSacks > 0) {
                        const cleanName = String(item.name).trim();
                        // 띄어쓰기 무시 매칭 보조
                        const noSpaceName = cleanName.replace(/\s+/g, "");
                        let master = masterData[cleanName];
                        if (!master) {
                            const foundKey = Object.keys(masterData).find(k => k.replace(/\s+/g, "") === noSpaceName);
                            if (foundKey) master = masterData[foundKey];
                        }
                        master = master || {};

                        recoveredData.push({
                            no: origNo,
                            name: cleanName,
                            rep: item.rep || "",
                            region: (master.region) ? master.region : ((item.region && item.region !== "미분류") ? item.region : "미분류"),
                            address: item.address || master.address || "",
                            phone: item.phone || master.phone || phoneFromRow || "",
                            sacks: sacks,
                            usSacks: usSacks > 0 ? usSacks : ""
                        });
                    }
                });

                if (recoveredData.length === 0) {
                    showToast("출력할 수량 데이터가 없습니다. 엑셀 파일을 다시 업로드해주세요!", "error");
                    return;
                }

                const byRegion = { "제주시": [], "신제주": [], "서쪽": [], "동쪽": [], "서귀포": [], "미분류": [] };
                recoveredData.forEach(item => {
                    if (byRegion[item.region]) byRegion[item.region].push(item);
                    else byRegion["미분류"].push(item);
                });

                // A4 출력용 굵은 테두리 및 초대형 폰트(50pt 기준) 스타일 정의
                const borderThick = {
                    top: { style: "medium", color: { rgb: "000000" } },
                    bottom: { style: "medium", color: { rgb: "000000" } },
                    left: { style: "medium", color: { rgb: "000000" } },
                    right: { style: "medium", color: { rgb: "000000" } }
                };
                const styleHeader = {
                    font: { name: "맑은 고딕", sz: 48, bold: true, color: { rgb: "FFFFFF" } },
                    fill: { fgColor: { rgb: "1E3A8A" } },
                    alignment: { horizontal: "center", vertical: "center", wrapText: true },
                    border: borderThick
                };
                const styleTitle = {
                    font: { name: "맑은 고딕", sz: 55, bold: true, color: { rgb: "0F172A" } },
                    fill: { fgColor: { rgb: "CBD5E1" } },
                    alignment: { horizontal: "center", vertical: "center" },
                    border: borderThick
                };
                const styleCellCenter = {
                    font: { name: "맑은 고딕", sz: 48, bold: false, color: { rgb: "000000" } },
                    alignment: { horizontal: "center", vertical: "center", wrapText: true },
                    border: borderThick
                };
                const styleCellLeft = {
                    font: { name: "맑은 고딕", sz: 44, bold: false, color: { rgb: "000000" } },
                    alignment: { horizontal: "left", vertical: "center", wrapText: true },
                    border: borderThick
                };
                const styleCellBold = {
                    font: { name: "맑은 고딕", sz: 52, bold: true, color: { rgb: "B91C1C" } },
                    alignment: { horizontal: "center", vertical: "center" },
                    border: borderThick
                };
                const styleSum = {
                    font: { name: "맑은 고딕", sz: 52, bold: true, color: { rgb: "000000" } },
                    fill: { fgColor: { rgb: "FDE047" } },
                    alignment: { horizontal: "center", vertical: "center" },
                    border: borderThick
                };

                // 시트 1, 2용 블록 생성기 (상호, 대표자, 주소, 전화번호, 국산(포), 미국산(포))
                const buildRegionSheet = (regionNames, includeTotal = false) => {
                    let aoa = [];
                    let rowStyles = [];

                    regionNames.forEach(rName => {
                        const list = byRegion[rName];
                        if (!list || list.length === 0) return;

                        aoa.push(["", "", rName === "미분류" ? "미분류(신규확인필요)" : rName, "", "", ""]);
                        rowStyles.push("TITLE");

                        aoa.push(["상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]);
                        rowStyles.push("HEADER");

                        let sum = 0;
                        let usSum = 0;
                        list.forEach(item => {
                            aoa.push([
                                item.name,
                                item.rep,
                                item.address,
                                item.phone,
                                item.sacks > 0 ? item.sacks : "",
                                item.usSacks ? item.usSacks : ""
                            ]);
                            rowStyles.push("DATA");
                            sum += (Number(item.sacks) || 0);
                            usSum += (Number(item.usSacks) || 0);
                        });

                        aoa.push(["", "", "", "합계", sum, usSum > 0 ? usSum : 0]);
                        rowStyles.push("SUM");
                        aoa.push(["", "", "", "", "", ""]);
                        rowStyles.push("EMPTY");
                    });

                    if (includeTotal) {
                        const totalAll = recoveredData.reduce((acc, cur) => acc + (Number(cur.sacks) || 0), 0);
                        const totalUsAll = recoveredData.reduce((acc, cur) => acc + (Number(cur.usSacks) || 0), 0);
                        aoa.push(["", "", "", "총합", totalAll, totalUsAll > 0 ? totalUsAll : 0]);
                        rowStyles.push("SUM");
                    }

                    const ws = XLSX.utils.aoa_to_sheet(aoa);
                    
                    // ★ 글자 길이에 맞춰 열 너비 자동 계산 (50pt 폰트 크기에 비례하여 여백 확보)
                    const colWidths = [18, 12, 45, 25, 18, 18]; // 최소 너비
                    aoa.forEach(row => {
                        row.forEach((cell, i) => {
                            if (cell && typeof cell === 'string') {
                                // 한글은 더 넓게 계산
                                const charLen = cell.split('').reduce((a, c) => a + (c.match(/[가-힣]/) ? 2 : 1.2), 0);
                                const calcWidth = charLen * 3.5; // 50pt 스케일 업
                                if (calcWidth > colWidths[i]) colWidths[i] = calcWidth;
                            }
                        });
                    });
                    ws['!cols'] = colWidths.map(w => ({ wch: w }));

                    ws['!rows'] = rowStyles.map(rType => {
                        if (rType === "TITLE") return { hpt: 95 };
                        if (rType === "HEADER") return { hpt: 85 };
                        if (rType === "SUM") return { hpt: 85 };
                        if (rType === "DATA") return { hpt: 80 };
                        return { hpt: 40 };
                    });
                    
                    // ★ 인쇄 시 A4 가로 한 페이지 너비에 꽉 차도록 강제 맞춤 설정 (비율 자동 축소)
                    ws['!pageSetup'] = { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };

                    const range = XLSX.utils.decode_range(ws['!ref'] || "A1:F1");
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        const rType = rowStyles[R];
                        if (!rType || rType === "EMPTY") continue;
                        for (let C = range.s.c; C <= range.e.c; ++C) {
                            const addr = XLSX.utils.encode_cell({ r: R, c: C });
                            if (!ws[addr]) ws[addr] = { t: 's', v: '' };
                            if (rType === "TITLE") ws[addr].s = styleTitle;
                            else if (rType === "HEADER") ws[addr].s = styleHeader;
                            else if (rType === "DATA") {
                                if (C === 2) ws[addr].s = styleCellLeft;
                                else if (C === 4) ws[addr].s = styleCellBold;
                                else ws[addr].s = styleCellCenter;
                            }
                            else if (rType === "SUM") ws[addr].s = styleSum;
                        }
                    }
                    return ws;
                };

                // 시트 1: 최종_제주시,신제주
                const ws1 = buildRegionSheet(["제주시", "신제주", "미분류"], false);
                XLSX.utils.book_append_sheet(wb, ws1, "최종_제주시,신제주");

                // 시트 2: 최종_서쪽,동쪽,서귀포
                const ws2 = buildRegionSheet(["서쪽", "동쪽", "서귀포"], true);
                XLSX.utils.book_append_sheet(wb, ws2, "최종_서쪽,동쪽,서귀포");

                // 시트 3: 지역분류 데이터
                const headers3 = ["번호", "상호", "대표자", "지역", "주소", "전화번호", "국산(포)", "미국산(포)"];
                let aoa3 = [
                    [`지역 분류 데이터 (배송 대상 총 ${recoveredData.length}개 업체 매칭 결과)`, "", "", "", "", "", "", ""],
                    headers3
                ];
                
                const regionOrder = { "제주시": 1, "신제주": 2, "서쪽": 3, "동쪽": 4, "서귀포": 5, "미분류": 6 };
                const sortedForSheet3 = [...recoveredData].sort((a, b) => (regionOrder[a.region] || 9) - (regionOrder[b.region] || 9));

                let totalKr3 = 0;
                let totalUs3 = 0;
                sortedForSheet3.forEach(item => {
                    totalKr3 += (Number(item.sacks) || 0);
                    totalUs3 += (Number(item.usSacks) || 0);
                    aoa3.push([
                        item.no,
                        item.name,
                        item.rep,
                        item.region,
                        item.address,
                        item.phone,
                        item.sacks > 0 ? item.sacks : "",
                        item.usSacks ? item.usSacks : ""
                    ]);
                });
                aoa3.push(["", "합계", "", "", "", "", totalKr3, totalUs3 > 0 ? totalUs3 : 0]);

                const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
                
                // ★ 시트 3 글자 길이에 맞춰 열 너비 자동 계산
                const colWidths3 = [15, 20, 15, 15, 45, 25, 18, 18];
                aoa3.forEach(row => {
                    row.forEach((cell, i) => {
                        if (cell && typeof cell === 'string') {
                            const charLen = cell.split('').reduce((a, c) => a + (c.match(/[가-힣]/) ? 2 : 1.2), 0);
                            const calcWidth = charLen * 3.5;
                            if (calcWidth > colWidths3[i]) colWidths3[i] = calcWidth;
                        }
                    });
                });
                ws3['!cols'] = colWidths3.map(w => ({ wch: w }));

                ws3['!rows'] = aoa3.map((_, idx) => ({ hpt: idx === 0 ? 95 : 80 }));
                ws3['!pageSetup'] = { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
                
                const range3 = XLSX.utils.decode_range(ws3['!ref'] || "A1:H1");
                for (let R = range3.s.r; R <= range3.e.r; ++R) {
                    for (let C = range3.s.c; C <= range3.e.c; ++C) {
                        const addr = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws3[addr]) ws3[addr] = { t: 's', v: '' };
                        if (R === 0) ws3[addr].s = { font: { name: "맑은 고딕", sz: 50, bold: true }, alignment: { vertical: "center" } };
                        else if (R === 1) ws3[addr].s = styleHeader;
                        else if (R === range3.e.r) ws3[addr].s = styleSum;
                        else ws3[addr].s = (C === 4) ? styleCellLeft : (C === 6 ? styleCellBold : styleCellCenter);
                    }
                }
                XLSX.utils.book_append_sheet(wb, ws3, "지역분류 데이터");

                XLSX.writeFile(wb, `배송분류완료_${processData.month}_${processData.type}.xlsx`);
                showToast("50pt 초대형 폰트 엑셀 다운로드 완료!");
            };

            // 신규 하차지 등록 상태 (주소, 전화번호 입력 추가)
            const [newCompName, setNewCompName] = useState('');
            const [newCompRegion, setNewCompRegion] = useState('제주시');
            const [newCompAddress, setNewCompAddress] = useState('');
            const [newCompPhone, setNewCompPhone] = useState('');

            const addRegion = async (e) => {
                e.preventDefault();
                const name = newCompName.trim();
                if (!name) return;
                
                const newEntry = {
                    name,
                    region: newCompRegion,
                    address: newCompAddress.trim(),
                    phone: newCompPhone.trim()
                };

                if (user && fbApi) {
                    try {
                        const { db, doc, setDoc } = fbApi;
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'regions', name);
                        await setDoc(docRef, newEntry);
                        setNewCompName(''); setNewCompAddress(''); setNewCompPhone('');
                        showToast(`'${name}' 하차지가 저장되었습니다.`);
                    } catch (err) {
                        console.error("Add region error:", err);
                    }
                } else {
                    setMasterData(prev => ({ ...prev, [name]: newEntry }));
                    setNewCompName(''); setNewCompAddress(''); setNewCompPhone('');
                    showToast(`'${name}' 임시 등록 완료.`);
                }
            };

            const filteredStats = useMemo(() => {
                let filtered = history.filter(item => {
                    const matchMonth = filterMonth === 'ALL' || item.month === filterMonth;
                    const matchType = filterType === '전체' || item.type === filterType;
                    return matchMonth && matchType;
                });

                const totalExpected = filtered.reduce((sum, item) => sum + (item.expectedAmount || 0), 0);
                const totalSacks = filtered.reduce((sum, item) => sum + (item.totalSacks || 0), 0);

                const regionCounts = { "제주시": 0, "신제주": 0, "서쪽": 0, "동쪽": 0, "서귀포": 0, "미분류": 0 };
                filtered.forEach(item => {
                    item.data.forEach(row => {
                        const r = (row.region && masterData[row.name]) ? masterData[row.name].region : row.region;
                        if (regionCounts[r] !== undefined) {
                            regionCounts[r] += row.sacks;
                        } else {
                            regionCounts["미분류"] += row.sacks;
                        }
                    });
                });

                return { docs: filtered, expected: totalExpected, sacks: totalSacks, regions: regionCounts };
            }, [history, filterMonth, filterType, masterData]);

            const availableMonths = useMemo(() => {
                const mSet = new Set();
                history.forEach(item => { if (item.month) mSet.add(item.month); });
                return Array.from(mSet).sort().reverse();
            }, [history]);

            return (
                <div className="app-container">
                    {/* Toast 알림 */}
                    {toast && (
                        <div className={`fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-5 py-3 rounded-full shadow-2xl text-xs font-bold flex items-center max-w-[90%] whitespace-nowrap transition-all ${toast.type === 'error' ? 'bg-rose-500 text-white' : 'bg-slate-800 text-white'}`}>
                            <Icon name={toast.type === 'error' ? 'alert-circle' : 'check-circle'} />
                            <span className="ml-2">{toast.message}</span>
                        </div>
                    )}

                    {/* 업로드 설정 팝업 */}
                    {pendingFile && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[28px] w-full max-w-sm overflow-hidden shadow-2xl p-5">
                                <div className="text-center mb-4">
                                    <h3 className="text-lg font-extrabold text-slate-800">문서 정보 입력</h3>
                                    <p className="text-xs text-slate-400 mt-0.5">월과 품목, 정산 금액을 설정해주세요</p>
                                </div>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <button type="button" onClick={() => setUploadType('쌀')} className={`py-3 px-2 rounded-2xl font-bold text-xs border-2 transition-all flex flex-col items-center justify-center gap-1.5 ${uploadType === '쌀' ? 'bg-amber-50 text-amber-900 border-amber-400' : 'bg-slate-50 text-slate-400 border-transparent opacity-70'}`}>
                                            <RiceChar className="w-11 h-11" />
                                            <span>쌀 내역서</span>
                                        </button>
                                        <button type="button" onClick={() => setUploadType('팥')} className={`py-3 px-2 rounded-2xl font-bold text-xs border-2 transition-all flex flex-col items-center justify-center gap-1.5 ${uploadType === '팥' ? 'bg-rose-50 text-rose-900 border-rose-400' : 'bg-slate-50 text-slate-400 border-transparent opacity-70'}`}>
                                            <BeanChar className="w-11 h-11" />
                                            <span>팥 내역서</span>
                                        </button>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">해당 년/월</label>
                                        <input type="month" value={uploadMonth} onChange={e => setUploadMonth(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-800 outline-none"/>
                                    </div>
                                    <div className="bg-slate-50 p-3.5 rounded-2xl">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-xs font-bold text-slate-500">사장님께 받는 돈</label>
                                            <span className="text-xs font-extrabold text-blue-600">{((Number(uploadAmountMan) || 0) * 10000).toLocaleString()} 원</span>
                                        </div>
                                        <div className="flex items-center space-x-2 mb-2.5 bg-white p-1 rounded-xl border border-slate-200">
                                            <input type="number" step="10" placeholder="0" value={uploadAmountMan} onChange={(e) => setUploadAmountMan(e.target.value)} 
                                                className="w-full px-2.5 py-1 text-right font-extrabold text-base text-slate-800 outline-none bg-transparent"/>
                                            <span className="text-xs font-bold text-slate-400 pr-2.5 shrink-0">만원</span>
                                        </div>
                                        <div className="grid grid-cols-4 gap-1.5">
                                            <button type="button" onClick={() => setUploadAmountMan(prev => (Number(prev)||0) + 10)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+10만</button>
                                            <button type="button" onClick={() => setUploadAmountMan(prev => (Number(prev)||0) + 50)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+50만</button>
                                            <button type="button" onClick={() => setUploadAmountMan(prev => (Number(prev)||0) + 100)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+100만</button>
                                            <button type="button" onClick={() => setUploadAmountMan(0)} className="bg-rose-50 text-rose-600 text-xs font-bold py-2 rounded-lg active:scale-95">초기화</button>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-5 flex gap-2">
                                    <button type="button" onClick={() => setPendingFile(null)} className="flex-1 py-3 text-xs font-bold text-slate-500 bg-slate-100 rounded-full">취소</button>
                                    <button type="button" onClick={confirmUpload} className="flex-1 py-3 text-xs font-bold text-white bg-blue-600 rounded-full shadow-md shadow-blue-200 active:scale-95">완료 및 분류</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 금액 수정 팝업 */}
                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[28px] w-full max-w-sm overflow-hidden shadow-2xl p-5">
                                <div className="text-center mb-4">
                                    <h3 className="text-lg font-extrabold text-slate-800">정산 금액 수정</h3>
                                    <p className="text-xs text-slate-400 mt-0.5">{editingItem.month} · {editingItem.type} 내역서</p>
                                </div>
                                <div className="bg-slate-50 p-3.5 rounded-2xl mb-5">
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="text-xs font-bold text-slate-500">사장님께 받는 돈</label>
                                        <span className="text-xs font-extrabold text-blue-600">{((Number(editAmountMan) || 0) * 10000).toLocaleString()} 원</span>
                                    </div>
                                    <div className="flex items-center space-x-2 mb-2.5 bg-white p-1 rounded-xl border border-slate-200">
                                        <input type="number" step="10" value={editAmountMan} onChange={(e) => setEditAmountMan(e.target.value)} 
                                            className="w-full px-2.5 py-1 text-right font-extrabold text-base text-slate-800 outline-none bg-transparent"/>
                                        <span className="text-xs font-bold text-slate-400 pr-2.5 shrink-0">만원</span>
                                    </div>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        <button type="button" onClick={() => setEditAmountMan(prev => (Number(prev)||0) + 10)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+10만</button>
                                        <button type="button" onClick={() => setEditAmountMan(prev => (Number(prev)||0) + 50)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+50만</button>
                                        <button type="button" onClick={() => setEditAmountMan(prev => (Number(prev)||0) + 100)} className="bg-white text-slate-600 border border-slate-200 text-xs font-bold py-2 rounded-lg active:scale-95">+100만</button>
                                        <button type="button" onClick={() => setEditAmountMan(0)} className="bg-rose-50 text-rose-600 text-xs font-bold py-2 rounded-lg active:scale-95">초기화</button>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setEditingItem(null)} className="flex-1 py-3 text-xs font-bold text-slate-500 bg-slate-100 rounded-full">취소</button>
                                    <button type="button" onClick={saveEditedAmount} className="flex-1 py-3 text-xs font-bold text-white bg-blue-600 rounded-full shadow-md shadow-blue-200 active:scale-95">수정 완료</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 내역 삭제 확인 팝업 */}
                    {deletingItem && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[28px] w-full max-w-sm overflow-hidden shadow-2xl p-6 text-center">
                                <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center mx-auto mb-3">
                                    <Icon name="trash-2" />
                                </div>
                                <h3 className="text-lg font-extrabold text-slate-800">내역을 삭제할까요?</h3>
                                <p className="text-xs text-slate-400 mt-1 mb-5">
                                    <span className="font-bold text-slate-600">{deletingItem.month} ({deletingItem.type})</span> 내역이 영구 삭제되며<br/>통계에서도 제외됩니다.
                                </p>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setDeletingItem(null)} className="flex-1 py-3 text-xs font-bold text-slate-500 bg-slate-100 rounded-full">취소</button>
                                    <button type="button" onClick={confirmDeleteHistory} className="flex-1 py-3 text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 rounded-full shadow-md shadow-rose-200 active:scale-95">삭제하기</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 상단 헤더 */}
                    <header className="bg-white/90 backdrop-blur-md text-slate-800 px-5 py-3.5 font-extrabold text-base flex items-center justify-between sticky top-0 z-20 border-b border-slate-100">
                        <div className="flex items-center space-x-2">
                            <div className="bg-blue-50 p-1.5 rounded-xl flex items-center justify-center">
                                <RiceChar className="w-5 h-5" />
                            </div>
                            <span className="tracking-tight text-slate-800">제주 쌀·팥 물류</span>
                        </div>
                        {user ? (
                            <div className="bg-emerald-50 text-emerald-600 text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                                동기화됨
                            </div>
                        ) : (
                            <div className="bg-slate-100 text-slate-400 text-[11px] font-bold px-2.5 py-1 rounded-full">연결 중...</div>
                        )}
                    </header>

                    <main className="content-area">
                        {/* 탭 1: 업로드 (모바일 한 화면에 들어오도록 컴팩트하게 조정) */}
                        {activeTab === 'upload' && (
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-[28px] shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center">
                                    <div className="flex items-center justify-center -space-x-2 mb-3">
                                        <div className="animate-float z-10"><RiceChar className="w-16 h-16 drop-shadow-sm" /></div>
                                        <div className="animate-float" style={{ animationDelay: '1.5s' }}><BeanChar className="w-16 h-16 drop-shadow-sm" /></div>
                                    </div>
                                    <h2 className="text-lg font-extrabold text-slate-800 mb-1">엑셀 자동 분류</h2>
                                    <p className="text-xs text-slate-400 mb-5 leading-relaxed">수량이 있는 업체만 자동 필터링하여<br/>주소·전화번호가 완비된 양식으로 변환합니다</p>
                                    
                                    <div className="file-input-wrapper w-full">
                                        <button className="w-full bg-blue-600 text-white font-bold py-3.5 px-6 rounded-full shadow-lg shadow-blue-200 hover:bg-blue-700 transition active:scale-95 flex items-center justify-center gap-2 text-sm">
                                            <Icon name="upload-cloud" />
                                            <span>파일 선택하기</span>
                                        </button>
                                        <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} />
                                    </div>
                                </div>

                                {currentProcess && (
                                    <div className="bg-white p-5 rounded-[28px] shadow-sm border-2 border-emerald-400/90 relative overflow-hidden">
                                        <div className="flex items-center justify-between mb-4">
                                            <div className="flex items-center min-w-0 pr-2">
                                                <div className="bg-slate-50 p-2 rounded-xl mr-2.5 shrink-0">
                                                    {currentProcess.type === '쌀' ? <RiceChar className="w-8 h-8" /> : <BeanChar className="w-8 h-8" />}
                                                </div>
                                                <div className="min-w-0">
                                                    <h3 className="font-extrabold text-slate-800 text-sm truncate">{currentProcess.type} 분류 완료 ({currentProcess.totalSacks.toLocaleString()}포)</h3>
                                                    <span className="text-[11px] text-slate-400 block truncate">{currentProcess.fileName}</span>
                                                </div>
                                            </div>
                                            <span className="text-xs bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full font-extrabold shrink-0">
                                                {currentProcess.month}
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2.5 mb-4">
                                            <div className="bg-slate-50 p-3 rounded-2xl text-center">
                                                <div className="text-[11px] font-bold text-slate-400 mb-0.5">실제 배송 업체</div>
                                                <div className="font-extrabold text-slate-800 text-xl">{currentProcess.totalCompanies}<span className="text-xs font-semibold ml-0.5">곳</span></div>
                                            </div>
                                            <div className="bg-slate-50 p-3 rounded-2xl text-center">
                                                <div className="text-[11px] font-bold text-slate-400 mb-0.5">미분류(신규)</div>
                                                <div className={`font-extrabold text-xl ${currentProcess.unclassifiedCount > 0 ? 'text-rose-500' : 'text-slate-800'}`}>
                                                    {currentProcess.unclassifiedCount}<span className="text-xs font-semibold ml-0.5">곳</span>
                                                </div>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => downloadExcel(currentProcess)}
                                            className="w-full bg-emerald-500 text-white font-bold py-3.5 px-5 rounded-full shadow-md shadow-emerald-100 hover:bg-emerald-600 transition flex items-center justify-center active:scale-95 text-sm">
                                            <Icon name="download" />
                                            <span className="ml-1.5">분류된 엑셀 내려받기</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 탭 2: 월별 내역 */}
                        {activeTab === 'history' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-extrabold text-slate-800 px-1">내역 조회</h2>
                                
                                <div className="flex bg-slate-200/70 p-1 rounded-full gap-1">
                                    <button 
                                        onClick={() => setHistoryTab('쌀')}
                                        className={`flex-1 py-2 rounded-full font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${historyTab === '쌀' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>
                                        <RiceChar className="w-5 h-5" />
                                        <span>쌀 내역</span>
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-extrabold ${historyTab === '쌀' ? 'bg-amber-100 text-amber-800' : 'bg-slate-300/70 text-slate-600'}`}>
                                            {history.filter(h => (h.type || '쌀') === '쌀').length}
                                        </span>
                                    </button>
                                    <button 
                                        onClick={() => setHistoryTab('팥')}
                                        className={`flex-1 py-2 rounded-full font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${historyTab === '팥' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>
                                        <BeanChar className="w-5 h-5" />
                                        <span>팥 내역</span>
                                        <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-extrabold ${historyTab === '팥' ? 'bg-rose-100 text-rose-800' : 'bg-slate-300/70 text-slate-600'}`}>
                                            {history.filter(h => h.type === '팥').length}
                                        </span>
                                    </button>
                                </div>

                                {history.filter(item => (item.type || '쌀') === historyTab).length === 0 ? (
                                    <div className="text-center text-slate-400 py-12 bg-white rounded-[28px] border border-dashed border-slate-200 flex flex-col items-center justify-center">
                                        <div className="opacity-40 mb-2 grayscale">
                                            {historyTab === '쌀' ? <RiceChar className="w-12 h-12" /> : <BeanChar className="w-12 h-12" />}
                                        </div>
                                        <p className="text-xs font-semibold">등록된 {historyTab} 내역이 없어요</p>
                                    </div>
                                ) : (
                                    history.filter(item => (item.type || '쌀') === historyTab).map((item) => (
                                        <div key={item.id} className="bg-white p-4 rounded-[24px] shadow-sm border border-slate-100">
                                            <div className="flex justify-between items-center mb-3">
                                                <div className="flex items-center gap-3">
                                                    <div className={`p-2 rounded-2xl ${item.type === '팥' ? 'bg-rose-50' : 'bg-amber-50'}`}>
                                                        {item.type === '팥' ? <BeanChar className="w-8 h-8" /> : <RiceChar className="w-8 h-8" />}
                                                    </div>
                                                    <div>
                                                        <span className="text-base font-extrabold text-slate-800 block">{item.month || '날짜미상'}</span>
                                                        <span className="text-[11px] font-medium text-slate-400">{item.date} · {item.totalCompanies}곳</span>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-slate-800 font-extrabold text-lg">{item.totalSacks.toLocaleString()}<span className="text-xs font-semibold text-slate-500 ml-0.5">포</span></div>
                                                    <div className="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full mt-0.5 inline-block">{(item.expectedAmount || 0).toLocaleString()}원</div>
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-4 gap-1.5 pt-2.5 border-t border-slate-50">
                                                <button onClick={() => { setCurrentProcess(item); setActiveTab('upload'); }} className="bg-slate-50 text-slate-600 text-xs py-2.5 rounded-full font-bold active:scale-95">
                                                    요약
                                                </button>
                                                <button onClick={() => { setEditingItem(item); setEditAmountMan((item.expectedAmount || 0) / 10000); }} className="bg-amber-50 text-amber-800 text-xs py-2.5 rounded-full font-bold active:scale-95">
                                                    금액수정
                                                </button>
                                                <button onClick={() => downloadExcel(item)} className="bg-blue-50 text-blue-600 text-xs py-2.5 rounded-full font-bold active:scale-95">
                                                    엑셀다운
                                                </button>
                                                <button onClick={() => setDeletingItem(item)} className="bg-rose-50 text-rose-600 text-xs py-2.5 rounded-full font-bold active:scale-95">
                                                    삭제
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* 탭 3: 나의 하차지 (주소, 전화번호 관리 추가) */}
                        {activeTab === 'regions' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-extrabold text-slate-800 px-1">나의 하차지</h2>
                                
                                <div className="bg-white p-4 rounded-[24px] shadow-sm border border-slate-100">
                                    <h3 className="text-xs font-extrabold text-slate-700 mb-2.5 flex items-center"><Icon name="plus-circle" /><span className="ml-1.5">신규/수정 하차지 등록</span></h3>
                                    <form onSubmit={addRegion} className="space-y-2">
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="상호명 (필수)" value={newCompName} onChange={e=>setNewCompName(e.target.value)} className="flex-1 min-w-0 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-medium outline-none focus:bg-white focus:border-blue-500"/>
                                            <select value={newCompRegion} onChange={e=>setNewCompRegion(e.target.value)} className="shrink-0 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-700 outline-none">
                                                <option value="제주시">제주시</option>
                                                <option value="신제주">신제주</option>
                                                <option value="서쪽">서쪽</option>
                                                <option value="동쪽">동쪽</option>
                                                <option value="서귀포">서귀포</option>
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="text" placeholder="주소 입력" value={newCompAddress} onChange={e=>setNewCompAddress(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:bg-white focus:border-blue-500"/>
                                            <input type="text" placeholder="전화번호 입력" value={newCompPhone} onChange={e=>setNewCompPhone(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:bg-white focus:border-blue-500"/>
                                        </div>
                                        <button type="submit" className="w-full bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold active:scale-95 transition shadow-sm">하차지 저장</button>
                                    </form>
                                </div>

                                <div className="bg-white rounded-[24px] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="px-5 py-3.5 bg-slate-50/50 border-b border-slate-100 font-extrabold text-slate-700 text-xs flex justify-between items-center">
                                        <span>등록된 하차지 목록</span>
                                        <span className="bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold">{Object.keys(masterData).length}곳</span>
                                    </div>
                                    <div className="max-h-[340px] overflow-y-auto divide-y divide-slate-50 px-2">
                                        {Object.entries(masterData).map(([name, info], idx) => (
                                            <div key={idx} onClick={() => { setNewCompName(name); setNewCompRegion(info.region); setNewCompAddress(info.address||''); setNewCompPhone(info.phone||''); }} className="px-3 py-3 flex justify-between items-center hover:bg-slate-50 rounded-xl cursor-pointer">
                                                <div className="min-w-0 pr-2">
                                                    <div className="text-xs font-bold text-slate-800">{name}</div>
                                                    <div className="text-[10px] text-slate-400 truncate mt-0.5">
                                                        {info.address || '주소미입력'} · {info.phone || '번호미입력'}
                                                    </div>
                                                </div>
                                                <span className="shrink-0 text-[11px] px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full font-bold">{info.region}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 탭 4: 통계 */}
                        {activeTab === 'stats' && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-extrabold text-slate-800 px-1">정산 및 통계</h2>

                                <div className="bg-white p-2 rounded-full shadow-sm border border-slate-100 flex gap-1.5">
                                    <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="flex-1 bg-slate-50 text-slate-700 font-bold text-xs rounded-full px-3 py-2 outline-none">
                                        <option value="ALL">모든 월 전체</option>
                                        {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                    <select value={filterType} onChange={e => setFilterType(e.target.value)} className="bg-slate-50 text-slate-700 font-bold text-xs rounded-full px-3 py-2 outline-none">
                                        <option value="전체">모든 품목</option>
                                        <option value="쌀">쌀</option>
                                        <option value="팥">팥</option>
                                    </select>
                                </div>
                                
                                <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-5 rounded-[28px] shadow-lg shadow-blue-200/50 text-white">
                                    <div className="text-blue-100 text-xs font-medium mb-1 flex items-center justify-between">
                                        <span>사장님께 받은 총 정산금</span>
                                        <span className="text-[10px] bg-white/20 px-2 py-0.5 rounded-full text-white font-bold">10만원 단위</span>
                                    </div>
                                    <div className="text-2xl font-extrabold mb-4 tracking-tight">
                                        {filteredStats.expected.toLocaleString()} <span className="text-base font-normal opacity-80">원</span>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3 bg-white/10 p-3.5 rounded-2xl backdrop-blur-sm">
                                        <div>
                                            <div className="text-blue-100 text-[11px] mb-0.5">총 배송 수량</div>
                                            <div className="font-extrabold text-base">{filteredStats.sacks.toLocaleString()} 포</div>
                                        </div>
                                        <div>
                                            <div className="text-blue-100 text-[11px] mb-0.5">업로드 문서</div>
                                            <div className="font-extrabold text-base">{filteredStats.docs.length} 건</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[28px] shadow-sm border border-slate-100 p-4">
                                    <div className="font-extrabold text-slate-700 text-xs mb-3">권역별 배송량 비율</div>
                                    <div className="space-y-3">
                                        {Object.entries(filteredStats.regions).map(([rName, rSacks]) => (
                                            <div key={rName} className="flex items-center">
                                                <div className="w-14 text-xs font-bold text-slate-600">{rName}</div>
                                                <div className="flex-1 mx-2 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                                    <div className={`h-full rounded-full transition-all duration-500 ${rName === '미분류' ? 'bg-rose-400' : 'bg-blue-500'}`} style={{ width: `${filteredStats.sacks > 0 ? (rSacks / filteredStats.sacks) * 100 : 0}%` }}></div>
                                                </div>
                                                <div className="w-14 text-right text-xs font-extrabold text-slate-700">{rSacks.toLocaleString()}<span className="text-[10px] font-normal text-slate-400 ml-0.5">포</span></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 하단 네비게이션 */}
                    <div className="bottom-nav-container">
                        <nav className="bottom-nav">
                            <div className={`nav-item ${activeTab === 'upload' ? 'active' : ''}`} onClick={() => setActiveTab('upload')}>
                                <Icon name="upload" />
                                <span>업로드</span>
                            </div>
                            <div className={`nav-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
                                <Icon name="folder-check" />
                                <span>내역조회</span>
                            </div>
                            <div className={`nav-item ${activeTab === 'regions' ? 'active' : ''}`} onClick={() => setActiveTab('regions')}>
                                <Icon name="map-pin" />
                                <span>하차지</span>
                            </div>
                            <div className={`nav-item ${activeTab === 'stats' ? 'active' : ''}`} onClick={() => setActiveTab('stats')}>
                                <Icon name="pie-chart" />
                                <span>통계</span>
                            </div>
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
