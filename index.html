                                                            </td>
                                                            <td className="py-3 px-2 text-center" onClick={(e) => { if (row.isSplit) e.stopPropagation(); }}>
                                                                {row.isSplit ? (
                                                                    <div className="flex flex-col items-center space-y-1">
                                                                        <div>
                                                                            <span className="text-base font-black text-amber-700">{row.mySacksVal}</span>
                                                                            <span className="text-[10px] font-bold text-stone-400">/{row.totalRowSacks}포</span>
                                                                        </div>
                                                                        <div className="flex items-center space-x-1">
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => adjustMySacks(activeDoc, row.origIdx, -1)}
                                                                                className="w-5 h-5 rounded bg-[#e8dfd1] text-stone-700 font-black text-xs flex items-center justify-center active:scale-90"
                                                                            >-</button>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => adjustMySacks(activeDoc, row.origIdx, 1)}
                                                                                className="w-5 h-5 rounded bg-[#e8dfd1] text-stone-700 font-black text-xs flex items-center justify-center active:scale-90"
                                                                            >+</button>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <div>
                                                                        <span className={`text-base font-black ${row.completed ? 'text-stone-400' : 'text-rose-700'}`}>
                                                                            {row.totalRowSacks}
                                                                        </span>
                                                                        <span className="text-[11px] font-bold ml-0.5">포</span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="py-3 px-3 text-center" onClick={(e) => e.stopPropagation()}>
                                                                <div className="flex items-center justify-center space-x-2">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={!!row.completed}
                                                                        onChange={() => toggleDeliveryComplete(activeDoc, row.origIdx)}
                                                                        className="w-6 h-6 accent-emerald-600 rounded-lg cursor-pointer align-middle"
                                                                    />
                                                                    {row.totalRowSacks >= 2 && (
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => toggleHalfDelivery(activeDoc, row.origIdx)}
                                                                            className={`px-2 py-1 rounded-lg text-[11px] font-extrabold transition active:scale-95 ${
                                                                                row.isSplit
                                                                                    ? 'bg-amber-600 text-white shadow-sm'
                                                                                    : 'bg-[#f4eee4] text-stone-600 hover:bg-[#e6dfd5]'
                                                                            }`}
                                                                            title="수량 절반만 체크"
                                                                        >
                                                                            절반
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {filteredRows.length === 0 && (
                                                        <tr>
                                                            <td colSpan="3" className="py-8 text-center text-stone-400 font-medium">
                                                                해당 권역에 배정된 하차지가 없습니다.
                                                            </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {/* 뷰 모드 2: 체크한 애들만 보는 목록형 뷰 */}
                                    {activeDoc && deliveryViewMode === 'checked_list' && (
                                        <div className="space-y-2.5">
                                            {checkedFilteredRows.length === 0 ? (
                                                <div className="bg-[#fffdfa] rounded-[24px] p-10 text-center border border-[#e6dfd5] text-stone-400 text-xs font-medium">
                                                    <Icon name="check-circle-2" size={32} className="mx-auto mb-2 opacity-30" />
                                                    아직 체크한 하차지가 없습니다.<br/>[전체 선택 표]에서 내가 돌린 곳을 체크해 주세요.
                                                </div>
                                            ) : (
                                                checkedFilteredRows.map((row, idx) => (
                                                    <div
                                                        key={row.origIdx}
                                                        className="bg-[#fffdfa] p-4 rounded-2xl shadow-sm border border-[#e6dfd5] flex justify-between items-center"
                                                    >
                                                        <div className="min-w-0 pr-3">
                                                            <div className="flex items-center space-x-1.5 mb-1">
                                                                <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-stone-800 text-amber-300">
                                                                    #{idx + 1}
                                                                </span>
                                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-[#f4eee4] text-stone-600">
                                                                    {row.resolvedRegion}
                                                                </span>
                                                                {row.isSplit && (
                                                                    <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800">
                                                                        절반
                                                                    </span>
                                                                )}
                                                                <h4 className="font-extrabold text-sm text-stone-800 truncate">{row.name}</h4>
                                                            </div>
                                                            <p className="text-[11px] text-stone-500 truncate">
                                                                {row.address || '주소 정보 없음'}
                                                            </p>
                                                            {row.phone && (
                                                                <p className="text-[11px] text-stone-400 font-medium mt-0.5">{row.phone}</p>
                                                            )}
                                                        </div>
                                                        <div className="flex items-center space-x-2 shrink-0">
                                                            <div className="text-right">
                                                                <span className="text-lg font-black text-amber-700">{row.mySacksVal}</span>
                                                                <span className="text-xs font-bold text-stone-600 ml-0.5">
                                                                    {row.isSplit ? `/${row.totalRowSacks}포` : '포'}
                                                                </span>
                                                            </div>
                                                            {row.totalRowSacks >= 2 && (
                                                                <button
                                                                    onClick={() => toggleHalfDelivery(activeDoc, row.origIdx)}
                                                                    className={`px-2 py-2 rounded-xl text-[11px] font-extrabold active:scale-95 transition ${
                                                                        row.isSplit
                                                                            ? 'bg-amber-600 text-white'
                                                                            : 'bg-[#f4eee4] text-stone-700'
                                                                    }`}
                                                                >
                                                                    {row.isSplit ? '전체' : '절반'}
                                                                </button>
                                                            )}
                                                            <button
                                                                onClick={() => toggleDeliveryComplete(activeDoc, row.origIdx)}
                                                                className="bg-[#fdf3f2] hover:bg-[#f9e2e0] text-[#9e3b33] px-2.5 py-2 rounded-xl text-[11px] font-extrabold border border-[#f5d5d2] active:scale-95 transition"
                                                                title="체크 해지"
                                                            >
                                                                해지
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>
                            );
                        })()}

                        {/* 3. 내역조회 탭 */}
                        {activeTab === 'history' && (
                            <div className="space-y-3">
                                <h2 className="text-base font-extrabold text-stone-800 mb-3 px-1">클라우드 작업 내역</h2>
                                {history.length === 0 ? (
                                    <div className="text-center py-12 text-stone-400 bg-[#fffdfa] rounded-[28px] border border-[#e6dfd5]">
                                        <Icon name="inbox" size={40} className="mx-auto mb-2 opacity-30" />
                                        <p className="text-sm font-medium">저장된 내역이 없습니다.</p>
                                    </div>
                                ) : (
                                    history.map(doc => {
                                        const doneSacks = doc.data.reduce((a, c) => a + getEffectiveMySacks(c), 0);
                                        return (
                                            <div key={doc.id} onClick={() => { setCurrentDoc(doc); setActiveTab('upload'); }} className="bg-[#fffdfa] p-4 rounded-2xl shadow-sm border border-[#e6dfd5] flex justify-between items-center cursor-pointer active:bg-[#f7f4ef] transition">
                                                <div className="overflow-hidden pr-3">
                                                    <div className="flex items-center space-x-2 mb-1">
                                                        <span className="text-[10px] font-bold bg-[#f4eee4] text-stone-700 px-2 py-0.5 rounded-md">{doc.yearMonth}</span>
                                                        <span className="text-[11px] text-stone-400">{doc.uploadDate}</span>
                                                    </div>
                                                    <h4 className="font-bold text-stone-800 text-sm truncate">{doc.fileName}</h4>
                                                    <p className="text-[11px] text-emerald-700 font-bold mt-1">
                                                        내가 돌린 수량: {doneSacks}포 / 전체 {doc.totalSacks}포
                                                    </p>
                                                </div>
                                                <div className="flex items-center space-x-2 shrink-0">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); exportToExcel(doc); }} 
                                                        className="px-3 py-2 bg-[#e3ece6] text-[#2c5e43] rounded-xl hover:bg-[#d5e3da] flex items-center text-xs font-extrabold shadow-sm"
                                                    >
                                                        <Icon name="download" size={14} className="mr-1" /> 엑셀다운
                                                    </button>
                                                    <button onClick={(e) => deleteHistoryDoc(doc.id, e)} className="p-2 text-stone-400 hover:text-rose-600 rounded-xl">
                                                        <Icon name="trash-2" size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        )}

                        {/* 4. 월별통계 탭 */}
                        {activeTab === 'stats' && (
                            <div className="space-y-4">
                                <div className="flex space-x-2 bg-[#fffdfa] p-3 rounded-2xl shadow-sm border border-[#e6dfd5]">
                                    <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="flex-1 bg-[#f7f4ef] border-none rounded-xl text-sm font-bold text-stone-700 py-2.5 px-3 outline-none">
                                        {availableYears.map(y => <option key={y} value={y}>{y}년</option>)}
                                    </select>
                                    <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="flex-1 bg-[#f7f4ef] border-none rounded-xl text-sm font-bold text-stone-700 py-2.5 px-3 outline-none">
                                        <option value="ALL">전체 (연간 누적)</option>
                                        {Array.from({length: 12}, (_, i) => (i + 1).toString().padStart(2, '0')).map(m => (
                                            <option key={m} value={m}>{parseInt(m)}월</option>
                                        ))}
                                    </select>
                                </div>

                                {/* 전체 통계 + 내가 돌린 갯수 통계 카드 */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-stone-800 text-[#fdfbf7] p-5 rounded-[24px] shadow-md">
                                        <p className="text-stone-400 text-[11px] font-bold mb-1">전체 물량 ({filteredStats.docCount}건)</p>
                                        <h3 className="text-2xl font-black">{filteredStats.totalSacks.toLocaleString()}<span className="text-xs font-normal ml-1">포</span></h3>
                                        <p className="text-[11px] text-stone-400 mt-1">총 {filteredStats.totalCount}곳 배정</p>
                                    </div>
                                    <div className="bg-amber-700 text-[#fdfbf7] p-5 rounded-[24px] shadow-md">
                                        <p className="text-amber-200 text-[11px] font-bold mb-1">내가 돌린 갯수 (하차완료)</p>
                                        <h3 className="text-2xl font-black">{filteredStats.completedSacks.toLocaleString()}<span className="text-xs font-normal ml-1">포</span></h3>
                                        <p className="text-[11px] text-amber-200 mt-1">
                                            완료 {filteredStats.completedCount}곳 ({filteredStats.totalSacks > 0 ? Math.round((filteredStats.completedSacks / filteredStats.totalSacks) * 100) : 0}%)
                                        </p>
                                    </div>
                                </div>

                                {/* 권역별 전체 vs 내가 돌린 갯수 비교 */}
                                <div className="bg-[#fffdfa] p-5 rounded-[28px] shadow-sm border border-[#e6dfd5]">
                                    <h4 className="font-extrabold text-stone-800 text-xs mb-4 flex items-center justify-between">
                                        <span className="flex items-center"><Icon name="map-pin" size={16} className="mr-1.5 text-stone-500"/> 권역별 통계 (내가 돌린 갯수 / 전체)</span>
                                    </h4>
                                    <div className="space-y-3.5">
                                        {['제주시', '신제주', '서쪽', '동쪽', '서귀포', '미분류'].map(r => {
                                            const count = filteredStats.byRegion[r] || 0;
                                            const doneCount = filteredStats.completedByRegion[r] || 0;
                                            if (count === 0 && r === '미분류') return null;
                                            const totalPercent = filteredStats.totalSacks > 0 ? Math.round((count / filteredStats.totalSacks) * 100) : 0;
                                            const donePercent = count > 0 ? Math.round((doneCount / count) * 100) : 0;
                                            return (
                                                <div key={r}>
                                                    <div className="flex justify-between text-xs mb-1">
                                                        <span className="font-bold text-stone-700">{r}</span>
                                                        <span className="font-extrabold text-stone-800">
                                                            <strong className="text-amber-700">{doneCount}포</strong> / {count}포 ({totalPercent}%)
                                                        </span>
                                                    </div>
                                                    <div className="w-full bg-[#f4eee4] rounded-full h-2.5 overflow-hidden flex">
                                                        <div className="bg-amber-600 h-2.5 transition-all" style={{ width: `${donePercent}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* 내가 돌린 업체별 순위 */}
                                <div className="bg-[#fffdfa] p-5 rounded-[28px] shadow-sm border border-[#e6dfd5]">
                                    <h4 className="font-extrabold text-stone-800 text-xs mb-3 flex items-center">
                                        <Icon name="check-circle" size={16} className="mr-1.5 text-amber-700"/> 내가 돌린 하차지 내역 ({filteredStats.myCompletedCompanies.length}곳)
                                    </h4>
                                    {filteredStats.myCompletedCompanies.length === 0 ? (
                                        <p className="text-xs text-stone-400 py-4 text-center">체크된 하차 완료 내역이 없습니다.</p>
                                    ) : (
                                        <div className="divide-y divide-[#f4eee4] max-h-60 overflow-y-auto">
                                            {filteredStats.myCompletedCompanies.map(([name, s], i) => (
                                                <div key={name} className="py-2.5 flex justify-between items-center text-xs">
                                                    <div className="flex items-center">
                                                        <span className="w-5 font-extrabold text-amber-700">{i+1}</span>
                                                        <span className="font-bold text-stone-700">{name}</span>
                                                    </div>
                                                    <span className="font-extrabold text-stone-800 bg-[#f4eee4] px-2.5 py-1 rounded-lg">{s}포</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 5. 하차지 목록 탭 */}
                        {activeTab === 'regions' && (
                            <div className="space-y-4">
                                {/* 명단 엑셀 일괄 업로드 박스 */}
                                <div className="bg-[#eef5f0] p-4 rounded-[24px] shadow-sm border border-[#cde0d3]">
                                    <h3 className="text-xs font-extrabold text-[#2c5e43] mb-1 flex items-center">
                                        <Icon name="file-spreadsheet" size={16} className="mr-1.5" />
                                        떡집명단 엑셀 일괄 동기화 ('떡집 주소' 시트)
                                    </h3>
                                    <p className="text-[11px] text-[#457359] mb-3 leading-relaxed">
                                        가지고 계신 <b>떡집명단_최종.xlsx</b> 파일을 올리시면 '떡집 주소' 시트의 상호·대표자·주소·전화번호가 한 번에 정확히 입력됩니다.
                                    </p>
                                    <label className="block w-full bg-[#3b6e52] hover:bg-[#2f5942] text-white text-center font-bold py-2.5 rounded-xl text-xs cursor-pointer transition active:scale-95 shadow-sm">
                                        📂 떡집명단 엑셀 파일 올리기
                                        <input type="file" accept=".xlsx, .xls, .csv" onChange={handleMasterExcelUpload} className="hidden" />
                                    </label>
                                </div>

                                <div className="bg-[#fffdfa] p-4 rounded-[24px] shadow-sm border border-[#e6dfd5]">
                                    <h3 className="text-xs font-extrabold text-stone-700 mb-2.5 flex items-center"><Icon name="plus-circle" /><span className="ml-1.5">신규/수정 하차지 개별 등록</span></h3>
                                    <form onSubmit={addRegion} className="space-y-2">
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="상호명 (필수)" value={newCompName} onChange={e=>setNewCompName(e.target.value)} className="flex-1 min-w-0 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs font-medium outline-none focus:bg-white focus:border-stone-500"/>
                                            <input type="text" placeholder="대표자" value={newCompRep} onChange={e=>setNewCompRep(e.target.value)} className="w-20 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs font-medium outline-none focus:bg-white focus:border-stone-500"/>
                                            <select value={newCompRegion} onChange={e=>setNewCompRegion(e.target.value)} className="shrink-0 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs font-bold text-stone-700 outline-none">
                                                <option value="제주시">제주시</option>
                                                <option value="신제주">신제주</option>
                                                <option value="서쪽">서쪽</option>
                                                <option value="동쪽">동쪽</option>
                                                <option value="서귀포">서귀포</option>
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="text" placeholder="주소 입력" value={newCompAddress} onChange={e=>setNewCompAddress(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs outline-none focus:bg-white focus:border-stone-500"/>
                                            <input type="text" placeholder="전화번호 입력" value={newCompPhone} onChange={e=>setNewCompPhone(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs outline-none focus:bg-white focus:border-stone-500"/>
                                        </div>
                                        <button type="submit" className="w-full bg-stone-700 text-white py-2.5 rounded-xl text-xs font-bold active:scale-95 transition shadow-sm">하차지 저장</button>
                                    </form>
                                </div>

                                <div className="bg-[#fffdfa] rounded-[24px] shadow-sm border border-[#e6dfd5] overflow-hidden">
                                    <div className="px-5 py-3.5 bg-[#f4eee4]/60 border-b border-[#e6dfd5] font-extrabold text-stone-700 text-xs flex justify-between items-center">
                                        <span>등록된 하차지 목록</span>
                                        <span className="bg-[#ede8df] text-stone-700 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold">{Object.keys(masterData).length}곳</span>
                                    </div>
                                    <div className="max-h-[340px] overflow-y-auto divide-y divide-[#f4eee4] px-2">
                                        {Object.keys(masterData).length === 0 ? (
                                            <div className="py-10 text-center text-xs text-stone-400 leading-relaxed">
                                                등록된 하차지 명단이 없습니다.<br/>
                                                위 초록색 버튼으로 <b>떡집명단 엑셀 파일</b>을 올려주세요.
                                            </div>
                                        ) : (
                                            Object.entries(masterData).map(([name, info], idx) => (
                                                <div key={idx} onClick={() => { setNewCompName(name); setNewCompRep(info.rep||''); setNewCompRegion(info.region); setNewCompAddress(info.address||''); setNewCompPhone(info.phone||''); }} className="px-3 py-3 flex justify-between items-center hover:bg-[#f7f4ef] rounded-xl cursor-pointer">
                                                    <div className="min-w-0 pr-2">
                                                        <div className="text-xs font-bold text-stone-800">
                                                            {name} {info.rep ? <span className="text-[11px] font-semibold text-stone-500">({info.rep})</span> : null}
                                                        </div>
                                                        <div className="text-[10px] text-stone-400 truncate mt-0.5">
                                                            {info.address || '주소미입력'} · {info.phone || '번호미입력'}
                                                        </div>
                                                    </div>
                                                    <span className="shrink-0 text-[11px] px-2.5 py-1 bg-[#ede8df] text-stone-600 rounded-full font-bold">{info.region}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 하단 탭 바 (5개 탭) */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#fffdfa]/95 backdrop-blur-md border-t border-[#e6dfd5] flex justify-around py-2 px-1 z-20 rounded-t-[24px] shadow-lg">
                        {[
                            { id: 'upload', icon: 'upload-cloud', label: '업로드' },
                            { id: 'my_delivery', icon: 'check-square', label: '나의 하차지' },
                            { id: 'history', icon: 'folder-clock', label: '내역조회' },
                            { id: 'stats', icon: 'pie-chart', label: '월별통계' },
                            { id: 'regions', icon: 'map-pin', label: '하차지 목록' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab === tab.id ? 'text-stone-900 font-extrabold scale-105' : 'text-stone-400 font-medium hover:text-stone-600'}`}
                            >
                                <Icon name={tab.icon} size={19} className={activeTab === tab.id ? 'stroke-[2.5px] text-amber-800' : 'stroke-[1.5px]'} />
                                <span className="text-[10px] mt-1 tracking-tight">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
