    const LOCAL_MASTER_KEY = 'rice_red_bean_master_v3';
    const LOCAL_HISTORY_KEY = 'rice_red_bean_history_v3';
    const LOCAL_AUTO_DL_KEY = 'rice_red_bean_auto_dl_v3';
    const ALL_REGIONS = ['제주시', '신제주', '서쪽', '동쪽', '서귀포', '미분류'];

    // 현재 연-월 (YYYY-MM)
    const getCurrentYearMonth = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    };

    // 파일명에서 연-월 추출
    const parseYearMonthFromFileName = (fileName) => {
      const isValidYM = (y, m) => y >= 2000 && y <= 2099 && m >= 1 && m <= 12;
      const patterns = [
        { re: /(?:20)?(\d{2})년\s*(\d{1,2})월/, toYear: (v) => 2000 + Number(v) },
        { re: /(20\d{2})[-._](\d{1,2})(?:[^\d]|$)/, toYear: (v) => Number(v) },
        { re: /(?:^|[^\d])(\d{2})[-._](\d{1,2})(?:[^\d]|$)/, toYear: (v) => 2000 + Number(v) },
        { re: /_(\d{2})(\d{2})\d{2}(?:[^\d]|$)/, toYear: (v) => 2000 + Number(v) }
      ];
      for (const { re, toYear } of patterns) {
        const match = String(fileName || '').match(re);
        if (match) {
          const y = toYear(match[1]);
          const m = Number(match[2]);
          if (isValidYM(y, m)) return `${y}-${String(m).padStart(2, '0')}`;
        }
      }
      return getCurrentYearMonth();
    };

    // 안전한 정수 파싱 ("20포(400kg)" -> 20)
    const parseSafeInt = (val) => {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return Number.isFinite(val) ? Math.round(val) : 0;
      const str = String(val).replace(/,/g, '').trim();
      const sackMatch = str.match(/(\d+(?:\.\d+)?)\s*포/);
      if (sackMatch) return Math.round(Number(sackMatch[1])) || 0;
      const numMatch = str.match(/\d+(?:\.\d+)?/);
      if (!numMatch) return 0;
      return Math.round(Number(numMatch[0])) || 0;
    };

    // 주소 기반 권역 자동 추론
    const inferRegionByAddress = (address = "") => {
      const addr = String(address).trim();
      if (!addr) return "미분류";
      if (addr.includes("애월") || addr.includes("한림") || addr.includes("한경") || addr.includes("대정") || addr.includes("안덕") || addr.includes("우정로") || addr.includes("외도")) return "서쪽";
      if (addr.includes("조천") || addr.includes("구좌") || addr.includes("성산") || addr.includes("표선") || addr.includes("남원")) return "동쪽";
      if (addr.includes("서귀포")) return "서귀포";
      const shinJejuKeywords = ["다랑곶", "과원", "신대로", "도공로", "오일장", "성신로", "우령", "아연로", "노형", "연동", "노연로", "원노형", "수덕로", "정존", "월랑로", "한라대학로", "신광로", "삼무로", "도령로", "연북로", "제원"];
      if (shinJejuKeywords.some(k => addr.includes(k))) return "신제주";
      if (addr.includes("제주시")) return "제주시";
      return "미분류";
    };

    // 떡집 명단 스마트 매칭
    const findSmartMasterInMap = (masterMap, rawName, rawRep = "", rawPhone = "", rawAddr = "") => {
      const cleanName = String(rawName || "").trim();
      const noSpaceName = cleanName.replace(/\s+/g, "");
      const cleanRep = String(rawRep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
      const cleanPhone = String(rawPhone || "").replace(/[^0-9]/g, "");
      const cleanAddr = String(rawAddr || "").replace(/\s+/g, "");
      const stripSuffix = (str) => String(str || "").replace(/\s+/g, "").replace(/\(주\)|㈜/g, "").replace(/(떡방앗간|떡방아간|떡방아|떡방|떡집|방앗간|방아간|오메기떡|오메기|식품|양과)/g, "");
      const coreTarget = stripSuffix(cleanName);

      if (masterMap[cleanName]) return { ...masterMap[cleanName], name: cleanName };
      const entries = Object.entries(masterMap);
      for (const [k, info] of entries) {
        if (k.replace(/\s+/g, "") === noSpaceName) return { ...info, name: k };
      }

      if (cleanPhone.length >= 8) {
        const tail = cleanPhone.slice(-8);
        for (const [k, info] of entries) {
          const mPhone = String(info.phone || "").replace(/[^0-9]/g, "");
          if (mPhone.length >= 8 && mPhone.slice(-8) === tail) return { ...info, name: k };
        }
      }

      if (cleanRep.length >= 2) {
        const repMatches = entries.filter(([k, info]) => {
          const mRep = String(info.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
          return mRep && (mRep === cleanRep || mRep.includes(cleanRep) || cleanRep.includes(mRep));
        });
        if (repMatches.length === 1) return { ...repMatches[0][1], name: repMatches[0][0] };
        if (repMatches.length > 1) {
          for (const [k, info] of repMatches) {
            const cKey = stripSuffix(k);
            if (coreTarget.length >= 2 && cKey && (cKey.includes(coreTarget) || coreTarget.includes(cKey))) return { ...info, name: k };
            const mAddr = String(info.address || "").replace(/\s+/g, "");
            if (cleanAddr.length >= 4 && mAddr && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) return { ...info, name: k };
          }
        }
      }

      if (coreTarget.length >= 2) {
        for (const [k, info] of entries) {
          const cKey = stripSuffix(k);
          if (cKey && cKey === coreTarget) return { ...info, name: k };
        }
      }

      if (cleanAddr.length >= 6) {
        for (const [k, info] of entries) {
          const mAddr = String(info.address || "").replace(/\s+/g, "");
          if (mAddr.length >= 6 && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) return { ...info, name: k };
        }
      }
      return null;
    };

    // 명단과 행 데이터 결합 (isFixed 포함)
    const resolveRowWithMaster = (row, masterMap) => {
      const cleanName = String(row.name || '').trim();
      const master = findSmartMasterInMap(masterMap, cleanName, row.rep, row.phone, row.address);
      const address = (master && master.address) ? master.address : (row.address || '');
      const phone = (master && master.phone) ? master.phone : (row.phone || '');
      const region = (master && master.region && master.region !== '미분류')
        ? master.region
        : ((row.region && row.region !== '미분류') ? row.region : inferRegionByAddress(address));
      return {
        master,
        name: (master && master.name) ? master.name : cleanName,
        rep: row.rep || (master && master.rep ? master.rep : ''),
        address,
        phone,
        region,
        isFixed: Boolean(master && master.isFixed)
      };
    };

    // 다중 JSON 블록 안전 추출기
    const extractJsonBlocks = (rawText) => {
      const cleaned = rawText.replace(/```(?:json|csv|tsv|text)?/gi, '').replace(/```/g, '').trim();
      const items = [];
      let embeddedTotal = 0;
      let hasEmbeddedTotal = false;
      let parsedBlockCount = 0;
      let sawJsonDelimiter = false;
      let inString = false;
      let escaped = false;
      let depth = 0;
      let openChar = '';
      let closeChar = '';
      let startIdx = -1;

      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        if (inString) {
          if (escaped) escaped = false;
          else if (ch === '\\') escaped = true;
          else if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') { inString = true; continue; }
        if (depth === 0) {
          if (ch === '{' || ch === '[') {
            sawJsonDelimiter = true;
            openChar = ch;
            closeChar = ch === '{' ? '}' : ']';
            depth = 1;
            startIdx = i;
          }
        } else {
          if (ch === openChar) depth++;
          else if (ch === closeChar) {
            depth--;
            if (depth === 0 && startIdx !== -1) {
              try {
                const parsed = JSON.parse(cleaned.slice(startIdx, i + 1));
                if (Array.isArray(parsed)) {
                  items.push(...parsed);
                  parsedBlockCount++;
                } else if (parsed && Array.isArray(parsed.items)) {
                  items.push(...parsed.items);
                  const blockTotal = parseSafeInt(parsed.expectedTotal ?? parsed.totalSacks ?? parsed.합계);
                  if (blockTotal > 0) {
                    embeddedTotal += blockTotal;
                    hasEmbeddedTotal = true;
                  }
                  parsedBlockCount++;
                }
              } catch (e) {}
              startIdx = -1;
            }
          }
        }
      }

      if (parsedBlockCount > 0) return { items, embeddedTotal: hasEmbeddedTotal ? embeddedTotal : null };
      if (sawJsonDelimiter) return { error: "JSON 형식이 깨져 있습니다. 복사 시 끝 괄호가 잘렸는지 확인해 주세요." };
      return null;
    };

    const serializeHistoryDoc = (docObj, fallbackItemType) => ({
      fileName: docObj.fileName,
      itemType: docObj.itemType || fallbackItemType,
      yearMonth: docObj.yearMonth,
      uploadDate: docObj.uploadDate,
      timestamp: docObj.timestamp,
      totalSacks: docObj.totalSacks,
      totalKrSacks: docObj.totalKrSacks ?? docObj.totalSacks,
      totalUsSacks: docObj.totalUsSacks ?? 0,
      expectedTotal: docObj.expectedTotal ?? null,
      totalMismatch: Boolean(docObj.totalMismatch),
      unclassifiedCount: docObj.unclassifiedCount || 0,
      unregisteredList: docObj.unregisteredList || [],
      typoList: docObj.typoList || [],
      recordsJson: JSON.stringify(docObj.data || [])
    });

    // 하차지 선택 여부 (기존 데이터 호환: selected가 없으면 completed 값을 따름)
    const isRowSelected = (row) => {
      if (!row) return false;
      if (row.selected !== undefined && row.selected !== null) return Boolean(row.selected);
      return Boolean(row.completed);
    };

    // 선택한 하차지의 담당 포대 수량 (절반/수동 조정 반영)
    const getEffectiveSelectedSacks = (row) => {
      if (!isRowSelected(row)) return 0;
      if (row.mySacks !== undefined && row.mySacks !== null) return Number(row.mySacks) || 0;
      return (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
    };

    // 하차 완료된 실제 포대 수량 (월별통계 및 내역조회 기준)
    const getEffectiveCompletedSacks = (row) => {
      if (!row || !row.completed) return 0;
      if (row.mySacks !== undefined && row.mySacks !== null) return Number(row.mySacks) || 0;
      return (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
    };

      'alert-circle': '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',

      'file-spreadsheet': '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/>',

      'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',

    const Icon = ({ name, size = 18, className = "", filled = false }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill={filled ? "currentColor" : "none"}
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={`inline-block shrink-0 ${className}`}
        dangerouslySetInnerHTML={{ __html: ICON_PATHS[name] || '' }}
      />
    );

    const copyTextSafe = async (text) => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    };

    const writeLocalStorage = (key, value, onFail) => {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (e) {
        if (onFail) onFail(e);
        return false;
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('upload');
      const [dbStatus, setDbStatus] = useState('connecting');
      const [dbErrorMsg, setDbErrorMsg] = useState('');
      const [authUser, setAuthUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const dbRef = useRef(null);
      // 클라우드 명단 최초 스냅샷 로드 완료 여부 (로딩 전 빈 명단 덮어쓰기 원천 차단)
      const masterSyncReadyRef = useRef(false);

      const [masterData, setMasterData] = useState(() => {
        try {
          const saved = localStorage.getItem(LOCAL_MASTER_KEY) || localStorage.getItem('rice_red_bean_master_v2');
          return saved ? JSON.parse(saved) : {};
        } catch (e) { return {}; }

        try {
          if (typeof firebase === 'undefined') {

          const firestore = firebase.firestore();

          const handleSyncError = (err) => {
            const code = err && err.code ? err.code : 'unknown';
            if (code === 'resource-exhausted') {
              setDbStatus('quota');
              setDbErrorMsg('오늘 무료 쓰기/읽기 한도(2만 건) 초과. 오후 4~5시 초기화됩니다.');

              setDbStatus('denied');
              setDbErrorMsg('Firestore 보안 규칙에서 현재 계정의 UID가 허용되지 않았습니다.');

              setDbStatus('local');
              setDbErrorMsg(`연결 오류 (${code}): 오프라인/로컬 모드로 작동 중`);
            }
          };

          unsubAuth = firebase.auth().onAuthStateChanged((user) => {
            if (!isMounted) return;
            detachListeners();
            masterSyncReadyRef.current = false;
            if (!user) {
              dbRef.current = null;
              setAuthUser(null);
              setDbStatus('auth_required');
              setDbErrorMsg('클라우드 동기화를 위해 로그인이 필요합니다.');
              setShowAuthModal(true);
              return;
            }
            setAuthUser(user);
            setShowAuthModal(false);
            setDbStatus('connecting');
            dbRef.current = firestore;

            unsubMaster = firestore.collection('rrb_master').doc('all_shops').onSnapshot((docSnap) => {
              masterSyncReadyRef.current = true;
              setDbStatus('connected');
              setDbErrorMsg('');
              if (docSnap.exists) {
                const d = docSnap.data();
                if (d && d.shopsJson) {
                  try {

                    setMasterData(parsed);
                    writeLocalStorage(LOCAL_MASTER_KEY, JSON.stringify(parsed));
                  } catch (e) {}
                }
              }
            }, handleSyncError);

            unsubHistory = firestore.collection('rrb_history').onSnapshot((snapshot) => {
              setDbStatus('connected');
              setDbErrorMsg('');
              const loaded = [];
              snapshot.forEach(docSnap => {
                const d = docSnap.data();
                let parsedRows = [];
                try { parsedRows = JSON.parse(d.recordsJson || "[]"); } catch (e) {}
                loaded.push({ ...d, id: docSnap.id, data: parsedRows });
              });
              loaded.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
              setHistory(loaded);
              if (loaded.length > 0) setSelectedDeliveryDocId(prev => prev || loaded[0].id);
            }, handleSyncError);
          });
        } catch (e) {
          setDbStatus('local');
          setDbErrorMsg(`초기화 오류: ${e.message}`);
        }

        return () => {
          isMounted = false;
          detachListeners();
          if (unsubAuth) unsubAuth();

      const saveMasterToCloud = async (nextMaster, allowBeforeSync = false) => {
        // 클라우드 최초 명단 로딩 전에는 덮어쓰기 원천 차단
        if (dbRef.current && !masterSyncReadyRef.current && !allowBeforeSync) {

        if (!dbRef.current) return { synced: false, reason: 'offline' };
        try {
          await dbRef.current.collection('rrb_master').doc('all_shops').set({
            shopsJson: JSON.stringify(nextMaster),
            count: Object.keys(nextMaster).length,
            updatedAt: Date.now()
          });
          setDbStatus('connected');
          return { synced: true, reason: null };
        } catch (err) {
          const code = err && err.code ? err.code : 'unknown';

      const toggleFixedShop = async (shopName, fallbackRow = null) => {

          return;
        }

        const matched = masterData[cleanName]
          ? { ...masterData[cleanName], name: cleanName }
          : (fallbackRow ? findSmartMasterInMap(masterData, cleanName, fallbackRow.rep, fallbackRow.phone, fallbackRow.address) : null);

        let targetKey = cleanName;
        let nextEntry;
        let nextFixedState;

        if (matched && masterData[matched.name]) {
          targetKey = matched.name;
          nextFixedState = !Boolean(masterData[targetKey].isFixed);
          nextEntry = { ...masterData[targetKey], isFixed: nextFixedState };
        } else if (fallbackRow) {
          nextFixedState = true;
          nextEntry = {
            name: cleanName,
            rep: fallbackRow.rep || '',
            region: (fallbackRow.resolvedRegion && fallbackRow.resolvedRegion !== '미분류') ? fallbackRow.resolvedRegion : inferRegionByAddress(fallbackRow.address),
            address: fallbackRow.address || '',
            phone: fallbackRow.phone || '',
            isFixed: true
          };
        } else {
          return;
        }

        const nextMaster = { ...masterData, [targetKey]: nextEntry };
        const res = await saveMasterToCloud(nextMaster);
        if (res.reason === 'syncing') return;
        if (res.synced) {
          showToast(nextFixedState ? `★ '${targetKey}' 고정 방문업체로 지정됨` : `'${targetKey}' 고정 방문업체 해제됨`, "success");

      // 저장된 작업 내역서(쌀·팥)에서 누락된 하차지 명단 원터치 복구·병합
      const handleRecoverMasterFromHistory = async () => {
        if (history.length === 0) {
          showToast("복구할 작업 내역서가 없습니다.", "error");
          return;
        }
        const merged = { ...masterData };
        let addedCount = 0;

        // 최신 내역서부터 순회하며 주소·전화번호가 있는 업체를 스마트 중복 체크 후 병합
        history.forEach(doc => {
          (doc.data || []).forEach(row => {
            const name = String(row.name || '').trim();
            if (!name) return;
            const existing = findSmartMasterInMap(merged, name, row.rep, row.phone, row.address);
            if (!existing) {
              const addr = row.address || '';
              const region = (row.region && row.region !== '미분류') ? row.region : inferRegionByAddress(addr);
              merged[name] = {
                name,
                rep: row.rep || '',
                region,
                address: addr,
                phone: row.phone || '',
                isFixed: false
              };
              addedCount++;
            } else {
              // 기존 항목에 주소/전화번호가 비어있다면 내역서 정보로 보충
              const cur = merged[existing.name];
              if (cur && ((!cur.address && row.address) || (!cur.phone && row.phone))) {
                merged[existing.name] = {
                  ...cur,
                  address: cur.address || row.address || '',
                  phone: cur.phone || row.phone || ''
                };
              }
            }
          });
        });

        if (addedCount === 0) {
          showToast("내역서에 추가로 복구할 누락 업체가 없습니다.", "info");
          return;
        }

        const res = await saveMasterToCloud(merged);
        if (res.synced) {
          showToast(`작업 내역서에서 누락된 ${addedCount}곳을 복구했습니다! (총 ${Object.keys(merged).length}곳)`, "success");
        } else if (res.reason !== 'syncing') {
          showToast(`${addedCount}곳 로컬 복구 완료 (총 ${Object.keys(merged).length}곳)`, "info");
        }
      };

      const copyGeminiFaxPrompt = async () => {
        const promptText = `팩스 공급내역서 사진을 읽어서 아래 JSON 형식으로만 정확히 추출해줘.

{

        } catch (e) {

        }
      };

      const handleProcessPastedText = async () => {
        const raw = pasteText.trim();
        if (!raw) {
          showToast("제미나이가 뽑아준 내용을 먼저 붙여넣어 주세요.", "error");
          return;
        }
        const ym = pasteYearMonth || getCurrentYearMonth();
        const now = new Date();
        const mmdd = `${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const fileName = `${selectedItemType}_제미나이직접입력_${mmdd}`;
        let rows2D = [];
        let expectedTotal = parseSafeInt(pasteExpectedTotal) || null;

        const jsonAttempt = extractJsonBlocks(raw);
        if (jsonAttempt && jsonAttempt.error) {
          showToast(jsonAttempt.error, "error");
          return;
        }
        if (jsonAttempt && jsonAttempt.items && jsonAttempt.items.length > 0) {
          if (!expectedTotal && jsonAttempt.embeddedTotal) expectedTotal = jsonAttempt.embeddedTotal;
          rows2D.push(["번호", "상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]);
          jsonAttempt.items.forEach((item, idx) => {
            rows2D.push([
              item.no || (idx + 1),
              item.name || item.상호 || item.업체명 || "",
              item.rep || item.대표자 || item.성명 || "",
              item.address || item.주소 || "",
              item.phone || item.전화번호 || "",
              item.sacks ?? item.국산 ?? item.수량 ?? item.포 ?? 0,
              item.usSacks ?? item.미국산 ?? item.수입 ?? 0
            ]);
          });
        } else {
          const cleaned = raw.replace(/^```(?:csv|tsv|text)?\s*/i, '').replace(/\s*```$/, '').trim();
          const lines = cleaned.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          for (const line of lines) {
            if (/^[\|\-\s:]+$/.test(line)) continue;
            let cols = [];
            if (line.includes('|')) cols = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
            else if (line.includes('\t')) cols = line.split('\t').map(c => c.trim());
            else cols = line.split(',').map(c => c.trim());
            if (cols.length >= 2) rows2D.push(cols);
          }
          const firstRowStr = (rows2D[0] || []).join(' ');
          if (rows2D.length > 0 && !firstRowStr.includes('상호') && !firstRowStr.includes('업체')) {
            const colCnt = rows2D[0].length;
            if (colCnt === 2) rows2D.unshift(["상호", "국산(포)"]);
            else if (colCnt === 3) rows2D.unshift(["상호", "대표자", "국산(포)"]);
            else rows2D.unshift(["번호", "상호", "대표자", "국산(포)", "미국산(포)"]);
          }
        }

        if (rows2D.length < 2) {
          showToast("읽을 수 있는 업체 내역이 없습니다.", "error");
          return;
        }

        setShowPasteModal(false);
        setPasteText('');
        setPasteExpectedTotal('');
        await processRowsData(rows2D, fileName, ym, selectedItemType, expectedTotal);
      };

      // 공급내역서 분류 엔진 (고정 방문업체 자동 선택 적용)
      const processRowsData = async (rows, fileName, yearMonth, itemType = '쌀', expectedTotal = null) => {
        if (Object.keys(masterData).length === 0) {
          showToast("등록된 떡집 명단이 0곳입니다. [하차지 목록]에서 명단 엑셀을 먼저 올려주세요.", "error");
        }
        let headerRowIdx = -1;
        let colMap = {};

        for (let i = 0; i < Math.min(rows.length, 25); i++) {
          const row = rows[i];
          if (!row || !Array.isArray(row)) continue;
          const rowStr = row.join(" ");
          if ((rowStr.includes("상호") || rowStr.includes("업체명")) && (rowStr.includes("포") || rowStr.includes("수량") || rowStr.includes("국산") || rowStr.includes("미국산") || rowStr.includes("25kg") || rowStr.includes("20kg"))) {
            headerRowIdx = i;
            let fallbackKrIdx = undefined;
            let fallbackUsIdx = undefined;
            row.forEach((cell, idx) => {
              if (cell === null || cell === undefined) return;
              const cleanCell = String(cell).replace(/\s+/g, "");
              const lowerCell = cleanCell.toLowerCase();
              const isPureKgCol = lowerCell.includes("kg") && !cleanCell.includes("포");
              if (cleanCell.includes("번호") && !cleanCell.includes("코드") && !cleanCell.includes("전화")) colMap.no = idx;
              else if (cleanCell.includes("상호") || cleanCell.includes("업체명")) colMap.name = idx;
              else if (cleanCell.includes("대표") || cleanCell.includes("성명")) colMap.rep = idx;
              else if (cleanCell.includes("주소") || cleanCell.includes("소재지")) colMap.address = idx;
              else if (cleanCell.includes("전화") || cleanCell.includes("연락처")) colMap.phone = idx;
              else if (!isPureKgCol && (cleanCell.includes("미국산") || cleanCell.includes("외국산") || cleanCell.includes("수입"))) {
                if (cleanCell.includes("포") || cleanCell.includes("수량")) { if (colMap.usSack === undefined) colMap.usSack = idx; }
                else if (fallbackUsIdx === undefined) fallbackUsIdx = idx;
              } else if (!isPureKgCol && (cleanCell.includes("국산") || cleanCell.includes("포") || cleanCell.includes("수량"))) {
                if (cleanCell.includes("포")) { if (colMap.sack === undefined) colMap.sack = idx; }
                else if (fallbackKrIdx === undefined) fallbackKrIdx = idx;
              }
            });
            if (colMap.sack === undefined && fallbackKrIdx !== undefined) colMap.sack = fallbackKrIdx;
            if (colMap.usSack === undefined && fallbackUsIdx !== undefined) colMap.usSack = fallbackUsIdx;
            break;
          }
        }

        if (headerRowIdx === -1 || colMap.name === undefined) {
          showToast("데이터에서 '상호'나 '수량(포)' 열을 찾을 수 없습니다.", "error");
          return;
        }

        const parsedList = [];
        let totalKrSacks = 0;
        let totalUsSacks = 0;
        let unclassifiedCount = 0;
        let autoFixedSelectedCount = 0;
        const unregisteredList = [];
        const typoList = [];

        for (let i = headerRowIdx + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;
          const rawName = row[colMap.name];
          if (!rawName) continue;
          const cleanName = String(rawName).trim();
          if (cleanName === "" || cleanName.includes("합계") || cleanName.includes("총계") || cleanName.includes("소계")) continue;

          const origNo = colMap.no !== undefined ? row[colMap.no] : (parsedList.length + 1);
          const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";
          const sacks = colMap.sack !== undefined ? parseSafeInt(row[colMap.sack]) : 0;
          const usSacks = colMap.usSack !== undefined ? parseSafeInt(row[colMap.usSack]) : 0;
          if (sacks === 0 && usSacks === 0) continue;

          const rowAddr = (colMap.address !== undefined && row[colMap.address]) ? String(row[colMap.address]).trim() : "";
          const rowPhone = (colMap.phone !== undefined && row[colMap.phone]) ? String(row[colMap.phone]).trim() : "";
          const resolved = resolveRowWithMaster({ name: cleanName, rep, address: rowAddr, phone: rowPhone }, masterData);

          if (resolved.region === "미분류") unclassifiedCount++;
          if (resolved.isFixed) autoFixedSelectedCount++;

          if (!resolved.master) {
            unregisteredList.push({ no: origNo, name: cleanName, rep, phone: rowPhone, address: rowAddr, sacks: sacks + usSacks });
          } else {
            const normFileName = cleanName.replace(/\s+/g, "");
            const normMasterName = String(resolved.master.name || "").replace(/\s+/g, "");
            const normFileRep = String(rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
            const normMasterRep = String(resolved.master.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
            const nameDiff = normFileName !== normMasterName;
            const repDiff = Boolean(normFileRep && normMasterRep && normFileRep !== normMasterRep);
            if (nameDiff || repDiff) {
              typoList.push({ no: origNo, fileName: cleanName, masterName: resolved.master.name, fileRep: rep, masterRep: resolved.master.rep || "", nameDiff, repDiff });
            }
          }

          totalKrSacks += sacks;
          totalUsSacks += usSacks;
          parsedList.push({
            no: origNo,
            name: resolved.name,
            rep: resolved.rep,
            region: resolved.region,
            address: resolved.address,
            phone: resolved.phone,
            sacks,
            usSacks,
            selected: resolved.isFixed,
            completed: false,
            mySacks: null
          });
        }

        if (parsedList.length === 0) {
          showToast("배정된 포대 수량이 있는 업체가 없습니다.", "error");
          return;
        }

        const totalSacks = totalKrSacks + totalUsSacks;
        const totalMismatch = Boolean(expectedTotal && expectedTotal !== totalSacks);
        const docId = `doc_${Date.now()}`;
        const newDoc = {
          id: docId,
          fileName,
          itemType,
          yearMonth,
          uploadDate: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
          timestamp: Date.now(),
          totalSacks,
          totalKrSacks,
          totalUsSacks,
          expectedTotal: expectedTotal || null,
          totalMismatch,
          unclassifiedCount,
          unregisteredList,
          typoList,
          data: parsedList
        };

        const commitNewDoc = async () => {
          setHistory(prev => [newDoc, ...prev.filter(h => h.id !== docId)]);
          setCurrentDocId(docId);
          setSelectedDeliveryDocId(docId);
          const fixedNote = autoFixedSelectedCount > 0 ? ` · ★고정 ${autoFixedSelectedCount}곳 자동선택` : '';
          const alertSuffix = (unregisteredList.length > 0 || typoList.length > 0) ? ` (미등록 ${unregisteredList.length}·확인 ${typoList.length})` : "";

          if (dbRef.current) {
            try {
              await dbRef.current.collection('rrb_history').doc(docId).set(serializeHistoryDoc(newDoc, itemType));
              showToast(
                totalMismatch ? `팩스 합계(${expectedTotal}포)와 추출 합계(${totalSacks}포)가 다릅니다.` : `분류 및 저장 완료 (총 ${totalSacks}포${fixedNote})${alertSuffix}`,
                (totalMismatch || unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success"
              );
            } catch (e) {
              showToast(`클라우드 저장 실패로 로컬에만 보관됨 (총 ${totalSacks}포${fixedNote})${alertSuffix}`, "error");
            }
          } else {
            showToast(
              totalMismatch ? `팩스 합계(${expectedTotal}포)와 추출 합계(${totalSacks}포)가 다릅니다.` : `로컬 저장 완료 (총 ${totalSacks}포${fixedNote})${alertSuffix}`,
              (totalMismatch || unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success"
            );
          }
          if (autoDownloadExcel && !totalMismatch) setTimeout(() => exportToExcel(newDoc, itemType), 250);
        };

        const isDuplicate = history.some(h =>
          h.yearMonth === yearMonth &&
          (h.itemType || '쌀') === itemType &&
          Number(h.totalSacks) === totalSacks &&
          (h.data || []).length === parsedList.length
        );

        if (totalMismatch) {
          setConfirmDialog({
            title: '팩스 총합계 불일치 감지',
            message: `팩스 기준 합계는 ${expectedTotal}포인데, 추출된 합계는 ${totalSacks}포입니다 (차이: ${totalSacks - expectedTotal > 0 ? '+' : ''}${totalSacks - expectedTotal}포). 그래도 이대로 저장할까요?`,
            confirmText: '그대로 저장',
            danger: true,
            onConfirm: commitNewDoc
          });
        } else if (isDuplicate) {
          setConfirmDialog({
            title: '중복 내역 감지',
            message: `${yearMonth} [${itemType}] ${parsedList.length}곳 · 총 ${totalSacks}포와 동일한 내역이 이미 있습니다. 한 번 더 저장할까요?`,
            confirmText: '추가 저장',
            danger: false,
            onConfirm: commitNewDoc
          });
        } else {
          await commitNewDoc();
        }
      };

      const persistDocUpdate = async (updatedDoc) => {
        setHistory(prev => prev.map(h => h.id === updatedDoc.id ? updatedDoc : h));
        if (dbRef.current) {
          try {
            await dbRef.current.collection('rrb_history').doc(updatedDoc.id).set(serializeHistoryDoc(updatedDoc, selectedItemType), { merge: true });
          } catch (e) {
            showToast("클라우드 동기화에 실패해 로컬에만 반영되었습니다.", "error");
          }
        }
      };

      // [분리 1] 하차지 선택 토글
      const toggleDeliverySelect = async (docObj, rowIndex) => {
        if (!docObj) return;
        const updatedData = docObj.data.map((item, idx) => {
          if (idx !== rowIndex) return item;
          const nextSelected = !isRowSelected(item);
          return {
            ...item,
            selected: nextSelected,
            completed: nextSelected ? Boolean(item.completed) : false,
            mySacks: nextSelected ? item.mySacks : null
          };
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
      };

      // [분리 2] 하차 완료 토글
      const toggleDeliveryComplete = async (docObj, rowIndex) => {
        if (!docObj) return;
        const updatedData = docObj.data.map((item, idx) => {
          if (idx !== rowIndex) return item;
          const nextCompleted = !Boolean(item.completed);
          return {
            ...item,
            selected: true,
            completed: nextCompleted
          };
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
      };

      // 절반 수량 토글
      const toggleHalfDelivery = async (docObj, rowIndex) => {
        if (!docObj) return;
        const updatedData = docObj.data.map((item, idx) => {
          if (idx === rowIndex) {
            const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
            const selectedNow = isRowSelected(item);
            const isCurrentlySplit = Boolean(selectedNow && item.mySacks !== undefined && item.mySacks !== null && Number(item.mySacks) < total);
            if (isCurrentlySplit) return { ...item, selected: true, mySacks: null };
            const halfVal = total >= 2 ? Math.floor(total / 2) : total;
            return { ...item, selected: true, mySacks: halfVal };
          }
          return item;
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
      };

      // 포대 수량 1포 단위 미세 조정
      const adjustMySacks = async (docObj, rowIndex, delta) => {
        if (!docObj) return;
        const updatedData = docObj.data.map((item, idx) => {
          if (idx === rowIndex) {
            const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
            const cur = (item.mySacks !== undefined && item.mySacks !== null) ? Number(item.mySacks) : total;
            const nextVal = Math.max(1, Math.min(total, cur + delta));
            return { ...item, selected: true, mySacks: nextVal === total ? null : nextVal };
          }
          return item;
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
      };

      // 권역 일괄 하차지 선택 / 선택 해지
      const setBulkDeliverySelect = async (docObj, targetIndices, status) => {
        if (!docObj || !targetIndices || targetIndices.length === 0) return;
        const idxSet = new Set(targetIndices);
        const updatedData = docObj.data.map((item, idx) => {
          if (!idxSet.has(idx)) return item;
          return {
            ...item,
            selected: status,
            completed: status ? Boolean(item.completed) : false,
            mySacks: status ? item.mySacks : null
          };
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
        showToast(status ? `${targetIndices.length}곳 하차지 일괄 선택 완료` : `${targetIndices.length}곳 선택 해지 완료`, "success");
      };

      // 선택한 목록에서 일괄 하차 완료 / 완료 해지
      const setBulkDeliveryComplete = async (docObj, targetIndices, status) => {
        if (!docObj || !targetIndices || targetIndices.length === 0) return;
        const idxSet = new Set(targetIndices);
        const updatedData = docObj.data.map((item, idx) => {
          if (!idxSet.has(idx)) return item;
          return { ...item, selected: true, completed: status };
        });
        await persistDocUpdate({ ...docObj, data: updatedData });
        showToast(status ? `${targetIndices.length}곳 일괄 하차 완료 처리됨` : `${targetIndices.length}곳 하차 완료 해지됨`, "success");
      };

      // 현재 내역서에 고정 방문업체 한 번에 선택 적용
      const applyFixedShopsToDoc = async (docObj) => {
        if (!docObj || !docObj.data) return;
        if (fixedShopCount === 0) {
          showToast("지정된 고정 방문업체가 없습니다. 업체 옆 ★ 별표를 눌러 먼저 지정해 주세요.", "info");
          return;
        }
        let matchedCount = 0;
        let newlySelectedCount = 0;
        const updatedData = docObj.data.map(item => {
          const resolved = resolveRowWithMaster(item, masterData);
          if (resolved.isFixed) {
            matchedCount++;
            if (!isRowSelected(item)) newlySelectedCount++;
            return { ...item, selected: true };
          }
          return item;
        });

        if (matchedCount === 0) {
          showToast("이번 내역서에는 지정된 고정 방문업체가 없습니다.", "info");
          return;
        }
        await persistDocUpdate({ ...docObj, data: updatedData });
        if (newlySelectedCount > 0) {
          showToast(`★ 고정 방문업체 ${newlySelectedCount}곳을 추가 선택했습니다! (총 ${matchedCount}곳 포함)`, "success");
        } else {
          showToast(`★ 이번 내역서의 고정 방문업체 ${matchedCount}곳이 이미 모두 선택되어 있습니다.`, "info");
        }
      };

      const deleteHistoryDoc = async (docId) => {
        if (currentDocId === docId) setCurrentDocId('');
        setHistory(prev => {
          const next = prev.filter(h => h.id !== docId);
          if (selectedDeliveryDocId === docId) setSelectedDeliveryDocId(next.length > 0 ? next[0].id : '');
          return next;
        });
        if (dbRef.current) {
          try {
            await dbRef.current.collection('rrb_history').doc(docId).delete();
            showToast("클라우드 내역이 삭제되었습니다.", "success");
          } catch (err) {
            showToast("클라우드 삭제 실패로 로컬에서만 제거되었습니다.", "error");
          }
        } else {
          showToast("내역이 삭제되었습니다.", "success");
        }
      };

      const copyRegionKakaoText = async (docObj, regionsList, titleLabel) => {
        if (!docObj || !docObj.data) return;
        const itemLabel = docObj.itemType || (docObj.fileName && docObj.fileName.includes("팥") ? "팥" : selectedItemType);
        const resolved = docObj.data.map(item => {
          const r = resolveRowWithMaster(item, masterData);
          return { name: r.name, address: r.address, phone: r.phone, region: r.region, sacks: Number(item.sacks) || 0, usSacks: Number(item.usSacks) || 0 };
        });
        const unclassifiedItems = resolved.filter(r => r.region === '미분류');
        const lines = [`[${itemLabel} 배차 - ${titleLabel}]`];
        let grandTotal = 0;

        regionsList.forEach(regName => {
          const list = resolved.filter(r => r.region === regName);
          if (list.length === 0) return;
          let subSum = 0;
          lines.push(`\n■ ${regName} (${list.length}곳)`);
          list.forEach((it, idx) => {
            const tot = it.sacks + it.usSacks;
            subSum += tot;
            grandTotal += tot;
            const detail = (itemLabel === '쌀' && it.usSacks > 0) ? `(국${it.sacks}/미${it.usSacks})` : '';
            lines.push(`${idx + 1}. ${it.name} : ${tot}포${detail}${it.address ? ` / ${it.address}` : ''}`);
          });
          lines.push(`▶ ${regName} 소계: ${subSum}포`);
        });

        if (grandTotal === 0) {
          showToast(`${titleLabel}에 배정된 물량이 없습니다.`, "error");
          return;
        }
        lines.push(`\n총 합계: ${grandTotal}포`);
        const ok = await copyTextSafe(lines.join('\n'));
        if (ok) {
          if (unclassifiedItems.length > 0 && !regionsList.includes('미분류')) {
            showToast(`[${titleLabel}] 복사 완료 (${grandTotal}포) · 미분류 ${unclassifiedItems.length}곳 별도 확인 필요`, "error");
          } else {
            showToast(`[${titleLabel}] 카톡 명단 복사 완료 (${grandTotal}포)`, "success");
          }
        }
      };

      const exportToExcel = (docToExport, overrideItemType = null) => {
        if (!docToExport || !docToExport.data) return;
        const recoveredData = [];
        docToExport.data.forEach((item, idx) => {
          const origNo = item.no !== undefined ? item.no : (idx + 1);
          const sacks = Number(item.sacks) || 0;
          const usSacks = Number(item.usSacks) || 0;
          if (sacks > 0 || usSacks > 0) {
            const r = resolveRowWithMaster(item, masterData);
            recoveredData.push({ no: origNo, name: r.name, rep: r.rep, region: r.region, address: r.address, phone: r.phone, sacks, usSacks: usSacks > 0 ? usSacks : "" });
          }
        });
        if (recoveredData.length === 0) {
          showToast("추출할 수량이 있는 데이터가 없습니다.", "error");
          return;
        }

        const wb = XLSX.utils.book_new();
        const itemLabel = overrideItemType || docToExport.itemType || (docToExport.fileName && docToExport.fileName.includes("팥") ? "팥" : selectedItemType);
        const isBean = itemLabel === "팥";
        const borderThin = { top: { style: "thin", color: { rgb: "D9D9D9" } }, bottom: { style: "thin", color: { rgb: "D9D9D9" } }, left: { style: "thin", color: { rgb: "D9D9D9" } }, right: { style: "thin", color: { rgb: "D9D9D9" } } };
        const borderSummary = { top: { style: "thin", color: { rgb: "000000" } }, bottom: { style: "double", color: { rgb: "000000" } }, left: { style: "thin", color: { rgb: "D9D9D9" } }, right: { style: "thin", color: { rgb: "D9D9D9" } } };

        const buildRegionSheet = (regionsList) => {
          const colCount = isBean ? 5 : 6;
          const sData = [];
          const sMerges = [];
          const sRowTypes = [];
          const sumMetaList = [];
          let currentRow = 0;

          regionsList.forEach(regionName => {
            const items = recoveredData.filter(d => d.region === regionName);
            if (items.length === 0) return;
            sData.push(isBean ? [regionName, "", "", "", ""] : [regionName, "", "", "", "", ""]);
            sMerges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: colCount - 1 } });
            sRowTypes.push({ type: 'banner' });
            currentRow++;

            sData.push(isBean ? ["상호", "대표자", "주소", "전화번호", "25kg(포)"] : ["상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]);
            sRowTypes.push({ type: 'header' });
            currentRow++;

            const dataStartExcelRow = currentRow + 1;
            let sumKr = 0, sumUs = 0;
            items.forEach(item => {
              const krVal = Number(item.sacks) || 0;
              const usVal = Number(item.usSacks) || 0;
              sumKr += krVal;
              sumUs += usVal;
              sData.push(isBean ? [item.name, item.rep, item.address, item.phone, krVal + usVal] : [item.name, item.rep, item.address, item.phone, krVal, item.usSacks]);
              sRowTypes.push({ type: 'data' });
              currentRow++;
            });
            const dataEndExcelRow = currentRow;

            sData.push(isBean ? ["", "", "", "합계", sumKr + sumUs] : ["", "", "", "합계", sumKr, sumUs]);
            sumMetaList.push({ rowIdx: currentRow, startRow: dataStartExcelRow, endRow: dataEndExcelRow, sumKr: isBean ? (sumKr + sumUs) : sumKr, sumUs });
            sRowTypes.push({ type: 'sum' });
            currentRow++;

            sData.push(isBean ? ["", "", "", "", ""] : ["", "", "", "", "", ""]);
            sRowTypes.push({ type: 'blank' });
            currentRow++;
          });

          if (sData.length === 0) {
            sData.push(isBean ? ["해당 권역에 배정된 내역이 없습니다.", "", "", "", ""] : ["해당 권역에 배정된 내역이 없습니다.", "", "", "", "", ""]);
            sMerges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: colCount - 1 } });
            sRowTypes.push({ type: 'blank' });
          }

          const ws = XLSX.utils.aoa_to_sheet(sData);
          ws['!merges'] = sMerges;
          ws['!cols'] = isBean ? [{ wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 12 }] : [{ wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 11 }, { wch: 11 }];

          sumMetaList.forEach(meta => {
            ws[XLSX.utils.encode_cell({ r: meta.rowIdx, c: 4 })] = { t: 'n', f: `SUM(E${meta.startRow}:E${meta.endRow})`, v: meta.sumKr };
            if (!isBean) ws[XLSX.utils.encode_cell({ r: meta.rowIdx, c: 5 })] = { t: 'n', f: `SUM(F${meta.startRow}:F${meta.endRow})`, v: meta.sumUs };
          });

          const range = XLSX.utils.decode_range(ws['!ref']);
          for (let R = range.s.r; R <= range.e.r; ++R) {
            const rowInfo = sRowTypes[R] || { type: 'blank' };
            for (let C = range.s.c; C <= range.e.c; ++C) {
              const addr = XLSX.utils.encode_cell({ r: R, c: C });
              if (!ws[addr]) ws[addr] = { t: 's', v: '' };
              if (rowInfo.type === 'banner') {
                ws[addr].s = { font: { name: "맑은 고딕", sz: 12, bold: true, color: { rgb: "000000" } }, fill: { fgColor: { rgb: "BDC6D4" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin };
              } else if (rowInfo.type === 'header') {
                ws[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1F3864" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin };
              } else if (rowInfo.type === 'data') {
                const isSackCol = isBean ? (C === 4) : (C === 4 || C === 5);
                ws[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: isSackCol, color: { rgb: isSackCol ? "C00000" : "000000" } }, alignment: { horizontal: C === 2 ? "left" : "center", vertical: "center" }, border: borderThin };
              } else if (rowInfo.type === 'sum') {
                ws[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } }, fill: { fgColor: { rgb: "FFD93B" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderSummary };
              }
            }
          }
          return ws;
        };

        XLSX.utils.book_append_sheet(wb, buildRegionSheet(['제주시', '신제주']), "제주시·신제주");
        XLSX.utils.book_append_sheet(wb, buildRegionSheet(['서쪽', '동쪽', '서귀포', '미분류']), "서쪽·동쪽·서귀포");

        const s3Data = [isBean ? ["지역", "번호", "상호", "대표자", "주소", "전화번호", "25kg(포)"] : ["지역", "번호", "상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]];
        let totalKrAll = 0, totalUsAll = 0;
        recoveredData.forEach(item => {
          const krVal = Number(item.sacks) || 0;
          const usVal = Number(item.usSacks) || 0;
          totalKrAll += krVal;
          totalUsAll += usVal;
          s3Data.push(isBean ? [item.region, item.no, item.name, item.rep, item.address, item.phone, krVal + usVal] : [item.region, item.no, item.name, item.rep, item.address, item.phone, krVal, item.usSacks]);
        });
        s3Data.push(isBean ? ["", "", "", "", "", "총합계", totalKrAll + totalUsAll] : ["", "", "", "", "", "총합계", totalKrAll, totalUsAll]);

        const ws3 = XLSX.utils.aoa_to_sheet(s3Data);
        ws3['!cols'] = isBean ? [{ wch: 10 }, { wch: 8 }, { wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 12 }] : [{ wch: 10 }, { wch: 8 }, { wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 11 }, { wch: 11 }];
        const range3 = XLSX.utils.decode_range(ws3['!ref']);
        const lastRow3 = range3.e.r;
        ws3[XLSX.utils.encode_cell({ r: lastRow3, c: 6 })] = { t: 'n', f: `SUM(G2:G${lastRow3})`, v: isBean ? (totalKrAll + totalUsAll) : totalKrAll };
        if (!isBean) ws3[XLSX.utils.encode_cell({ r: lastRow3, c: 7 })] = { t: 'n', f: `SUM(H2:H${lastRow3})`, v: totalUsAll };

        for (let R = range3.s.r; R <= range3.e.r; ++R) {
          for (let C = range3.s.c; C <= range3.e.c; ++C) {
            const addr = XLSX.utils.encode_cell({ r: R, c: C });
            if (!ws3[addr]) ws3[addr] = { t: 's', v: '' };
            if (R === 0) {
              ws3[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1F3864" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderThin };
            } else if (R === lastRow3) {
              ws3[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } }, fill: { fgColor: { rgb: "FFD93B" } }, alignment: { horizontal: "center", vertical: "center" }, border: borderSummary };
            } else {
              const isSackCol = isBean ? (C === 6) : (C === 6 || C === 7);
              ws3[addr].s = { font: { name: "맑은 고딕", sz: 11, bold: isSackCol, color: { rgb: isSackCol ? "C00000" : "000000" } }, alignment: { horizontal: C === 4 ? "left" : "center", vertical: "center" }, border: borderThin };
            }
          }
        }
        XLSX.utils.book_append_sheet(wb, ws3, `${itemLabel} 업체별 공급내역`);

        const now = new Date();
        const yymmdd = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const outputFileName = `${itemLabel})떡집 ${itemLabel}배달_${yymmdd}.xlsx`;
        XLSX.writeFile(wb, outputFileName);
        showToast(`'${outputFileName}' 다운로드 완료 (SUM 수식 적용)`, "success");
      };

      const notifyMasterSaveResult = (result, successMsg) => {
        if (result.reason === 'syncing') return;
        if (result.synced) showToast(successMsg, "success");
        else if (result.reason === 'resource-exhausted') showToast("파이어베이스 무료 한도 초과로 로컬에만 임시 저장되었습니다.", "error");
        else if (result.reason === 'permission-denied') showToast("보안 규칙 차단으로 클라우드 저장에 실패해 로컬에만 반영되었습니다.", "error");
        else showToast("오프라인 상태로 로컬에만 저장되었습니다.", "info");
      };

      const addRegion = async (e) => {
        e.preventDefault();
        const name = newCompName.trim();
        if (!name) return;
        const newEntry = {
          name,
          rep: newCompRep.trim(),
          region: newCompRegion,
          address: newCompAddress.trim(),
          phone: newCompPhone.trim(),
          isFixed: Boolean(newCompFixed)
        };
        const res = await saveMasterToCloud({ ...masterData, [name]: newEntry });
        if (res.reason === 'syncing') return;
        setNewCompName(''); setNewCompRep(''); setNewCompAddress(''); setNewCompPhone(''); setNewCompFixed(false);
        notifyMasterSaveResult(res, `'${name}' 하차지가 저장되었습니다.`);
      };

      const deleteRegionItem = async (name) => {
        const nextMaster = { ...masterData };
        delete nextMaster[name];
        const res = await saveMasterToCloud(nextMaster);
        notifyMasterSaveResult(res, `'${name}' 하차지가 삭제되었습니다.`);
      };

      // 명단 엑셀 일괄 업로드 (기존 고정 방문업체 isFixed 설정을 스마트 매칭으로 100% 승계)
      const handleMasterExcelUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const buffer = new Uint8Array(evt.target.result);
            const wb = XLSX.read(buffer, { type: 'array' });
            const targetSheetName = wb.SheetNames.find(n => n.replace(/\s+/g, "").includes("떡집주소")) || wb.SheetNames.find(n => n.includes("주소") || n.includes("명단")) || wb.SheetNames[0];
            const ws = wb.Sheets[targetSheetName];
            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
            let headerIdx = -1;
            let colMap = {};

            for (let i = 0; i < data.length; i++) {
              const row = data[i];
              if (!row || !Array.isArray(row)) continue;
              const rowStr = row.join(" ");
              if (rowStr.includes("상호") || rowStr.includes("떡집명") || rowStr.includes("업체명")) {
                headerIdx = i;
                row.forEach((val, idx) => {
                  if (val !== null && val !== undefined) {
                    const cleanVal = String(val).replace(/\s+/g, "");
                    if (cleanVal.includes("상호") || cleanVal.includes("업체명") || cleanVal.includes("떡집명")) colMap.name = idx;
                    else if (cleanVal.includes("대표자") || cleanVal.includes("성명") || cleanVal.includes("대표")) colMap.rep = idx;
                    else if (cleanVal.includes("주소") || cleanVal.includes("소재지")) colMap.address = idx;
                    else if (cleanVal.includes("전화") || cleanVal.includes("연락처") || cleanVal.includes("휴대폰")) colMap.phone = idx;
                    else if (cleanVal.includes("지역") || cleanVal.includes("권역")) colMap.region = idx;
                  }
                });
                break;
              }
            }

            if (headerIdx === -1 || colMap.name === undefined) {
              showToast(`'${targetSheetName}' 시트에서 '상호' 열을 찾을 수 없습니다.`, "error");
              return;
            }

            const newMaster = {};
            const duplicateNames = [];
            let successCount = 0;
            let preservedFixedCount = 0;

            for (let i = headerIdx + 1; i < data.length; i++) {
              const row = data[i];
              if (!row || !row[colMap.name]) continue;
              const name = String(row[colMap.name]).trim();
              if (!name || name.includes("합계") || name.includes("총합")) continue;
              const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";
              const address = colMap.address !== undefined && row[colMap.address] ? String(row[colMap.address]).trim() : "";
              const phone = colMap.phone !== undefined && row[colMap.phone] ? String(row[colMap.phone]).trim() : "";
              const explicitRegion = colMap.region !== undefined && row[colMap.region] ? String(row[colMap.region]).trim() : "";
              const region = explicitRegion || inferRegionByAddress(address);

              // 약칭으로 저장되어 있던 고정업체도 대표자/전화번호/주소 스마트 매칭으로 찾아 고정 설정 유지
              const prevMatched = masterData[name] || findSmartMasterInMap(masterData, name, rep, phone, address);
              const prevFixed = Boolean(prevMatched && prevMatched.isFixed);
              if (prevFixed) preservedFixedCount++;

              if (newMaster[name]) duplicateNames.push(name);
              else successCount++;
              newMaster[name] = { name, rep, region, address, phone, isFixed: prevFixed };
            }

            if (successCount === 0) {
              showToast("엑셀에서 불러올 업체 데이터가 없습니다.", "error");
              return;
            }

            const applyUpload = async () => {
              const res = await saveMasterToCloud(newMaster, true);
              const dupMsg = duplicateNames.length > 0 ? ` (중복 상호 ${duplicateNames.length}건: ${duplicateNames.slice(0, 3).join(', ')})` : '';
              const fixedMsg = preservedFixedCount > 0 ? ` · ★고정 ${preservedFixedCount}곳 유지` : '';
              if (res.synced) showToast(`'${targetSheetName}' 기준 ${successCount}곳 명단 동기화 완료${fixedMsg}${dupMsg}`, duplicateNames.length > 0 ? "error" : "success");
              else notifyMasterSaveResult(res, '');
            };

            const prevCount = Object.keys(masterData).length;
            if (prevCount > 0) {
              const dupNotice = duplicateNames.length > 0 ? `\n엑셀 내 중복 상호 ${duplicateNames.length}건 감지: ${duplicateNames.slice(0, 4).join(', ')}` : '';
              setConfirmDialog({
                title: '떡집 명단 전체 교체 확인',
                message: `기존 명단 ${prevCount}곳을 '${targetSheetName}' 시트의 ${successCount}곳으로 전체 교체할까요?\n(기존 지정한 고정 방문업체 ${preservedFixedCount}곳은 자동 유지됩니다.)${dupNotice}`,
                confirmText: '교체하기',
                danger: false,
                onConfirm: applyUpload
              });
            } else {
              await applyUpload();
            }
          } catch (err) {
            showToast("엑셀 명단 처리 중 오류가 발생했습니다.", "error");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = null;
      };

      const currentDocSummary = useMemo(() => {
        if (!currentDoc) return null;
        const regionSums = { '제주시': 0, '신제주': 0, '서쪽': 0, '동쪽': 0, '서귀포': 0, '미분류': 0 };
        const liveUnregistered = [];
        (currentDoc.data || []).forEach(row => {
          const r = resolveRowWithMaster(row, masterData);
          const rowSacks = (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
          regionSums[r.region] = (regionSums[r.region] || 0) + rowSacks;
          if (!r.master) liveUnregistered.push({ no: row.no, name: row.name, rep: row.rep, phone: row.phone, address: row.address, sacks: rowSacks });
        });
        return { regionSums, unclassifiedSum: regionSums['미분류'] || 0, liveUnregistered };
      }, [currentDoc, masterData]);

      // 월별통계 (하차 완료된 실제 수량 기준)
      const filteredStats = useMemo(() => {
        let totalSacks = 0, completedSacks = 0, completedCount = 0, totalCount = 0;
        const byRegion = { '제주시': 0, '신제주': 0, '서쪽': 0, '동쪽': 0, '서귀포': 0, '미분류': 0 };
        const completedByRegion = { '제주시': 0, '신제주': 0, '서쪽': 0, '동쪽': 0, '서귀포': 0, '미분류': 0 };
        const completedByCompany = {};

        const targetDocs = history.filter(doc => {
          if (!doc.yearMonth) return false;
          const [y, m] = doc.yearMonth.split('-');
          if (y !== selectedYear) return false;
          if (selectedMonth !== 'ALL' && m !== selectedMonth) return false;
          return true;
        });

        targetDocs.forEach(doc => {
          (doc.data || []).forEach(row => {
            const s = (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
            const r = resolveRowWithMaster(row, masterData);
            totalSacks += s;
            totalCount += 1;
            byRegion[r.region] = (byRegion[r.region] || 0) + s;
            const myDoneS = getEffectiveCompletedSacks(row);
            if (row.completed && myDoneS > 0) {
              completedSacks += myDoneS;
              completedCount += 1;
              completedByRegion[r.region] = (completedByRegion[r.region] || 0) + myDoneS;
              completedByCompany[r.name] = (completedByCompany[r.name] || 0) + myDoneS;
            }
          });
        });

        const myCompletedCompanies = Object.entries(completedByCompany).sort((a, b) => b[1] - a[1]);
        return { totalSacks, completedSacks, completedCount, totalCount, byRegion, completedByRegion, myCompletedCompanies, docCount: targetDocs.length };
      }, [history, selectedYear, selectedMonth, masterData]);

      const availableYears = useMemo(() => {
        const years = new Set([new Date().getFullYear().toString()]);
        history.forEach(doc => { if (doc.yearMonth) years.add(doc.yearMonth.split('-')[0]); });
        return Array.from(years).sort().reverse();
      }, [history]);

      const filteredMasterEntries = useMemo(() => {
        const q = regionSearch.trim().toLowerCase();
        return Object.entries(masterData)
          .filter(([name, info]) => {
            if (regionOnlyFixed && !info.isFixed) return false;
            if (!q) return true;
            return [name, info.rep, info.region, info.address, info.phone].join(' ').toLowerCase().includes(q);
          })
          .sort((a, b) => {
            if (Boolean(b[1].isFixed) !== Boolean(a[1].isFixed)) return b[1].isFixed ? 1 : -1;
            return a[0].localeCompare(b[0], 'ko-KR');
          });
      }, [masterData, regionSearch, regionOnlyFixed]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#f5f2eb] shadow-2xl flex flex-col relative safe-pb border-x border-[#e6dfd5]">
          {toast && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-sm bg-stone-800 text-[#fdfbf7] px-4 py-3 rounded-2xl shadow-xl flex items-center text-xs font-bold">
              <Icon name={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className={toast.type === 'error' ? 'text-rose-300 mr-2' : 'text-emerald-300 mr-2'} />
              <span className="leading-snug">{toast.msg}</span>
            </div>
          )}

          {confirmDialog && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdfa] border border-[#e6dfd5] rounded-[24px] p-5 w-full max-w-xs shadow-2xl space-y-4">
                <h3 className="text-sm font-extrabold text-stone-800">{confirmDialog.title}</h3>
                <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-line">{confirmDialog.message}</p>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmDialog(null)} className="flex-1 py-2.5 rounded-xl bg-[#f4eee4] text-stone-700 text-xs font-bold">취소</button>
                  <button onClick={() => { const fn = confirmDialog.onConfirm; setConfirmDialog(null); if (fn) fn(); }} className={`flex-1 py-2.5 rounded-xl text-white text-xs font-extrabold ${confirmDialog.danger === false ? 'bg-stone-800' : 'bg-rose-700'}`}>{confirmDialog.confirmText || '삭제하기'}</button>
                </div>
              </div>
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdfa] border border-[#e6dfd5] rounded-[28px] p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-extrabold text-stone-800 flex items-center"><Icon name="lock" size={16} className="mr-1.5 text-amber-700" />클라우드 로그인</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-stone-400 hover:text-stone-700 p-1"><Icon name="x" size={18} /></button>
                </div>
                <p className="text-xs text-stone-500 leading-relaxed">Firebase 콘솔에 등록한 본인 이메일과 비밀번호로 한 번만 로그인하면 이 기기에서 계속 유지됩니다.</p>
                <form onSubmit={handleEmailLogin} className="space-y-2.5">
                  <input type="email" autoComplete="email" placeholder="이메일" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3.5 py-2.5 text-xs font-medium outline-none focus:bg-white focus:border-amber-700" />
                  <input type="password" autoComplete="current-password" placeholder="비밀번호" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3.5 py-2.5 text-xs font-medium outline-none focus:bg-white focus:border-amber-700" />
                  <button type="submit" disabled={authLoading} className="w-full bg-stone-800 hover:bg-stone-900 disabled:opacity-50 text-white py-3 rounded-xl text-xs font-extrabold shadow-sm active:scale-95 transition">{authLoading ? '로그인 중...' : '로그인'}</button>
                  <button type="button" onClick={() => setShowAuthModal(false)} className="w-full bg-[#f4eee4] text-stone-700 py-2.5 rounded-xl text-xs font-bold">로그인 없이 로컬 모드로 보기</button>
                </form>
              </div>
            </div>
          )}

          {showAccountModal && authUser && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdfa] border border-[#e6dfd5] rounded-[28px] p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-extrabold text-stone-800 flex items-center"><Icon name="lock" size={16} className="mr-1.5 text-amber-700" />클라우드 계정 정보</h3>
                  <button onClick={() => setShowAccountModal(false)} className="text-stone-400 hover:text-stone-700 p-1"><Icon name="x" size={18} /></button>
                </div>
                <div className="bg-[#f7f4ef] border border-[#e6dfd5] rounded-2xl p-3.5 space-y-2.5">
                  <div>
                    <p className="text-[10px] font-bold text-stone-400">로그인 이메일</p>
                    <p className="text-xs font-extrabold text-stone-800 mt-0.5">{authUser.email || ''}</p>
                  </div>
                  <div>
                    <p className="text-[10px] font-bold text-stone-400">내 UID (Firestore 규칙에 입력)</p>
                    <div className="flex items-center justify-between gap-2 mt-1">
                      <code className="text-[11px] font-mono text-stone-700 break-all">{authUser.uid}</code>
                      <button type="button" onClick={async () => { const ok = await copyTextSafe(authUser.uid); if (ok) showToast("UID가 복사되었습니다.", "success"); }} className="shrink-0 bg-stone-800 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">복사</button>
                    </div>
                  </div>
                </div>
                {dbErrorMsg && <div className="p-3 bg-[#fdf3f2] border border-[#f5d5d2] rounded-xl text-[11px] font-bold text-[#9e3b33]">{dbErrorMsg}</div>}
                <button type="button" onClick={handleLogout} className="w-full bg-rose-700 hover:bg-rose-800 text-white py-3 rounded-xl text-xs font-extrabold active:scale-95 transition">로그아웃</button>
              </div>
            </div>
          )}

          {showPasteModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#fffdfa] border border-[#e6dfd5] rounded-[28px] p-5 w-full max-w-sm shadow-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-extrabold text-stone-800 flex items-center"><Icon name="clipboard" size={16} className="mr-1.5 text-amber-700" />제미나이 추출 결과 바로 붙여넣기</h3>
                  <button onClick={() => setShowPasteModal(false)} className="text-stone-400 hover:text-stone-700 p-1"><Icon name="x" size={18} /></button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] font-bold text-stone-500 mb-1">귀속 연·월 (월별통계용)</label>
                    <input type="month" value={pasteYearMonth} onChange={(e) => setPasteYearMonth(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-2.5 py-2 text-xs font-bold text-stone-800 outline-none focus:bg-white focus:border-amber-700" />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-stone-500 mb-1">팩스 총합계 검산 (선택)</label>
                    <input type="number" inputMode="numeric" placeholder="예: 1815" value={pasteExpectedTotal} onChange={(e) => setPasteExpectedTotal(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-2.5 py-2 text-xs font-bold text-stone-800 outline-none focus:bg-white focus:border-amber-700" />
                  </div>
                </div>
                <div className="flex gap-1.5">
                  <button onClick={handleClipboardQuickPaste} className="flex-1 bg-amber-100 text-amber-900 py-2 rounded-xl text-xs font-extrabold active:scale-95 transition">클립보드 붙여넣기</button>
                  <button onClick={copyGeminiFaxPrompt} className="flex-1 bg-[#f4eee4] text-stone-700 py-2 rounded-xl text-xs font-bold active:scale-95 transition">추출 명령어 복사</button>
                </div>
                <textarea rows="6" value={pasteText} onChange={(e) => setPasteText(e.target.value)} placeholder="제미나이 답변을 그대로 붙여넣으세요. 2장 이상의 JSON을 이어 붙여도 자동 병합합니다." className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-2xl p-3 text-xs font-mono outline-none focus:bg-white focus:border-amber-700" />
                <button onClick={handleProcessPastedText} className="w-full bg-stone-800 hover:bg-stone-900 text-white py-3 rounded-2xl text-xs font-extrabold shadow-md active:scale-95 transition">지금 바로 분류{autoDownloadExcel ? ' & 엑셀 다운' : '하기'}</button>
              </div>
            </div>
          )}

          <header className="bg-[#f5f2eb]/95 backdrop-blur-md px-5 pt-5 pb-3.5 sticky top-0 z-10 flex justify-between items-center border-b border-[#e6dfd5]">
            <div>
              <p className="text-[10px] font-bold text-stone-400 tracking-widest uppercase mb-0.5">Jeju Logistics System</p>
              <h1 className="text-xl font-bold text-stone-700 tracking-tight flex items-baseline space-x-1.5">
                <span><strong className="text-2xl font-black text-amber-700">R</strong>ice</span>
                <span><strong className="text-2xl font-black text-rose-800">R</strong>ed</span>
                <span><strong className="text-2xl font-black text-stone-900">B</strong>ean</span>

                        <Icon name="star" size={12} filled={true} className={`mr-1 ${regionOnlyFixed ? 'text-amber-200' : 'text-amber-500'}`} />
                        고정 방문업체 ({fixedShopCount}곳)
                      </button>
                    </div>
                    <div className="relative">
                      <Icon name="search" size={14} className="absolute left-3 top-2.5 text-stone-400" />
                      <input type="text" value={regionSearch} onChange={(e) => setRegionSearch(e.target.value)} placeholder="상호명, 대표자, 권역, 주소 검색..." className="w-full bg-white border border-[#d6cec2] rounded-xl pl-8 pr-3 py-1.5 text-xs outline-none focus:border-stone-500" />
                    </div>
                  </div>
                  <div className="max-h-[340px] overflow-y-auto divide-y divide-[#f4eee4] px-2">
                    {filteredMasterEntries.length === 0 ? (
                      <div className="py-10 text-center text-xs text-stone-400 leading-relaxed">
                        {Object.keys(masterData).length === 0
                          ? <>등록된 하차지 명단이 없습니다.<br/>위 초록색 버튼으로 <b>떡집명단 엑셀 파일</b>을 올려주세요.</>
                          : (regionOnlyFixed ? '지정된 고정 방문업체가 없습니다.\n업체 옆 별표(☆)를 눌러 지정해 주세요.' : '검색 결과가 없습니다.')}
                      </div>
                    ) : (
                      filteredMasterEntries.map(([name, info]) => (
                        <div
                          key={name}
                          onClick={() => {
                            setNewCompName(name);
                            setNewCompRep(info.rep || '');
                            setNewCompRegion(info.region);
                            setNewCompAddress(info.address || '');
                            setNewCompPhone(info.phone || '');
                            setNewCompFixed(Boolean(info.isFixed));
                          }}
                          className="px-2.5 py-2.5 flex justify-between items-center hover:bg-[#f7f4ef] rounded-xl cursor-pointer"
                        >
                          <div className="flex items-center min-w-0 pr-2 gap-2">
                            <button
                              type="button"
                              title={info.isFixed ? '고정 방문업체 해제' : '고정 방문업체 지정'}
                              onClick={(e) => { e.stopPropagation(); toggleFixedShop(name); }}
                              className="p-1 shrink-0 active:scale-90 transition"
                            >
                              <Icon name="star" size={17} filled={Boolean(info.isFixed)} className={info.isFixed ? 'text-amber-500' : 'text-stone-300'} />
                            </button>
                            <div className="min-w-0">
                              <div className="text-xs font-bold text-stone-800 flex items-center gap-1">
                                <span className="truncate">{name}</span>
                                {info.rep ? <span className="text-[11px] font-semibold text-stone-500 shrink-0">({info.rep})</span> : null}
                              </div>
                              <div className="text-[10px] text-stone-400 truncate mt-0.5">{info.address || '주소미입력'} · {info.phone || '번호미입력'}</div>
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <span className="text-[10px] px-2 py-0.5 bg-[#ede8df] text-stone-600 rounded-full font-bold">{info.region}</span>
                            <button type="button" onClick={(e) => { e.stopPropagation(); setConfirmDialog({ title: '하차지 삭제', message: `'${name}' 업체를 명단에서 삭제할까요?`, confirmText: '삭제하기', danger: true, onConfirm: () => deleteRegionItem(name) }); }} className="p-1.5 text-stone-400 hover:text-rose-600 rounded-lg"><Icon name="trash-2" size={14} /></button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#fffdfa]/95 backdrop-blur-md border-t border-[#e6dfd5] flex justify-around pt-2 px-1 safe-nav z-20 rounded-t-[24px] shadow-lg">
            {[
              { id: 'upload', icon: 'upload-cloud', label: '업로드' },
              { id: 'my_delivery', icon: 'check-square', label: '나의 하차지' },
              { id: 'history', icon: 'folder-clock', label: '내역조회' },
              { id: 'stats', icon: 'pie-chart', label: '월별통계' },
              { id: 'regions', icon: 'map-pin', label: '하차지 목록' }
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab === tab.id ? 'text-stone-900 font-extrabold scale-105' : 'text-stone-400 font-medium hover:text-stone-600'}`}>
                <Icon name={tab.icon} size={19} className={activeTab === tab.id ? 'text-amber-800' : ''} />
                <span className="text-[10px] mt-1 tracking-tight">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
