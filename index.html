                                            const donePercent = count > 0 ? Math.round((doneCount / count) * 100) : 0;
                                            return (
                                                <div key={r}>
                                                    <div className="flex justify-between text-xs mb-1">
                                                        <span className="font-bold text-stone-700">{r}</span>
                                                        <span className="font-extrabold text-stone-800">
                                                            <strong className="text-amber-700">{doneCount}포</strong> / {count}포 ({totalPercent}%)
                                                        </span>
                                                    </div>
                                                    <div className="w-full bg-[#f4eee4] rounded-full h-2.5 overflow-hidden flex">
                                                        <div className="bg-amber-600 h-2.5 transition-all" style={{ width: `${donePercent}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-[#fffdfa] p-5 rounded-[28px] shadow-sm border border-[#e6dfd5]">
                                    <h4 className="font-extrabold text-stone-800 text-xs mb-3 flex items-center">
                                        <Icon name="check-circle" size={15} className="mr-1.5 text-amber-700" /> 내가 돌린 하차지 내역 ({filteredStats.myCompletedCompanies.length}곳)
                                    </h4>
                                    {filteredStats.myCompletedCompanies.length === 0 ? (
                                        <p className="text-xs text-stone-400 py-4 text-center">체크된 하차 완료 내역이 없습니다.</p>
                                    ) : (
                                        <div className="divide-y divide-[#f4eee4] max-h-60 overflow-y-auto">
                                            {filteredStats.myCompletedCompanies.map(([name, s], i) => (
                                                <div key={name} className="py-2.5 flex justify-between items-center text-xs">
                                                    <div className="flex items-center">
                                                        <span className="w-5 font-extrabold text-amber-700">{i+1}</span>
                                                        <span className="font-bold text-stone-700">{name}</span>
                                                    </div>
                                                    <span className="font-extrabold text-stone-800 bg-[#f4eee4] px-2.5 py-1 rounded-lg">{s}포</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'regions' && (
                            <div className="space-y-4">
                                <div className="bg-[#eef5f0] p-4 rounded-[24px] shadow-sm border border-[#cde0d3]">
                                    <h3 className="text-xs font-extrabold text-[#2c5e43] mb-1 flex items-center">
                                        <Icon name="file-spreadsheet" size={16} className="mr-1.5" />
                                        떡집명단 엑셀 일괄 동기화 (초절약 1회 저장)
                                    </h3>
                                    <p className="text-[11px] text-[#457359] mb-3 leading-relaxed">
                                        <b>떡집명단_최종.xlsx</b> 파일을 올리시면 모든 명단을 문서 1개에 압축 저장해 무료 한도를 아끼면서 동기화합니다.
                                    </p>
                                    <label className="block w-full bg-[#3b6e52] hover:bg-[#2f5942] text-white text-center font-bold py-2.5 rounded-xl text-xs cursor-pointer transition active:scale-95 shadow-sm">
                                        📂 떡집명단 엑셀 파일 올리기
                                        <input type="file" accept=".xlsx, .xls, .csv" onChange={handleMasterExcelUpload} className="hidden" />
                                    </label>
                                </div>

                                <div className="bg-[#fffdfa] p-4 rounded-[24px] shadow-sm border border-[#e6dfd5]">
                                    <h3 className="text-xs font-extrabold text-stone-700 mb-2.5 flex items-center">
                                        <Icon name="plus-circle" size={16} className="mr-1.5" />신규/수정 하차지 개별 등록
                                    </h3>
                                    <form onSubmit={addRegion} className="space-y-2">
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="상호명 (필수)" value={newCompName} onChange={e=>setNewCompName(e.target.value)} className="flex-1 min-w-0 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2 text-xs font-medium outline-none focus:bg-white focus:border-stone-500"/>
                                            <input type="text" placeholder="대표자" value={newCompRep} onChange={e=>setNewCompRep(e.target.value)} className="w-20 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2 text-xs font-medium outline-none focus:bg-white focus:border-stone-500"/>
                                            <select value={newCompRegion} onChange={e=>setNewCompRegion(e.target.value)} className="shrink-0 bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-2.5 py-2 text-xs font-bold text-stone-700 outline-none">
                                                <option value="제주시">제주시</option>
                                                <option value="신제주">신제주</option>
                                                <option value="서쪽">서쪽</option>
                                                <option value="동쪽">동쪽</option>
                                                <option value="서귀포">서귀포</option>
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="text" placeholder="주소 입력" value={newCompAddress} onChange={e=>setNewCompAddress(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2 text-xs outline-none focus:bg-white focus:border-stone-500"/>
                                            <input type="text" placeholder="전화번호 입력" value={newCompPhone} onChange={e=>setNewCompPhone(e.target.value)} className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2 text-xs outline-none focus:bg-white focus:border-stone-500"/>
                                        </div>
                                        <button type="submit" className="w-full bg-stone-700 text-white py-2.5 rounded-xl text-xs font-bold active:scale-95 transition shadow-sm">하차지 저장</button>
                                    </form>
                                </div>

                                <div className="bg-[#fffdfa] rounded-[24px] shadow-sm border border-[#e6dfd5] overflow-hidden">
                                    <div className="px-4 py-3 bg-[#f4eee4]/60 border-b border-[#e6dfd5] space-y-2">
                                        <div className="font-extrabold text-stone-700 text-xs flex justify-between items-center">
                                            <span>등록된 하차지 목록 (가나다순)</span>
                                            <span className="bg-[#ede8df] text-stone-700 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold">{filteredMasterEntries.length} / {Object.keys(masterData).length}곳</span>
                                        </div>
                                        <div className="relative">
                                            <Icon name="search" size={14} className="absolute left-3 top-2.5 text-stone-400" />
                                            <input
                                                type="text"
                                                value={regionSearch}
                                                onChange={(e) => setRegionSearch(e.target.value)}
                                                placeholder="상호명, 대표자, 권역, 주소 검색..."
                                                className="w-full bg-white border border-[#d6cec2] rounded-xl pl-8 pr-3 py-1.5 text-xs outline-none focus:border-stone-500"
                                            />
                                        </div>
                                    </div>
                                    <div className="max-h-[340px] overflow-y-auto divide-y divide-[#f4eee4] px-2">
                                        {filteredMasterEntries.length === 0 ? (
                                            <div className="py-10 text-center text-xs text-stone-400 leading-relaxed">
                                                {Object.keys(masterData).length === 0
                                                    ? <>등록된 하차지 명단이 없습니다.<br/>위 초록색 버튼으로 <b>떡집명단 엑셀 파일</b>을 올려주세요.</>
                                                    : '검색 결과가 없습니다.'}
                                            </div>
                                        ) : (
                                            filteredMasterEntries.map(([name, info]) => (
                                                <div
                                                    key={name}
                                                    onClick={() => { setNewCompName(name); setNewCompRep(info.rep||''); setNewCompRegion(info.region); setNewCompAddress(info.address||''); setNewCompPhone(info.phone||''); }}
                                                    className="px-2.5 py-2.5 flex justify-between items-center hover:bg-[#f7f4ef] rounded-xl cursor-pointer"
                                                >
                                                    <div className="min-w-0 pr-2">
                                                        <div className="text-xs font-bold text-stone-800">
                                                            {name} {info.rep ? <span className="text-[11px] font-semibold text-stone-500">({info.rep})</span> : null}
                                                        </div>
                                                        <div className="text-[10px] text-stone-400 truncate mt-0.5">
                                                            {info.address || '주소미입력'} · {info.phone || '번호미입력'}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <span className="text-[10px] px-2 py-0.5 bg-[#ede8df] text-stone-600 rounded-full font-bold">{info.region}</span>
                                                        <button
                                                            type="button"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                setConfirmDialog({
                                                                    title: '하차지 삭제',
                                                                    message: `'${name}' 업체를 명단에서 삭제할까요?`,
                                                                    confirmText: '삭제하기',
                                                                    danger: true,
                                                                    onConfirm: () => deleteRegionItem(name)
                                                                });
                                                            }}
                                                            className="p-1.5 text-stone-400 hover:text-rose-600 rounded-lg"
                                                        >
                                                            <Icon name="trash-2" size={14} />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#fffdfa]/95 backdrop-blur-md border-t border-[#e6dfd5] flex justify-around pt-2 px-1 safe-nav z-20 rounded-t-[24px] shadow-lg">
                        {[
                            { id: 'upload', icon: 'upload-cloud', label: '업로드' },
                            { id: 'my_delivery', icon: 'check-square', label: '나의 하차지' },
                            { id: 'history', icon: 'folder-clock', label: '내역조회' },
                            { id: 'stats', icon: 'pie-chart', label: '월별통계' },
                            { id: 'regions', icon: 'map-pin', label: '하차지 목록' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab === tab.id ? 'text-stone-900 font-extrabold scale-105' : 'text-stone-400 font-medium hover:text-stone-600'}`}
                            >
                                <Icon name={tab.icon} size={19} className={activeTab === tab.id ? 'text-amber-800' : ''} />
                                <span className="text-[10px] mt-1 tracking-tight">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
