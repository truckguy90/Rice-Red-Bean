<body class="text-stone-800 antialiased selection:bg-stone-200 selection:text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 1. Firebase 실제 프로젝트 설정 (riceredbean-743a0)
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBj8x8nUPrTp9Y2fpaVT3zwFYpQ7XwPNyM",
            authDomain: "riceredbean-743a0.firebaseapp.com",
            projectId: "riceredbean-743a0",
            storageBucket: "riceredbean-743a0.firebasestorage.app",
            messagingSenderId: "116914812678",
            appId: "1:116914812678:web:dd095d9a52d96d24ead087"
        };

        const LOCAL_MASTER_KEY = 'rice_red_bean_master_v3';
        const LOCAL_HISTORY_KEY = 'rice_red_bean_history_v3';
        const LOCAL_AUTO_DL_KEY = 'rice_red_bean_auto_dl_v3';

        // 현재 연-월 기본값 (YYYY-MM)
        const getCurrentYearMonth = () => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        };

        // 안전한 정수 추출기 ("20포(400kg)" -> 20, "10.0" -> 10, "1,200" -> 1200)
        const parseSafeInt = (val) => {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') return Number.isFinite(val) ? Math.round(val) : 0;
            const str = String(val).replace(/,/g, '').trim();
            const match = str.match(/^\d+(?:\.\d+)?/);
            if (!match) return 0;
            return Math.round(Number(match[0])) || 0;
        };

        // 2. React 전용 순수 SVG 아이콘 (DOM 충돌 원천 차단)
        const ICON_PATHS = {
            'upload-cloud': '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/>',
            'check-square': '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
            'folder-clock': '<circle cx="16" cy="16" r="6"/><path d="M7 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2"/><path d="M16 14v2l1 1"/>',
            'pie-chart': '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
            'map-pin': '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
            'download': '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
            'alert-triangle': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
            'alert-circle': '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
            'check-circle': '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            'user-x': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/>',
            'file-spreadsheet': '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/>',
            'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
            'table': '<path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>',
            'list-checks': '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
            'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
            'trash-2': '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
            'plus-circle': '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
            'clipboard': '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
            'zap': '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
            'search': '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
            'copy': '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
            'phone': '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
            'x': '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
        };

        const Icon = ({ name, size = 18, className = "" }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={`inline-block shrink-0 ${className}`}
                dangerouslySetInnerHTML={{ __html: ICON_PATHS[name] || '' }}
            />
        );

        const copyTextSafe = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                return true;
            } catch (e) {
                return false;
            }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('upload');
            const [dbStatus, setDbStatus] = useState('connecting'); // 'connected' | 'local' | 'quota' | 'denied'
            const [dbErrorMsg, setDbErrorMsg] = useState('');
            const dbRef = useRef(null);

            const [masterData, setMasterData] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_MASTER_KEY) || localStorage.getItem('rice_red_bean_master_v2');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });
            const [history, setHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_HISTORY_KEY) || localStorage.getItem('rice_red_bean_history_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            const [currentDoc, setCurrentDoc] = useState(null);
            const [selectedDeliveryDocId, setSelectedDeliveryDocId] = useState('');
            const [deliveryRegionFilter, setDeliveryRegionFilter] = useState('전체');
            const [deliveryViewMode, setDeliveryViewMode] = useState('table');

            const [selectedItemType, setSelectedItemType] = useState('쌀');
            const [autoDownloadExcel, setAutoDownloadExcel] = useState(() => {
                try { return localStorage.getItem(LOCAL_AUTO_DL_KEY) === 'true'; } catch (e) { return false; }
            });

            // 제미나이 붙여넣기 모달 상태 (귀속 연·월 + 팩스 총합계 검산 추가)
            const [showPasteModal, setShowPasteModal] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [pasteYearMonth, setPasteYearMonth] = useState(getCurrentYearMonth);
            const [pasteExpectedTotal, setPasteExpectedTotal] = useState('');

            const [regionSearch, setRegionSearch] = useState('');
            const [confirmDialog, setConfirmDialog] = useState(null);

            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear().toString());
            const [selectedMonth, setSelectedMonth] = useState('ALL');
            const [toast, setToast] = useState(null);
            const toastTimerRef = useRef(null);

            const [newCompName, setNewCompName] = useState('');
            const [newCompRep, setNewCompRep] = useState('');
            const [newCompRegion, setNewCompRegion] = useState('제주시');
            const [newCompAddress, setNewCompAddress] = useState('');
            const [newCompPhone, setNewCompPhone] = useState('');

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                try { localStorage.setItem(LOCAL_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
                if (history.length > 0 && !selectedDeliveryDocId) {
                    setSelectedDeliveryDocId(history[0].id);
                }
            }, [history]);

            useEffect(() => {
                try { localStorage.setItem(LOCAL_AUTO_DL_KEY, String(autoDownloadExcel)); } catch (e) {}
            }, [autoDownloadExcel]);

            // 3. Firebase 초기화 및 초절약 동기화 (익명 로그인 + 명단 1문서 통합 저장)
            useEffect(() => {
                let unsubMaster = null;
                let unsubHistory = null;
                let isMounted = true;

                const startCloudSync = async () => {
                    try {
                        if (typeof firebase === 'undefined') {
                            setDbStatus('local');
                            setDbErrorMsg('Firebase SDK를 불러오지 못했습니다.');
                            return;
                        }

                        if (!firebase.apps.length) {
                            firebase.initializeApp(FIREBASE_CONFIG);
                        }

                        if (firebase.auth) {
                            try {
                                await firebase.auth().signInAnonymously();
                            } catch (authErr) {
                                console.warn("Anonymous auth skipped:", authErr.code);
                            }
                        }

                        if (!isMounted) return;

                        const firestore = firebase.firestore();
                        firestore.enablePersistence({ synchronizeTabs: true }).catch(() => {});
                        dbRef.current = firestore;

                        const handleSyncError = (err) => {
                            console.warn("Firestore sync error:", err);
                            const code = err && err.code ? err.code : 'unknown';
                            if (code === 'resource-exhausted') {
                                setDbStatus('quota');
                                setDbErrorMsg('오늘 무료 쓰기/읽기 한도(2만 건) 초과. 오후 4~5시 초기화됩니다.');
                            } else if (code === 'permission-denied') {
                                setDbStatus('denied');
                                setDbErrorMsg('파이어베이스 보안 규칙(Rules)에서 접근이 차단되었습니다.');
                            } else {
                                setDbStatus('local');
                                setDbErrorMsg(`연결 오류 (${code}): 오프라인/로컬 모드로 작동 중`);
                            }
                        };

                        unsubMaster = firestore.collection('rrb_master').doc('all_shops').onSnapshot((docSnap) => {
                            setDbStatus('connected');
                            setDbErrorMsg('');
                            if (docSnap.exists) {
                                const d = docSnap.data();
                                if (d && d.shopsJson) {
                                    try {
                                        const parsed = JSON.parse(d.shopsJson);
                                        setMasterData(parsed);
                                        localStorage.setItem(LOCAL_MASTER_KEY, JSON.stringify(parsed));
                                    } catch (e) {}
                                }
                            }
                        }, handleSyncError);

                        unsubHistory = firestore.collection('rrb_history').onSnapshot((snapshot) => {
                            setDbStatus('connected');
                            setDbErrorMsg('');
                            const loaded = [];
                            snapshot.forEach(docSnap => {
                                const d = docSnap.data();
                                let parsedRows = [];
                                try { parsedRows = JSON.parse(d.recordsJson || "[]"); } catch (e) {}
                                loaded.push({
                                    ...d,
                                    id: docSnap.id,
                                    data: parsedRows
                                });
                            });
                            loaded.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                            setHistory(loaded);
                            if (loaded.length > 0) {
                                setSelectedDeliveryDocId(prev => prev || loaded[0].id);
                            }
                        }, handleSyncError);
                    } catch (e) {
                        console.error("Firebase init failed:", e);
                        setDbStatus('local');
                        setDbErrorMsg(`초기화 오류: ${e.message}`);
                    }
                };

                startCloudSync();

                return () => {
                    isMounted = false;
                    if (unsubMaster) unsubMaster();
                    if (unsubHistory) unsubHistory();
                };
            }, []);

            const saveMasterToCloud = async (nextMaster) => {
                setMasterData(nextMaster);
                try { localStorage.setItem(LOCAL_MASTER_KEY, JSON.stringify(nextMaster)); } catch (e) {}

                if (dbRef.current) {
                    try {
                        await dbRef.current.collection('rrb_master').doc('all_shops').set({
                            shopsJson: JSON.stringify(nextMaster),
                            count: Object.keys(nextMaster).length,
                            updatedAt: Date.now()
                        });
                        setDbStatus('connected');
                        return true;
                    } catch (err) {
                        console.error("Save master cloud error:", err);
                        if (err.code === 'resource-exhausted') {
                            setDbStatus('quota');
                            showToast("오늘 파이어베이스 무료 쓰기 한도 초과로 로컬에만 임시 저장되었습니다.", "error");
                        }
                        return false;
                    }
                }
                return false;
            };

            const getEffectiveMySacks = (row) => {
                if (!row || !row.completed) return 0;
                if (row.mySacks !== undefined && row.mySacks !== null) {
                    return Number(row.mySacks) || 0;
                }
                return (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
            };

            // 신제주 주요 도로명 보강
            const inferRegionByAddress = (address = "") => {
                const addr = String(address).trim();
                if (!addr) return "미분류";
                if (addr.includes("애월") || addr.includes("한림") || addr.includes("한경") || addr.includes("대정") || addr.includes("안덕") || addr.includes("우정로") || addr.includes("외도")) {
                    return "서쪽";
                }
                if (addr.includes("조천") || addr.includes("구좌") || addr.includes("성산") || addr.includes("표선") || addr.includes("남원")) {
                    return "동쪽";
                }
                if (addr.includes("서귀포")) {
                    return "서귀포";
                }
                const shinJejuKeywords = [
                    "다랑곶", "과원", "신대로", "도공로", "오일장", "성신로", "우령", "아연로",
                    "노형", "연동", "노연로", "원노형", "수덕로", "정존", "월랑로",
                    "한라대학로", "신광로", "삼무로", "도령로", "연북로", "제원"
                ];
                if (shinJejuKeywords.some(k => addr.includes(k))) {
                    return "신제주";
                }
                if (addr.includes("제주시")) {
                    return "제주시";
                }
                return "미분류";
            };

            // 4. 스마트 매칭 함수 (동명이인 대표자 오매칭 차단)
            const findSmartMaster = (rawName, rawRep = "", rawPhone = "", rawAddr = "") => {
                const cleanName = String(rawName || "").trim();
                const noSpaceName = cleanName.replace(/\s+/g, "");
                const cleanRep = String(rawRep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                const cleanPhone = String(rawPhone || "").replace(/[^0-9]/g, "");
                const cleanAddr = String(rawAddr || "").replace(/\s+/g, "");

                const stripSuffix = (str) => String(str || "")
                    .replace(/\s+/g, "")
                    .replace(/\(주\)|㈜/g, "")
                    .replace(/(떡방앗간|떡방아간|떡방아|떡방|떡집|방앗간|방아간|오메기떡|오메기|식품|양과)/g, "");

                const coreTarget = stripSuffix(cleanName);

                if (masterData[cleanName]) return { ...masterData[cleanName], name: cleanName };
                const entries = Object.entries(masterData);
                for (const [k, info] of entries) {
                    if (k.replace(/\s+/g, "") === noSpaceName) return { ...info, name: k };
                }

                if (cleanPhone.length >= 8) {
                    const tail = cleanPhone.slice(-8);
                    for (const [k, info] of entries) {
                        const mPhone = String(info.phone || "").replace(/[^0-9]/g, "");
                        if (mPhone.length >= 8 && mPhone.slice(-8) === tail) {
                            return { ...info, name: k };
                        }
                    }
                }

                if (cleanRep.length >= 2) {
                    const repMatches = entries.filter(([k, info]) => {
                        const mRep = String(info.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        return mRep && (mRep === cleanRep || mRep.includes(cleanRep) || cleanRep.includes(mRep));
                    });

                    if (repMatches.length === 1) {
                        return { ...repMatches[0][1], name: repMatches[0][0] };
                    } else if (repMatches.length > 1) {
                        for (const [k, info] of repMatches) {
                            const cKey = stripSuffix(k);
                            if (coreTarget.length >= 2 && cKey && (cKey.includes(coreTarget) || coreTarget.includes(cKey))) {
                                return { ...info, name: k };
                            }
                            const mAddr = String(info.address || "").replace(/\s+/g, "");
                            if (cleanAddr.length >= 4 && mAddr && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) {
                                return { ...info, name: k };
                            }
                        }
                    }
                }

                if (coreTarget.length >= 2) {
                    for (const [k, info] of entries) {
                        const cKey = stripSuffix(k);
                        if (cKey && cKey === coreTarget) {
                            return { ...info, name: k };
                        }
                    }
                }

                if (cleanAddr.length >= 6) {
                    for (const [k, info] of entries) {
                        const mAddr = String(info.address || "").replace(/\s+/g, "");
                        if (mAddr.length >= 6 && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) {
                            return { ...info, name: k };
                        }
                    }
                }

                return null;
            };

            // 5. 엑셀 파일 업로드 처리
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                let year = new Date().getFullYear().toString();
                let month = (new Date().getMonth() + 1).toString().padStart(2, '0');
                
                const korMatch = file.name.match(/(?:20)?(\d{2})년\s*(\d{1,2})월/);
                const hyphenMatch = file.name.match(/(20\d{2})[-._]?(\d{1,2})/);
                const shortMatch = file.name.match(/(\d{2})[-._](\d{1,2})/);
                const yymmddMatch = file.name.match(/_(\d{2})(\d{2})\d{2}/);

                if (korMatch) { year = "20" + korMatch[1]; month = korMatch[2].padStart(2, '0'); }
                else if (hyphenMatch) { year = hyphenMatch[1]; month = hyphenMatch[2].padStart(2, '0'); }
                else if (shortMatch) { year = "20" + shortMatch[1]; month = shortMatch[2].padStart(2, '0'); }
                else if (yymmddMatch) { year = "20" + yymmddMatch[1]; month = yymmddMatch[2].padStart(2, '0'); }

                const detectedType = file.name.includes("팥") ? "팥" : (file.name.includes("쌀") ? "쌀" : selectedItemType);
                setSelectedItemType(detectedType);

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const buffer = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(buffer, { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        await processRowsData(data, file.name, `${year}-${month}`, detectedType, null);
                    } catch (err) {
                        console.error(err);
                        showToast("파일 처리 중 오류가 발생했습니다.", "error");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null; 
            };

            // 6. 제미나이 텍스트(JSON / 마크다운 표 / CSV·탭) 안전 파싱
            const copyGeminiFaxPrompt = async () => {
                const promptText = `팩스 공급내역서 사진을 읽어서 아래 JSON 형식으로만 정확히 추출해줘.
- 설명 없이 JSON만 출력
- 수량이 0이거나 빈 칸인 업체는 제외
- 팩스 맨 아래 적힌 총합계 포대 수도 expectedTotal에 같이 적어줘
{
  "expectedTotal": 1815,
  "items": [
    {
      "no": 1,
      "name": "상호명",
      "rep": "대표자명",
      "sacks": 10,
      "usSacks": 0
    }
  ]
}`;
                const ok = await copyTextSafe(promptText);
                if (ok) showToast("🤖 제미나이 팩스 추출 명령어(합계 검산 포함) 복사 완료!", "success");
            };

            const handleClipboardQuickPaste = async () => {
                try {
                    const txt = await navigator.clipboard.readText();
                    if (txt && txt.trim()) {
                        setPasteText(txt);
                        showToast("📋 클립보드 내용을 불러왔습니다!", "success");
                    } else {
                        showToast("클립보드가 비어 있습니다.", "error");
                    }
                } catch (e) {
                    showToast("입력 칸을 길게 눌러 직접 붙여넣기 해주세요.", "info");
                }
            };

            // JSON 블록 안전 추출기 (앞뒤 설명 문구 제거 + 2장 이어붙임 ][ 자동 병합)
            const extractJsonSafely = (rawText) => {
                let cleaned = rawText.replace(/```(?:json|csv|tsv|text)?/gi, '').replace(/```/g, '').trim();

                // 2장 이상 JSON 배열을 그대로 이어붙인 경우: [...] [...] -> [..., ...]
                if (/\]\s*\[/.test(cleaned)) {
                    cleaned = cleaned.replace(/\]\s*\[/g, ',');
                }

                // 객체 { "items": [...] } 형태 우선 시도
                const firstBrace = cleaned.indexOf('{');
                const lastBrace = cleaned.lastIndexOf('}');
                const firstBracket = cleaned.indexOf('[');
                const lastBracket = cleaned.lastIndexOf(']');

                // { 가 [ 보다 먼저 나오면 전체 객체 파싱 시도
                if (firstBrace !== -1 && lastBrace > firstBrace && (firstBracket === -1 || firstBrace < firstBracket)) {
                    try {
                        const obj = JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
                        if (obj && Array.isArray(obj.items)) {
                            return { items: obj.items, embeddedTotal: parseSafeInt(obj.expectedTotal || obj.totalSacks || obj.합계) || null };
                        }
                    } catch (e) {}
                }

                // [ ... ] 배열 구간만 잘라내어 파싱 시도
                if (firstBracket !== -1 && lastBracket > firstBracket) {
                    try {
                        const arr = JSON.parse(cleaned.slice(firstBracket, lastBracket + 1));
                        if (Array.isArray(arr)) {
                            return { items: arr, embeddedTotal: null };
                        }
                    } catch (e) {
                        return { error: "JSON 형식이 깨져 있습니다. 복사 시 끝 괄호 ']'가 잘렸는지 확인해 주세요." };
                    }
                }

                return null;
            };

            const handleProcessPastedText = async () => {
                const raw = pasteText.trim();
                if (!raw) {
                    showToast("제미나이가 뽑아준 내용을 먼저 붙여넣어 주세요.", "error");
                    return;
                }

                const ym = pasteYearMonth || getCurrentYearMonth();
                const now = new Date();
                const mmdd = `${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
                const fileName = `${selectedItemType}_제미나이직접입력_${mmdd}`;

                let rows2D = [];
                let expectedTotal = parseSafeInt(pasteExpectedTotal) || null;

                const jsonAttempt = extractJsonSafely(raw);
                if (jsonAttempt && jsonAttempt.error) {
                    showToast(jsonAttempt.error, "error");
                    return;
                }

                if (jsonAttempt && jsonAttempt.items && jsonAttempt.items.length > 0) {
                    if (!expectedTotal && jsonAttempt.embeddedTotal) {
                        expectedTotal = jsonAttempt.embeddedTotal;
                    }
                    rows2D.push(["번호", "상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]);
                    jsonAttempt.items.forEach((item, idx) => {
                        rows2D.push([
                            item.no || (idx + 1),
                            item.name || item.상호 || item.업체명 || "",
                            item.rep || item.대표자 || item.성명 || "",
                            item.address || item.주소 || "",
                            item.phone || item.전화번호 || "",
                            item.sacks ?? item.국산 ?? item.수량 ?? item.포 ?? 0,
                            item.usSacks ?? item.미국산 ?? item.수입 ?? 0
                        ]);
                    });
                } else {
                    const cleaned = raw.replace(/^```(?:csv|tsv|text)?\s*/i, '').replace(/\s*```$/, '').trim();
                    const lines = cleaned.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    for (const line of lines) {
                        if (/^[\|\-\s:]+$/.test(line)) continue;
                        let cols = [];
                        if (line.includes('|')) {
                            cols = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                        } else if (line.includes('\t')) {
                            cols = line.split('\t').map(c => c.trim());
                        } else {
                            cols = line.split(',').map(c => c.trim());
                        }
                        if (cols.length >= 2) rows2D.push(cols);
                    }
                    const firstRowStr = (rows2D[0] || []).join(' ');
                    if (rows2D.length > 0 && !firstRowStr.includes('상호') && !firstRowStr.includes('업체')) {
                        const colCnt = rows2D[0].length;
                        if (colCnt === 2) rows2D.unshift(["상호", "국산(포)"]);
                        else if (colCnt === 3) rows2D.unshift(["상호", "대표자", "국산(포)"]);
                        else rows2D.unshift(["번호", "상호", "대표자", "국산(포)", "미국산(포)"]);
                    }
                }

                if (rows2D.length < 2) {
                    showToast("읽을 수 있는 업체 내역이 없습니다.", "error");
                    return;
                }

                setShowPasteModal(false);
                setPasteText('');
                setPasteExpectedTotal('');
                await processRowsData(rows2D, fileName, ym, selectedItemType, expectedTotal);
            };

            // 7. 공통 데이터 분류 엔진 (kg 오인식 차단 + 합계 검산 + 중복 경고)
            const processRowsData = async (rows, fileName, yearMonth, itemType = '쌀', expectedTotal = null) => {
                if (Object.keys(masterData).length === 0) {
                    showToast("등록된 떡집 명단이 0곳입니다. [하차지 목록]에서 명단 엑셀을 먼저 올려주세요!", "error");
                }

                let headerRowIdx = -1;
                let colMap = {};

                for (let i = 0; i < Math.min(rows.length, 25); i++) {
                    const row = rows[i];
                    if (!row || !Array.isArray(row)) continue;
                    const rowStr = row.join(" ");
                    if ((rowStr.includes("상호") || rowStr.includes("업체명")) && (rowStr.includes("포") || rowStr.includes("수량") || rowStr.includes("국산") || rowStr.includes("미국산") || rowStr.includes("25kg") || rowStr.includes("20kg"))) {
                        headerRowIdx = i;
                        let fallbackKrIdx = undefined;
                        let fallbackUsIdx = undefined;

                        row.forEach((cell, idx) => {
                            if (cell === null || cell === undefined) return;
                            const cleanCell = String(cell).replace(/\s+/g, "");
                            const lowerCell = cleanCell.toLowerCase();

                            // '포' 표기 없이 kg만 있는 중량 열(예: 쌀수량(kg), 팥수량kg, 미국산쌀(kg))은 포대 열에서 원천 제외
                            const isPureKgCol = lowerCell.includes("kg") && !cleanCell.includes("포");

                            if (cleanCell.includes("번호") && !cleanCell.includes("코드") && !cleanCell.includes("전화")) colMap.no = idx;
                            else if (cleanCell.includes("상호") || cleanCell.includes("업체명")) colMap.name = idx;
                            else if (cleanCell.includes("대표") || cleanCell.includes("성명")) colMap.rep = idx;
                            else if (cleanCell.includes("주소") || cleanCell.includes("소재지")) colMap.address = idx;
                            else if (cleanCell.includes("전화") || cleanCell.includes("연락처")) colMap.phone = idx;
                            else if (!isPureKgCol && (cleanCell.includes("미국산") || cleanCell.includes("외국산") || cleanCell.includes("수입"))) {
                                if (cleanCell.includes("포") || cleanCell.includes("수량")) {
                                    if (colMap.usSack === undefined) colMap.usSack = idx;
                                } else if (fallbackUsIdx === undefined) {
                                    fallbackUsIdx = idx;
                                }
                            } else if (!isPureKgCol && (cleanCell.includes("국산") || cleanCell.includes("포") || cleanCell.includes("수량"))) {
                                if (cleanCell.includes("포")) {
                                    if (colMap.sack === undefined) colMap.sack = idx;
                                } else if (fallbackKrIdx === undefined) {
                                    fallbackKrIdx = idx;
                                }
                            }
                        });

                        if (colMap.sack === undefined && fallbackKrIdx !== undefined) colMap.sack = fallbackKrIdx;
                        if (colMap.usSack === undefined && fallbackUsIdx !== undefined) colMap.usSack = fallbackUsIdx;
                        break;
                    }
                }

                if (headerRowIdx === -1 || colMap.name === undefined) {
                    showToast("데이터에서 '상호'나 '수량(포)' 열을 찾을 수 없습니다.", "error");
                    return;
                }

                const parsedList = [];
                let totalKrSacks = 0;
                let totalUsSacks = 0;
                let unclassifiedCount = 0;
                const unregisteredList = [];
                const typoList = [];

                for (let i = headerRowIdx + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    
                    const rawName = row[colMap.name];
                    if (!rawName) continue;
                    
                    const cleanName = String(rawName).trim();
                    if (cleanName === "" || cleanName.includes("합계") || cleanName.includes("총계") || cleanName.includes("소계")) continue;

                    const origNo = colMap.no !== undefined ? row[colMap.no] : (parsedList.length + 1);
                    const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";

                    const sacks = colMap.sack !== undefined ? parseSafeInt(row[colMap.sack]) : 0;
                    const usSacks = colMap.usSack !== undefined ? parseSafeInt(row[colMap.usSack]) : 0;
                    
                    if (sacks === 0 && usSacks === 0) continue;

                    const rowAddr = (colMap.address !== undefined && row[colMap.address]) ? String(row[colMap.address]).trim() : "";
                    const rowPhone = (colMap.phone !== undefined && row[colMap.phone]) ? String(row[colMap.phone]).trim() : "";

                    const master = findSmartMaster(cleanName, rep, rowPhone, rowAddr);

                    const unifiedName = (master && master.name) ? master.name : cleanName;
                    const address = (master && master.address) ? master.address : rowAddr;
                    const phone = (master && master.phone) ? master.phone : rowPhone;
                    const region = (master && master.region && master.region !== "미분류")
                        ? master.region
                        : inferRegionByAddress(address);

                    if (region === "미분류") unclassifiedCount++;

                    if (!master) {
                        unregisteredList.push({
                            no: origNo, name: cleanName, rep, phone: rowPhone, address: rowAddr, sacks: sacks + usSacks
                        });
                    } else {
                        const normFileName = cleanName.replace(/\s+/g, "");
                        const normMasterName = String(master.name || "").replace(/\s+/g, "");
                        const normFileRep = String(rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        const normMasterRep = String(master.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        const nameDiff = normFileName !== normMasterName;
                        const repDiff = Boolean(normFileRep && normMasterRep && normFileRep !== normMasterRep);

                        if (nameDiff || repDiff) {
                            typoList.push({
                                no: origNo, fileName: cleanName, masterName: master.name,
                                fileRep: rep, masterRep: master.rep || "", nameDiff, repDiff
                            });
                        }
                    }

                    totalKrSacks += sacks;
                    totalUsSacks += usSacks;

                    parsedList.push({
                        no: origNo,
                        name: unifiedName,
                        rep: rep || (master && master.rep ? master.rep : ""),
                        region,
                        address,
                        phone,
                        sacks,
                        usSacks,
                        completed: false,
                        mySacks: null
                    });
                }

                if (parsedList.length === 0) {
                    showToast("배정된 포대 수량이 있는 업체가 없습니다.", "error");
                    return;
                }

                const totalSacks = totalKrSacks + totalUsSacks;
                const totalMismatch = Boolean(expectedTotal && expectedTotal !== totalSacks);

                const docId = `doc_${Date.now()}`;
                const newDoc = {
                    id: docId,
                    fileName,
                    itemType,
                    yearMonth,
                    uploadDate: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now(),
                    totalSacks,
                    totalKrSacks,
                    totalUsSacks,
                    expectedTotal: expectedTotal || null,
                    totalMismatch,
                    unclassifiedCount,
                    unregisteredList,
                    typoList,
                    data: parsedList
                };

                const commitNewDoc = async () => {
                    setCurrentDoc(newDoc);
                    setSelectedDeliveryDocId(docId);

                    const alertSuffix = (unregisteredList.length > 0 || typoList.length > 0)
                        ? ` (미등록 ${unregisteredList.length}·확인 ${typoList.length})`
                        : "";

                    if (dbRef.current) {
                        try {
                            await dbRef.current.collection('rrb_history').doc(docId).set({
                                fileName: newDoc.fileName,
                                itemType: newDoc.itemType,
                                yearMonth: newDoc.yearMonth,
                                uploadDate: newDoc.uploadDate,
                                timestamp: newDoc.timestamp,
                                totalSacks: newDoc.totalSacks,
                                totalKrSacks: newDoc.totalKrSacks,
                                totalUsSacks: newDoc.totalUsSacks,
                                expectedTotal: newDoc.expectedTotal,
                                totalMismatch: newDoc.totalMismatch,
                                unclassifiedCount: newDoc.unclassifiedCount,
                                unregisteredList: newDoc.unregisteredList,
                                typoList: newDoc.typoList,
                                recordsJson: JSON.stringify(newDoc.data)
                            });
                            showToast(
                                totalMismatch
                                    ? `⚠️ 팩스 합계(${expectedTotal}포)와 추출 합계(${totalSacks}포)가 다릅니다!`
                                    : `분류 및 클라우드 저장 완료! (총 ${totalSacks}포)${alertSuffix}`,
                                (totalMismatch || unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success"
                            );
                        } catch (e) {
                            console.error("Save history error:", e);
                            setHistory(prev => [newDoc, ...prev]);
                            showToast(`분류 완료 (로컬 임시저장 · 총 ${totalSacks}포)${alertSuffix}`, "info");
                        }
                    } else {
                        setHistory(prev => [newDoc, ...prev]);
                        showToast(
                            totalMismatch
                                ? `⚠️ 팩스 합계(${expectedTotal}포)와 추출 합계(${totalSacks}포)가 다릅니다!`
                                : `분류 완료! (총 ${totalSacks}포)${alertSuffix}`,
                            (totalMismatch || unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success"
                        );
                    }

                    // 합계 불일치 시에는 실수 방지용으로 자동다운 보류
                    if (autoDownloadExcel && !totalMismatch) {
                        setTimeout(() => exportToExcel(newDoc, itemType), 250);
                    }
                };

                // 중복 업로드 감지 (동일 품목 + 귀속월 + 총포대 + 업체수)
                const isDuplicate = history.some(h =>
                    h.yearMonth === yearMonth &&
                    (h.itemType || '쌀') === itemType &&
                    Number(h.totalSacks) === totalSacks &&
                    (h.data || []).length === parsedList.length
                );

                if (totalMismatch) {
                    setConfirmDialog({
                        title: '⚠️ 팩스 총합계 불일치 감지!',
                        message: `팩스 기준 합계는 ${expectedTotal}포인데, 추출된 합계는 ${totalSacks}포입니다 (차이: ${totalSacks - expectedTotal > 0 ? '+' : ''}${totalSacks - expectedTotal}포). 그래도 이대로 저장할까요?`,
                        confirmText: '그대로 저장',
                        danger: true,
                        onConfirm: commitNewDoc
                    });
                } else if (isDuplicate) {
                    setConfirmDialog({
                        title: '중복 내역 감지',
                        message: `${yearMonth} [${itemType}] ${parsedList.length}곳 · 총 ${totalSacks}포와 동일한 내역이 이미 있습니다. 한 번 더 저장할까요?`,
                        confirmText: '추가 저장',
                        danger: false,
                        onConfirm: commitNewDoc
                    });
                } else {
                    await commitNewDoc();
                }
            };

            // 로컬 임시 문서도 온라인 복귀 시 에러 없이 병합 저장 (.set(..., { merge: true }))
            const persistDocUpdate = async (updatedDoc) => {
                if (currentDoc && currentDoc.id === updatedDoc.id) setCurrentDoc(updatedDoc);
                setHistory(prev => prev.map(h => h.id === updatedDoc.id ? updatedDoc : h));

                if (dbRef.current) {
                    try {
                        await dbRef.current.collection('rrb_history').doc(updatedDoc.id).set({
                            fileName: updatedDoc.fileName,
                            itemType: updatedDoc.itemType || selectedItemType,
                            yearMonth: updatedDoc.yearMonth,
                            uploadDate: updatedDoc.uploadDate,
                            timestamp: updatedDoc.timestamp,
                            totalSacks: updatedDoc.totalSacks,
                            totalKrSacks: updatedDoc.totalKrSacks ?? updatedDoc.totalSacks,
                            totalUsSacks: updatedDoc.totalUsSacks ?? 0,
                            unclassifiedCount: updatedDoc.unclassifiedCount || 0,
                            recordsJson: JSON.stringify(updatedDoc.data)
                        }, { merge: true });
                    } catch (e) {
                        console.error("Update doc error:", e);
                    }
                }
            };

            const toggleDeliveryComplete = async (docObj, rowIndex) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) =>
                    idx === rowIndex ? { ...item, completed: !item.completed, mySacks: null } : item
                );
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            const toggleHalfDelivery = async (docObj, rowIndex) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) => {
                    if (idx === rowIndex) {
                        const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
                        const isCurrentlySplit = Boolean(item.completed && item.mySacks !== undefined && item.mySacks !== null && Number(item.mySacks) < total);
                        if (isCurrentlySplit) return { ...item, completed: true, mySacks: null };
                        const halfVal = total >= 2 ? Math.floor(total / 2) : total;
                        return { ...item, completed: true, mySacks: halfVal };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            const adjustMySacks = async (docObj, rowIndex, delta) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) => {
                    if (idx === rowIndex) {
                        const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
                        const cur = (item.mySacks !== undefined && item.mySacks !== null) ? Number(item.mySacks) : total;
                        const nextVal = Math.max(1, Math.min(total, cur + delta));
                        return { ...item, completed: true, mySacks: nextVal === total ? null : nextVal };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            const setBulkDeliveryComplete = async (docObj, targetIndices, status) => {
                if (!docObj || !targetIndices || targetIndices.length === 0) return;
                const idxSet = new Set(targetIndices);
                const updatedData = docObj.data.map((item, idx) =>
                    idxSet.has(idx) ? { ...item, completed: status, mySacks: null } : item
                );
                await persistDocUpdate({ ...docObj, data: updatedData });
                showToast(status ? `${targetIndices.length}곳 일괄 체크 완료!` : `${targetIndices.length}곳 체크 해지 완료!`, "success");
            };

            const deleteHistoryDoc = async (docId) => {
                if (currentDoc && currentDoc.id === docId) setCurrentDoc(null);
                setHistory(prev => {
                    const next = prev.filter(h => h.id !== docId);
                    if (selectedDeliveryDocId === docId) {
                        setSelectedDeliveryDocId(next.length > 0 ? next[0].id : '');
                    }
                    return next;
                });

                if (dbRef.current) {
                    try {
                        await dbRef.current.collection('rrb_history').doc(docId).delete();
                        showToast("클라우드 내역이 삭제되었습니다.", "success");
                    } catch (err) {
                        showToast("로컬 내역에서 삭제되었습니다.", "info");
                    }
                } else {
                    showToast("내역이 삭제되었습니다.", "success");
                }
            };

            // 8. 권역별 카톡 텍스트 원터치 복사 (미분류 존재 시 누락 경고 포함)
            const copyRegionKakaoText = async (docObj, regionsList, titleLabel) => {
                if (!docObj || !docObj.data) return;
                const itemLabel = docObj.itemType || (docObj.fileName && docObj.fileName.includes("팥") ? "팥" : selectedItemType);

                const resolved = docObj.data.map(item => {
                    const m = findSmartMaster(item.name, item.rep, item.phone, item.address) || {};
                    const addr = m.address || item.address || "";
                    const reg = (m.region && m.region !== "미분류") ? m.region : (item.region && item.region !== "미분류" ? item.region : inferRegionByAddress(addr));
                    return {
                        name: m.name || item.name,
                        address: addr,
                        phone: m.phone || item.phone || "",
                        region: reg,
                        sacks: Number(item.sacks) || 0,
                        usSacks: Number(item.usSacks) || 0
                    };
                });

                const unclassifiedItems = resolved.filter(r => r.region === '미분류');
                const lines = [`[${itemLabel} 배차 - ${titleLabel}]`];
                let grandTotal = 0;

                regionsList.forEach(regName => {
                    const list = resolved.filter(r => r.region === regName);
                    if (list.length === 0) return;
                    let subSum = 0;
                    lines.push(`\n■ ${regName} (${list.length}곳)`);
                    list.forEach((it, idx) => {
                        const tot = it.sacks + it.usSacks;
                        subSum += tot;
                        grandTotal += tot;
                        const detail = (itemLabel === '쌀' && it.usSacks > 0) ? `(국${it.sacks}/미${it.usSacks})` : '';
                        lines.push(`${idx + 1}. ${it.name} : ${tot}포${detail}${it.address ? ` / ${it.address}` : ''}`);
                    });
                    lines.push(`▶ ${regName} 소계: ${subSum}포`);
                });

                if (grandTotal === 0) {
                    showToast(`${titleLabel}에 배정된 물량이 없습니다.`, "error");
                    return;
                }

                lines.push(`\n총 합계: ${grandTotal}포`);
                const ok = await copyTextSafe(lines.join('\n'));
                if (ok) {
                    if (unclassifiedItems.length > 0 && !regionsList.includes('미분류')) {
                        showToast(`📲 [${titleLabel}] 복사 완료 (${grandTotal}포) · ⚠️ 미분류 ${unclassifiedItems.length}곳 별도 확인 필요!`, "error");
                    } else {
                        showToast(`📲 [${titleLabel}] 카톡 명단 복사 완료! (${grandTotal}포)`, "success");
                    }
                }
            };

            // 9. 스타일 적용 엑셀 다운로드 (팥 25kg(포) 단일 열 + 모든 합계 SUM 수식 적용)
            const exportToExcel = (docToExport, overrideItemType = null) => {
                if (!docToExport || !docToExport.data) return;

                const recoveredData = [];
                docToExport.data.forEach((item, idx) => {
                    const origNo = item.no !== undefined ? item.no : (idx + 1);
                    const sacks = Number(item.sacks) || 0;
                    const usSacks = Number(item.usSacks) || 0;

                    if (sacks > 0 || usSacks > 0) {
                        const cleanName = String(item.name).trim();
                        const master = findSmartMaster(cleanName, item.rep, item.phone, item.address) || {};
                        const resolvedName = master.name || cleanName;
                        const resolvedAddress = master.address || item.address || "";
                        const resolvedRegion = (master.region && master.region !== "미분류")
                            ? master.region
                            : ((item.region && item.region !== "미분류") ? item.region : inferRegionByAddress(resolvedAddress));

                        recoveredData.push({
                            no: origNo,
                            name: resolvedName,
                            rep: item.rep || master.rep || "",
                            region: resolvedRegion,
                            address: resolvedAddress,
                            phone: master.phone || item.phone || "",
                            sacks,
                            usSacks: usSacks > 0 ? usSacks : ""
                        });
                    }
                });

                if (recoveredData.length === 0) {
                    showToast("추출할 수량이 있는 데이터가 없습니다.", "error");
                    return;
                }

                const wb = XLSX.utils.book_new();
                const itemLabel = overrideItemType || docToExport.itemType || (docToExport.fileName && docToExport.fileName.includes("팥") ? "팥" : selectedItemType);
                const isBean = itemLabel === "팥";

                const borderThin = {
                    top: { style: "thin", color: { rgb: "D9D9D9" } },
                    bottom: { style: "thin", color: { rgb: "D9D9D9" } },
                    left: { style: "thin", color: { rgb: "D9D9D9" } },
                    right: { style: "thin", color: { rgb: "D9D9D9" } }
                };
                const borderSummary = {
                    top: { style: "thin", color: { rgb: "000000" } },
                    bottom: { style: "double", color: { rgb: "000000" } },
                    left: { style: "thin", color: { rgb: "D9D9D9" } },
                    right: { style: "thin", color: { rgb: "D9D9D9" } }
                };

                const buildRegionSheet = (regionsList) => {
                    const colCount = isBean ? 5 : 6;
                    const sData = [];
                    const sMerges = [];
                    const sRowTypes = [];
                    const sumMetaList = [];
                    let currentRow = 0;

                    regionsList.forEach(regionName => {
                        const items = recoveredData.filter(d => d.region === regionName);
                        if (items.length === 0) return;

                        // 권역 배너
                        sData.push(isBean ? [regionName, "", "", "", ""] : [regionName, "", "", "", "", ""]);
                        sMerges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: colCount - 1 } });
                        sRowTypes.push({ type: 'banner' });
                        currentRow++;

                        // 헤더
                        sData.push(isBean
                            ? ["상호", "대표자", "주소", "전화번호", "25kg(포)"]
                            : ["상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]
                        );
                        sRowTypes.push({ type: 'header' });
                        currentRow++;

                        const dataStartExcelRow = currentRow + 1; // 1-based Excel row
                        let sumKr = 0, sumUs = 0;
                        items.forEach(item => {
                            const krVal = Number(item.sacks) || 0;
                            const usVal = Number(item.usSacks) || 0;
                            sumKr += krVal;
                            sumUs += usVal;
                            if (isBean) {
                                sData.push([item.name, item.rep, item.address, item.phone, krVal + usVal]);
                            } else {
                                sData.push([item.name, item.rep, item.address, item.phone, krVal, item.usSacks]);
                            }
                            sRowTypes.push({ type: 'data' });
                            currentRow++;
                        });
                        const dataEndExcelRow = currentRow; // 1-based Excel row

                        // 권역 합계 행 (수식 정보 기록)
                        sData.push(isBean
                            ? ["", "", "", "합계", sumKr + sumUs]
                            : ["", "", "", "합계", sumKr, sumUs]
                        );
                        sumMetaList.push({
                            rowIdx: currentRow,
                            startRow: dataStartExcelRow,
                            endRow: dataEndExcelRow,
                            sumKr: isBean ? (sumKr + sumUs) : sumKr,
                            sumUs
                        });
                        sRowTypes.push({ type: 'sum' });
                        currentRow++;

                        // 빈 줄
                        sData.push(isBean ? ["", "", "", "", ""] : ["", "", "", "", "", ""]);
                        sRowTypes.push({ type: 'blank' });
                        currentRow++;
                    });

                    if (sData.length === 0) {
                        sData.push(isBean
                            ? ["해당 권역에 배정된 내역이 없습니다.", "", "", "", ""]
                            : ["해당 권역에 배정된 내역이 없습니다.", "", "", "", "", ""]
                        );
                        sMerges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: colCount - 1 } });
                        sRowTypes.push({ type: 'blank' });
                    }

                    const ws = XLSX.utils.aoa_to_sheet(sData);
                    ws['!merges'] = sMerges;
                    ws['!cols'] = isBean
                        ? [{ wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 12 }]
                        : [{ wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 11 }, { wch: 11 }];

                    // SUM 수식 주입
                    sumMetaList.forEach(meta => {
                        const cellE = XLSX.utils.encode_cell({ r: meta.rowIdx, c: 4 });
                        ws[cellE] = { t: 'n', f: `SUM(E${meta.startRow}:E${meta.endRow})`, v: meta.sumKr };
                        if (!isBean) {
                            const cellF = XLSX.utils.encode_cell({ r: meta.rowIdx, c: 5 });
                            ws[cellF] = { t: 'n', f: `SUM(F${meta.startRow}:F${meta.endRow})`, v: meta.sumUs };
                        }
                    });

                    const range = XLSX.utils.decode_range(ws['!ref']);
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        const rowInfo = sRowTypes[R] || { type: 'blank' };
                        for (let C = range.s.c; C <= range.e.c; ++C) {
                            const addr = XLSX.utils.encode_cell({ r: R, c: C });
                            if (!ws[addr]) ws[addr] = { t: 's', v: '' };

                            if (rowInfo.type === 'banner') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 12, bold: true, color: { rgb: "000000" } },
                                    fill: { fgColor: { rgb: "BDC6D4" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'header') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                                    fill: { fgColor: { rgb: "1F3864" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'data') {
                                const isSackCol = isBean ? (C === 4) : (C === 4 || C === 5);
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 11, bold: isSackCol, color: { rgb: isSackCol ? "C00000" : "000000" } },
                                    alignment: { horizontal: C === 2 ? "left" : "center", vertical: "center" },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'sum') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } },
                                    fill: { fgColor: { rgb: "FFD93B" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderSummary
                                };
                            }
                        }
                    }
                    return ws;
                };

                XLSX.utils.book_append_sheet(wb, buildRegionSheet(['제주시', '신제주']), "제주시·신제주");
                XLSX.utils.book_append_sheet(wb, buildRegionSheet(['서쪽', '동쪽', '서귀포', '미분류']), "서쪽·동쪽·서귀포");

                // 시트 3: 업체별 공급내역 (A열 지역, B열 번호, C열 상호 순 + SUM 수식)
                const s3Data = [
                    isBean
                        ? ["지역", "번호", "상호", "대표자", "주소", "전화번호", "25kg(포)"]
                        : ["지역", "번호", "상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]
                ];
                let totalKrAll = 0, totalUsAll = 0;

                recoveredData.forEach(item => {
                    const krVal = Number(item.sacks) || 0;
                    const usVal = Number(item.usSacks) || 0;
                    totalKrAll += krVal;
                    totalUsAll += usVal;
                    if (isBean) {
                        s3Data.push([item.region, item.no, item.name, item.rep, item.address, item.phone, krVal + usVal]);
                    } else {
                        s3Data.push([item.region, item.no, item.name, item.rep, item.address, item.phone, krVal, item.usSacks]);
                    }
                });
                s3Data.push(
                    isBean
                        ? ["", "", "", "", "", "총합계", totalKrAll + totalUsAll]
                        : ["", "", "", "", "", "총합계", totalKrAll, totalUsAll]
                );

                const ws3 = XLSX.utils.aoa_to_sheet(s3Data);
                ws3['!cols'] = isBean
                    ? [{ wch: 10 }, { wch: 8 }, { wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 12 }]
                    : [{ wch: 10 }, { wch: 8 }, { wch: 24 }, { wch: 12 }, { wch: 42 }, { wch: 16 }, { wch: 11 }, { wch: 11 }];

                const range3 = XLSX.utils.decode_range(ws3['!ref']);
                const lastRow3 = range3.e.r;

                // 시트 3 총합계 SUM 수식 주입
                const dataEndRow3 = lastRow3; // 1-based Excel row for last data row
                ws3[XLSX.utils.encode_cell({ r: lastRow3, c: 6 })] = {
                    t: 'n',
                    f: `SUM(G2:G${dataEndRow3})`,
                    v: isBean ? (totalKrAll + totalUsAll) : totalKrAll
                };
                if (!isBean) {
                    ws3[XLSX.utils.encode_cell({ r: lastRow3, c: 7 })] = {
                        t: 'n',
                        f: `SUM(H2:H${dataEndRow3})`,
                        v: totalUsAll
                    };
                }

                for (let R = range3.s.r; R <= range3.e.r; ++R) {
                    for (let C = range3.s.c; C <= range3.e.c; ++C) {
                        const addr = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws3[addr]) ws3[addr] = { t: 's', v: '' };

                        if (R === 0) {
                            ws3[addr].s = {
                                font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                                fill: { fgColor: { rgb: "1F3864" } },
                                alignment: { horizontal: "center", vertical: "center" },
                                border: borderThin
                            };
                        } else if (R === lastRow3) {
                            ws3[addr].s = {
                                font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } },
                                fill: { fgColor: { rgb: "FFD93B" } },
                                alignment: { horizontal: "center", vertical: "center" },
                                border: borderSummary
                            };
                        } else {
                            const isSackCol = isBean ? (C === 6) : (C === 6 || C === 7);
                            ws3[addr].s = {
                                font: { name: "맑은 고딕", sz: 11, bold: isSackCol, color: { rgb: isSackCol ? "C00000" : "000000" } },
                                alignment: { horizontal: C === 4 ? "left" : "center", vertical: "center" },
                                border: borderThin
                            };
                        }
                    }
                }
                XLSX.utils.book_append_sheet(wb, ws3, `${itemLabel} 업체별 공급내역`);

                const now = new Date();
                const yymmdd = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
                const outputFileName = `${itemLabel})떡집 ${itemLabel}배달_${yymmdd}.xlsx`;

                XLSX.writeFile(wb, outputFileName);
                showToast(`'${outputFileName}' 다운로드 완료! (SUM 수식 적용)`, "success");
            };

            // 10. 하차지(떡집 명단) 등록·수정·삭제·엑셀 동기화 (덮어쓰기 확인 + 중복 상호 감지)
            const addRegion = async (e) => {
                e.preventDefault();
                const name = newCompName.trim();
                if (!name) return;
                
                const newEntry = {
                    name,
                    rep: newCompRep.trim(),
                    region: newCompRegion,
                    address: newCompAddress.trim(),
                    phone: newCompPhone.trim()
                };

                const nextMaster = { ...masterData, [name]: newEntry };
                await saveMasterToCloud(nextMaster);
                setNewCompName(''); setNewCompRep(''); setNewCompAddress(''); setNewCompPhone('');
                showToast(`'${name}' 하차지가 저장되었습니다.`, "success");
            };

            const deleteRegionItem = async (name) => {
                const nextMaster = { ...masterData };
                delete nextMaster[name];
                await saveMasterToCloud(nextMaster);
                showToast(`'${name}' 하차지가 삭제되었습니다.`, "success");
            };

            const handleMasterExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const buffer = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(buffer, { type: 'array' });
                        const targetSheetName = wb.SheetNames.find(n => n.replace(/\s+/g, "").includes("떡집주소"))
                            || wb.SheetNames.find(n => n.includes("주소") || n.includes("명단"))
                            || wb.SheetNames[0];
                        const ws = wb.Sheets[targetSheetName];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        let headerIdx = -1;
                        let colMap = {};

                        for (let i = 0; i < data.length; i++) {
                            const row = data[i];
                            if (!row || !Array.isArray(row)) continue;
                            const rowStr = row.join(" ");
                            if (rowStr.includes("상호") || rowStr.includes("떡집명") || rowStr.includes("업체명")) {
                                headerIdx = i;
                                row.forEach((val, idx) => {
                                    if (val !== null && val !== undefined) {
                                        const cleanVal = String(val).replace(/\s+/g, "");
                                        if (cleanVal.includes("상호") || cleanVal.includes("업체명") || cleanVal.includes("떡집명")) colMap.name = idx;
                                        else if (cleanVal.includes("대표자") || cleanVal.includes("성명") || cleanVal.includes("대표")) colMap.rep = idx;
                                        else if (cleanVal.includes("주소") || cleanVal.includes("소재지")) colMap.address = idx;
                                        else if (cleanVal.includes("전화") || cleanVal.includes("연락처") || cleanVal.includes("휴대폰")) colMap.phone = idx;
                                        else if (cleanVal.includes("지역") || cleanVal.includes("권역")) colMap.region = idx;
                                    }
                                });
                                break;
                            }
                        }

                        if (headerIdx === -1 || colMap.name === undefined) {
                            showToast(`'${targetSheetName}' 시트에서 '상호' 열을 찾을 수 없습니다.`, "error");
                            return;
                        }

                        const newMaster = {};
                        const duplicateNames = [];
                        let successCount = 0;

                        for (let i = headerIdx + 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || !row[colMap.name]) continue;

                            const name = String(row[colMap.name]).trim();
                            if (!name || name.includes("합계") || name.includes("총합")) continue;

                            const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";
                            const address = colMap.address !== undefined && row[colMap.address] ? String(row[colMap.address]).trim() : "";
                            const phone = colMap.phone !== undefined && row[colMap.phone] ? String(row[colMap.phone]).trim() : "";
                            const explicitRegion = colMap.region !== undefined && row[colMap.region] ? String(row[colMap.region]).trim() : "";
                            const region = explicitRegion || inferRegionByAddress(address);

                            if (newMaster[name]) {
                                duplicateNames.push(name);
                            } else {
                                successCount++;
                            }
                            newMaster[name] = { name, rep, region, address, phone };
                        }

                        if (successCount === 0) {
                            showToast("엑셀에서 불러올 업체 데이터가 없습니다.", "error");
                            return;
                        }

                        const applyUpload = async () => {
                            await saveMasterToCloud(newMaster);
                            const dupMsg = duplicateNames.length > 0 ? ` (중복 상호 ${duplicateNames.length}건: ${duplicateNames.slice(0, 3).join(', ')})` : '';
                            showToast(`'${targetSheetName}' 기준 ${successCount}곳 명단 동기화 완료!${dupMsg}`, duplicateNames.length > 0 ? "error" : "success");
                        };

                        const prevCount = Object.keys(masterData).length;
                        if (prevCount > 0) {
                            const dupNotice = duplicateNames.length > 0
                                ? `\n⚠️ 엑셀 내 중복 상호 ${duplicateNames.length}건 감지: ${duplicateNames.slice(0, 4).join(', ')}`
                                : '';
                            setConfirmDialog({
                                title: '떡집 명단 전체 교체 확인',
                                message: `기존 명단 ${prevCount}곳을 '${targetSheetName}' 시트의 ${successCount}곳으로 전체 교체할까요?${dupNotice}`,
                                confirmText: '교체하기',
                                danger: false,
                                onConfirm: applyUpload
                            });
                        } else {
                            await applyUpload();
                        }
                    } catch (err) {
                        console.error("Master upload error:", err);
                        showToast("엑셀 명단 처리 중 오류가 발생했습니다.", "error");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const filteredStats = useMemo(() => {

                        const r = (m.region && m.region !== "미분류") ? m.region : (row.region && row.region !== "미분류" ? row.region : inferRegionByAddress(resolvedAddr));
                        
                        totalSacks += s;
                        totalCount += 1;
                        byRegion[r] = (byRegion[r] || 0) + s;
                        byCompany[canonicalName] = (byCompany[canonicalName] || 0) + s;

                        const myS = getEffectiveMySacks(row);

                            completedByCompany[canonicalName] = (completedByCompany[canonicalName] || 0) + myS;
