<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rice Red Bean</title>
    
    <!-- PWA & Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rice Red Bean">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f2eb">
    
    <!-- App Icon (Inline SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2344403c'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='55'>🌾</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2344403c'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='55'>🌾</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS Style (xlsx-js-style) for Styled Excel Read/Write -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc
        };
    </script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #e8e4dc; 
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d6cec2; border-radius: 2px; }
    </style>
</head>
<body class="text-stone-800 antialiased selection:bg-stone-200 selection:text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 기본 마스터 데이터 초기화 (임의 데이터 완전 제거 — [하차지 목록]에서 명단 엑셀 업로드로만 관리)
        const initialMasterData = {};
        const LOCAL_MASTER_KEY = 'rice_red_bean_master_v2';
        const LOCAL_HISTORY_KEY = 'rice_red_bean_history_v2';

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        function App() {
            const [activeTab, setActiveTab] = useState('upload');
            const [user, setUser] = useState(null);
            const [fbApi, setFbApi] = useState(null);
            const [appId, setAppId] = useState('default-rice-app');
            
            const [masterData, setMasterData] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_MASTER_KEY);
                    return saved ? JSON.parse(saved) : initialMasterData;
                } catch (e) {
                    return initialMasterData;
                }
            });
            const [history, setHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_HISTORY_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [currentDoc, setCurrentDoc] = useState(null);
            const [selectedDeliveryDocId, setSelectedDeliveryDocId] = useState('');
            const [deliveryRegionFilter, setDeliveryRegionFilter] = useState('전체');
            const [deliveryViewMode, setDeliveryViewMode] = useState('table'); // 'table' | 'checked_list'
            
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear().toString());
            const [selectedMonth, setSelectedMonth] = useState('ALL');
            const [toast, setToast] = useState(null);

            // 로컬 모드에서도 작업 내역 및 체크 기록 유지
            useEffect(() => {
                try { localStorage.setItem(LOCAL_HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
                if (history.length > 0 && !selectedDeliveryDocId) {
                    setSelectedDeliveryDocId(history[0].id);
                }
            }, [history]);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // 내가 실제 하차한 포대 수 계산 (전체 체크 vs 절반/부분 체크 반영)
            const getEffectiveMySacks = (row) => {
                if (!row || !row.completed) return 0;
                if (row.mySacks !== undefined && row.mySacks !== null) {
                    return Number(row.mySacks) || 0;
                }
                return (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
            };

            // 주소 문자열을 기반으로 제주 권역 자동 추론
            const inferRegionByAddress = (address = "") => {
                const addr = String(address).trim();
                if (!addr) return "미분류";
                if (addr.includes("애월") || addr.includes("한림") || addr.includes("한경") || addr.includes("대정") || addr.includes("안덕") || addr.includes("우정로") || addr.includes("외도")) {
                    return "서쪽";
                }
                if (addr.includes("조천") || addr.includes("구좌") || addr.includes("성산") || addr.includes("표선") || addr.includes("남원")) {
                    return "동쪽";
                }
                if (addr.includes("서귀포")) {
                    return "서귀포";
                }
                if (addr.includes("다랑곶") || addr.includes("과원") || addr.includes("신대로") || addr.includes("도공로") || addr.includes("오일장") || addr.includes("성신로") || addr.includes("우령") || addr.includes("아연로") || addr.includes("노형") || addr.includes("연동")) {
                    return "신제주";
                }
                if (addr.includes("제주시")) {
                    return "제주시";
                }
                return "미분류";
            };

            // 상호명이 다르게 적혀 있어도 대표자, 전화번호, 주소, 핵심 상호명으로 찾아내는 스마트 매칭 함수
            const findSmartMaster = (rawName, rawRep = "", rawPhone = "", rawAddr = "") => {
                const cleanName = String(rawName || "").trim();
                const noSpaceName = cleanName.replace(/\s+/g, "");
                const cleanRep = String(rawRep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                const cleanPhone = String(rawPhone || "").replace(/[^0-9]/g, "");
                const cleanAddr = String(rawAddr || "").replace(/\s+/g, "");

                const stripSuffix = (str) => String(str || "")
                    .replace(/\s+/g, "")
                    .replace(/\(주\)|㈜/g, "")
                    .replace(/(떡방앗간|떡방아간|떡방아|떡방|떡집|방앗간|방아간|오메기떡|오메기|식품|양과)/g, "");

                const coreTarget = stripSuffix(cleanName);

                // 1단계: 정확히 일치하거나 공백 제거 시 상호 일치
                if (masterData[cleanName]) return { ...masterData[cleanName], name: cleanName };
                const entries = Object.entries(masterData);
                for (const [k, info] of entries) {
                    if (k.replace(/\s+/g, "") === noSpaceName) return { ...info, name: k };
                }

                // 2단계: 전화번호 일치 (뒤 8자리 기준)
                if (cleanPhone.length >= 8) {
                    const tail = cleanPhone.slice(-8);
                    for (const [k, info] of entries) {
                        const mPhone = String(info.phone || "").replace(/[^0-9]/g, "");
                        if (mPhone.length >= 8 && mPhone.slice(-8) === tail) {
                            return { ...info, name: k };
                        }
                    }
                }

                // 3단계: 대표자명 + (핵심 상호명 또는 주소 일부) 일치
                if (cleanRep.length >= 2) {
                    const repMatches = entries.filter(([k, info]) => {
                        const mRep = String(info.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        return mRep && (mRep === cleanRep || mRep.includes(cleanRep) || cleanRep.includes(mRep));
                    });

                    if (repMatches.length === 1) {
                        return { ...repMatches[0][1], name: repMatches[0][0] };
                    } else if (repMatches.length > 1) {
                        for (const [k, info] of repMatches) {
                            const cKey = stripSuffix(k);
                            if (coreTarget && cKey && (cKey.includes(coreTarget) || coreTarget.includes(cKey))) {
                                return { ...info, name: k };
                            }
                            const mAddr = String(info.address || "").replace(/\s+/g, "");
                            if (cleanAddr && mAddr && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) {
                                return { ...info, name: k };
                            }
                        }
                        return { ...repMatches[0][1], name: repMatches[0][0] };
                    }
                }

                // 4단계: 핵심 상호명 일치
                if (coreTarget.length >= 2) {
                    for (const [k, info] of entries) {
                        const cKey = stripSuffix(k);
                        if (cKey && cKey === coreTarget) {
                            return { ...info, name: k };
                        }
                    }
                }

                // 5단계: 도로명 주소 일치
                if (cleanAddr.length >= 6) {
                    for (const [k, info] of entries) {
                        const mAddr = String(info.address || "").replace(/\s+/g, "");
                        if (mAddr.length >= 6 && (mAddr.includes(cleanAddr) || cleanAddr.includes(mAddr))) {
                            return { ...info, name: k };
                        }
                    }
                }

                return null;
            };

            useEffect(() => {
                const initFirebase = async () => {
                    const checkInterval = setInterval(async () => {
                        if (window.firebaseModules) {
                            clearInterval(checkInterval);
                            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } = window.firebaseModules;
                            
                            try {
                                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                                const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-rice-app';
                                setAppId(currentAppId);

                                if (configStr) {
                                    const firebaseConfig = JSON.parse(configStr);
                                    const app = initializeApp(firebaseConfig);
                                    const auth = getAuth(app);
                                    const db = getFirestore(app);

                                    setFbApi({ db, auth, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc });

                                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                        await signInWithCustomToken(auth, __initial_auth_token);
                                    } else {
                                        await signInAnonymously(auth);
                                    }

                                    onAuthStateChanged(auth, (currentUser) => {
                                        setUser(currentUser);
                                    });
                                }
                            } catch (e) {
                                console.error("Firebase Init Error:", e);
                            }
                        }
                    }, 100);
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (!user || !fbApi) return;
                const { db, collection, onSnapshot } = fbApi;
                
                const regionsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'regions');
                const unsubscribe = onSnapshot(regionsRef, (snapshot) => {
                    const loaded = {};
                    snapshot.forEach(docSnap => {
                        const d = docSnap.data();
                        if (d && d.name) {
                            loaded[d.name] = {
                                region: d.region || "미분류",
                                rep: d.rep || "",
                                address: d.address || "",
                                phone: d.phone || ""
                            };
                        }
                    });
                    setMasterData(loaded);
                    try { localStorage.setItem(LOCAL_MASTER_KEY, JSON.stringify(loaded)); } catch (e) {}
                }, (error) => console.error("Regions sync error:", error));
                return () => unsubscribe();
            }, [user, fbApi]);

            useEffect(() => {
                if (!user || !fbApi) return;
                const { db, collection, onSnapshot } = fbApi;

                const historyRef = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
                const unsubscribe = onSnapshot(historyRef, (snapshot) => {
                    const loadedHistory = [];
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        loadedHistory.push({
                            ...data,
                            id: docSnap.id,
                            data: JSON.parse(data.recordsJson || "[]")
                        });
                    });
                    loadedHistory.sort((a, b) => b.timestamp - a.timestamp);
                    setHistory(loadedHistory);
                    if (loadedHistory.length > 0 && !selectedDeliveryDocId) {
                        setSelectedDeliveryDocId(loadedHistory[0].id);
                    }
                }, (error) => console.error("History sync error:", error));
                return () => unsubscribe();
            }, [user, fbApi]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                let year = new Date().getFullYear().toString();
                let month = (new Date().getMonth() + 1).toString().padStart(2, '0');
                
                const korMatch = file.name.match(/(?:20)?(\d{2})년\s*(\d{1,2})월/);
                const hyphenMatch = file.name.match(/(20\d{2})[-._]?(\d{1,2})/);
                const shortMatch = file.name.match(/(\d{2})[-._](\d{1,2})/);

                if (korMatch) {
                    year = "20" + korMatch[1];
                    month = korMatch[2].padStart(2, '0');
                } else if (hyphenMatch) {
                    year = hyphenMatch[1];
                    month = hyphenMatch[2].padStart(2, '0');
                } else if (shortMatch) {
                    year = "20" + shortMatch[1];
                    month = shortMatch[2].padStart(2, '0');
                }

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        await processExcelData(data, file.name, `${year}-${month}`);
                    } catch (err) {
                        console.error(err);
                        showToast("파일 처리 중 오류가 발생했습니다.", "error");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; 
            };

            const processExcelData = async (rows, fileName, yearMonth) => {
                let headerRowIdx = -1;
                let colMap = {};

                for (let i = 0; i < Math.min(rows.length, 20); i++) {
                    const row = rows[i];
                    if (!row || !Array.isArray(row)) continue;
                    const rowStr = row.join(" ");
                    if (rowStr.includes("상호") && (rowStr.includes("포") || rowStr.includes("수량") || rowStr.includes("국산") || rowStr.includes("25kg") || rowStr.includes("20kg"))) {
                        headerRowIdx = i;
                        row.forEach((cell, idx) => {
                            if (cell !== null && cell !== undefined) {
                                const cleanCell = String(cell).replace(/\s+/g, "");
                                if (cleanCell.includes("번호") && !cleanCell.includes("코드") && !cleanCell.includes("전화")) colMap.no = idx;
                                else if (cleanCell.includes("상호") || cleanCell.includes("업체명")) colMap.name = idx;
                                else if (cleanCell.includes("대표") || cleanCell.includes("성명")) colMap.rep = idx;
                                else if (cleanCell.includes("주소") || cleanCell.includes("소재지")) colMap.address = idx;
                                else if (cleanCell.includes("전화") || cleanCell.includes("연락처")) colMap.phone = idx;
                                else if (cleanCell.includes("국산") || cleanCell.includes("20kg") || cleanCell.includes("25kg") || (cleanCell.includes("포") && !cleanCell.includes("미국"))) colMap.sack = idx;
                                else if (cleanCell.includes("미국산") || cleanCell.includes("외국산") || cleanCell.includes("수입")) colMap.usSack = idx;
                            }
                        });
                        break;
                    }
                }

                if (headerRowIdx === -1 || colMap.name === undefined) {
                    showToast("엑셀에서 '상호'나 '수량(포)' 열을 찾을 수 없습니다.", "error");
                    return;
                }

                const parsedList = [];
                let totalSacks = 0;
                let unclassifiedCount = 0;
                const unregisteredList = [];
                const typoList = [];

                for (let i = headerRowIdx + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;
                    
                    const rawName = row[colMap.name];
                    if (!rawName) continue;
                    
                    const cleanName = String(rawName).trim();
                    if (cleanName === "" || cleanName.includes("합계") || cleanName.includes("총계") || cleanName.includes("소계")) continue;

                    const origNo = colMap.no !== undefined ? row[colMap.no] : (parsedList.length + 1);
                    const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";

                    const rawSacks = colMap.sack !== undefined ? row[colMap.sack] : 0;
                    const sacks = parseInt(String(rawSacks || "0").replace(/[^0-9]/g, ''), 10) || 0;

                    const rawUs = colMap.usSack !== undefined ? row[colMap.usSack] : 0;
                    const usSacks = parseInt(String(rawUs || "0").replace(/[^0-9]/g, ''), 10) || 0;
                    
                    if (sacks === 0 && usSacks === 0) continue;

                    const rowAddr = (colMap.address !== undefined && row[colMap.address]) ? String(row[colMap.address]).trim() : "";
                    const rowPhone = (colMap.phone !== undefined && row[colMap.phone]) ? String(row[colMap.phone]).trim() : "";

                    const master = findSmartMaster(cleanName, rep, rowPhone, rowAddr);

                    const unifiedName = (master && master.name) ? master.name : cleanName;
                    let address = (master && master.address) ? master.address : rowAddr;
                    let phone = (master && master.phone) ? master.phone : rowPhone;
                    let region = (master && master.region && master.region !== "미분류")
                        ? master.region
                        : inferRegionByAddress(address);

                    if (region === "미분류") {
                        unclassifiedCount++;
                    }

                    // 미등록 업체 및 오타·표기 불일치 검증
                    if (!master) {
                        unregisteredList.push({
                            no: origNo,
                            name: cleanName,
                            rep: rep,
                            phone: rowPhone,
                            address: rowAddr,
                            sacks: sacks + usSacks
                        });
                    } else {
                        const normFileName = cleanName.replace(/\s+/g, "");
                        const normMasterName = String(master.name || "").replace(/\s+/g, "");
                        const normFileRep = String(rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        const normMasterRep = String(master.rep || "").replace(/외\s*\d+명?|\s+/g, "").trim();
                        const nameDiff = normFileName !== normMasterName;
                        const repDiff = Boolean(normFileRep && normMasterRep && normFileRep !== normMasterRep);

                        if (nameDiff || repDiff) {
                            typoList.push({
                                no: origNo,
                                fileName: cleanName,
                                masterName: master.name,
                                fileRep: rep,
                                masterRep: master.rep || "",
                                nameDiff,
                                repDiff
                            });
                        }
                    }

                    totalSacks += sacks;

                    parsedList.push({
                        no: origNo,
                        name: unifiedName,
                        rep: rep || (master && master.rep ? master.rep : ""),
                        region: region,
                        address: address,
                        phone: phone,
                        sacks: sacks,
                        usSacks: usSacks,
                        completed: false,
                        mySacks: null,
                        originalRow: row
                    });
                }

                if (parsedList.length === 0) {
                    showToast("배정된 포대 수량이 있는 업체가 없습니다.", "error");
                    return;
                }

                const docId = `doc_${Date.now()}`;
                const newDoc = {
                    id: docId,
                    fileName,
                    yearMonth,
                    uploadDate: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now(),
                    totalSacks,
                    unclassifiedCount,
                    unregisteredList,
                    typoList,
                    data: parsedList
                };

                setCurrentDoc(newDoc);
                setSelectedDeliveryDocId(docId);

                const alertSuffix = (unregisteredList.length > 0 || typoList.length > 0)
                    ? ` (미등록 ${unregisteredList.length}·오타/확인 ${typoList.length})`
                    : "";

                if (user && fbApi) {
                    try {
                        const { db, doc, setDoc } = fbApi;
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'history', docId);
                        await setDoc(docRef, {
                            fileName: newDoc.fileName,
                            yearMonth: newDoc.yearMonth,
                            uploadDate: newDoc.uploadDate,
                            timestamp: newDoc.timestamp,
                            totalSacks: newDoc.totalSacks,
                            unclassifiedCount: newDoc.unclassifiedCount,
                            unregisteredList: newDoc.unregisteredList,
                            typoList: newDoc.typoList,
                            recordsJson: JSON.stringify(newDoc.data)
                        });
                        showToast(`분류 및 저장 완료! (총 ${totalSacks}포)${alertSuffix}`, (unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success");
                    } catch (e) {
                        console.error("Save history error", e);
                        showToast("클라우드 저장 실패 (임시 상태로만 열람 가능)", "error");
                    }
                } else {
                    setHistory(prev => [newDoc, ...prev]);
                    showToast(`분류 완료! (총 ${totalSacks}포)${alertSuffix}`, (unregisteredList.length > 0 || typoList.length > 0) ? "error" : "success");
                }
            };
            const persistDocUpdate = async (updatedDoc) => {
                if (currentDoc && currentDoc.id === updatedDoc.id) {
                    setCurrentDoc(updatedDoc);
                }
                setHistory(prev => prev.map(h => h.id === updatedDoc.id ? updatedDoc : h));

                if (user && fbApi) {
                    try {
                        const { db, doc, setDoc } = fbApi;
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'history', updatedDoc.id);
                        await setDoc(docRef, {
                            fileName: updatedDoc.fileName,
                            yearMonth: updatedDoc.yearMonth,
                            uploadDate: updatedDoc.uploadDate,
                            timestamp: updatedDoc.timestamp,
                            totalSacks: updatedDoc.totalSacks,
                            unclassifiedCount: updatedDoc.unclassifiedCount,
                            unregisteredList: updatedDoc.unregisteredList || [],
                            typoList: updatedDoc.typoList || [],
                            recordsJson: JSON.stringify(updatedDoc.data)
                        });
                    } catch (e) {
                        console.error("Update doc error:", e);
                    }
                }
            };

            const toggleDeliveryComplete = async (docObj, rowIndex) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) => {
                    if (idx === rowIndex) {
                        return { ...item, completed: !item.completed, mySacks: null };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            // 절반 체크 토글 (두 대 차량이 나눠 하차하는 경우)
            const toggleHalfDelivery = async (docObj, rowIndex) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) => {
                    if (idx === rowIndex) {
                        const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
                        const isCurrentlySplit = Boolean(item.completed && item.mySacks !== undefined && item.mySacks !== null && Number(item.mySacks) < total);
                        if (isCurrentlySplit) {
                            return { ...item, completed: true, mySacks: null };
                        }
                        const halfVal = total >= 2 ? Math.floor(total / 2) : total;
                        return { ...item, completed: true, mySacks: halfVal };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            // 분할 하차 수량 미세 조정 (+1 / -1 포)
            const adjustMySacks = async (docObj, rowIndex, delta) => {
                if (!docObj) return;
                const updatedData = docObj.data.map((item, idx) => {
                    if (idx === rowIndex) {
                        const total = (Number(item.sacks) || 0) + (Number(item.usSacks) || 0);
                        const cur = (item.mySacks !== undefined && item.mySacks !== null) ? Number(item.mySacks) : total;
                        const nextVal = Math.max(1, Math.min(total, cur + delta));
                        return { ...item, completed: true, mySacks: nextVal === total ? null : nextVal };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
            };

            const setBulkDeliveryComplete = async (docObj, targetIndices, status) => {
                if (!docObj || !targetIndices || targetIndices.length === 0) return;
                const idxSet = new Set(targetIndices);
                const updatedData = docObj.data.map((item, idx) => {
                    if (idxSet.has(idx)) {
                        return { ...item, completed: status, mySacks: null };
                    }
                    return item;
                });
                await persistDocUpdate({ ...docObj, data: updatedData });
                showToast(status ? `${targetIndices.length}곳 일괄 체크 완료!` : `${targetIndices.length}곳 체크 해지 완료!`, "success");
            };

            const deleteHistoryDoc = async (docId, e) => {
                if (e) e.stopPropagation();
                if (currentDoc && currentDoc.id === docId) {
                    setCurrentDoc(null);
                }
                setHistory(prev => {
                    const next = prev.filter(h => h.id !== docId);
                    if (selectedDeliveryDocId === docId) {
                        setSelectedDeliveryDocId(next.length > 0 ? next[0].id : '');
                    }
                    return next;
                });

                if (user && fbApi) {
                    try {
                        const { db, doc, deleteDoc } = fbApi;
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'history', docId));
                        showToast("내역이 삭제되었습니다.", "success");
                    } catch (err) {
                        console.error("Delete history error:", err);
                        showToast("삭제 중 오류가 발생했습니다.", "error");
                    }
                } else {
                    showToast("내역이 삭제되었습니다.", "success");
                }
            };

            const exportToExcel = (docToExport) => {
                if (!docToExport || !docToExport.data) return;

                const recoveredData = [];
                docToExport.data.forEach((item, idx) => {
                    const r = item.originalRow || [];
                    const origNo = item.no !== undefined ? item.no : (r[0] !== undefined ? r[0] : (idx + 1));
                    const sacks = Number(item.sacks) || 0;
                    const usSacks = Number(item.usSacks) || 0;

                    let phoneFromRow = "";
                    if (Array.isArray(r)) {
                        r.forEach(cell => {
                            if (cell && String(cell).includes("010-")) phoneFromRow = String(cell).trim();
                        });
                    }

                    if (sacks > 0 || usSacks > 0) {
                        const cleanName = String(item.name).trim();
                        const master = findSmartMaster(cleanName, item.rep, item.phone || phoneFromRow, item.address) || {};
                        const resolvedName = master.name || cleanName;
                        const resolvedAddress = master.address || item.address || "";
                        const resolvedRegion = (master.region && master.region !== "미분류")
                            ? master.region
                            : ((item.region && item.region !== "미분류") ? item.region : inferRegionByAddress(resolvedAddress));

                        recoveredData.push({
                            no: origNo,
                            name: resolvedName,
                            rep: item.rep || master.rep || "",
                            region: resolvedRegion,
                            address: resolvedAddress,
                            phone: master.phone || item.phone || phoneFromRow || "",
                            sacks: sacks,
                            usSacks: usSacks > 0 ? usSacks : ""
                        });
                    }
                });

                if (recoveredData.length === 0) {
                    showToast("추출할 수량이 있는 데이터가 없습니다.", "error");
                    return;
                }

                const wb = XLSX.utils.book_new();
                const isBean = docToExport.fileName && docToExport.fileName.includes("팥");
                const itemLabel = isBean ? "팥" : "쌀";

                const borderThin = {
                    top: { style: "thin", color: { rgb: "D9D9D9" } },
                    bottom: { style: "thin", color: { rgb: "D9D9D9" } },
                    left: { style: "thin", color: { rgb: "D9D9D9" } },
                    right: { style: "thin", color: { rgb: "D9D9D9" } }
                };

                const borderSummary = {
                    top: { style: "thin", color: { rgb: "000000" } },
                    bottom: { style: "double", color: { rgb: "000000" } },
                    left: { style: "thin", color: { rgb: "D9D9D9" } },
                    right: { style: "thin", color: { rgb: "D9D9D9" } }
                };

                // 권역 그룹별 시트 생성 공통 함수
                const buildRegionSheet = (regionsList) => {
                    const sData = [];
                    const sMerges = [];
                    const sRowTypes = [];
                    let currentRow = 0;

                    regionsList.forEach(regionName => {
                        const items = recoveredData.filter(d => d.region === regionName);
                        if (items.length === 0) return;

                        // 1. 권역 타이틀 바
                        sData.push([regionName, "", "", "", "", ""]);
                        sMerges.push({ s: { r: currentRow, c: 0 }, e: { r: currentRow, c: 5 } });
                        sRowTypes.push({ type: 'banner' });
                        currentRow++;

                        // 2. 컬럼 헤더
                        sData.push(["상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]);
                        sRowTypes.push({ type: 'header' });
                        currentRow++;

                        // 3. 업체 목록
                        let sumKr = 0;
                        let sumUs = 0;
                        items.forEach(item => {
                            sumKr += (Number(item.sacks) || 0);
                            sumUs += (Number(item.usSacks) || 0);
                            sData.push([
                                item.name,
                                item.rep,
                                item.address,
                                item.phone,
                                item.sacks,
                                item.usSacks
                            ]);
                            sRowTypes.push({ type: 'data' });
                            currentRow++;
                        });

                        // 4. 권역 합계 행
                        sData.push(["", "", "", "합계", sumKr, sumUs]);
                        sRowTypes.push({ type: 'sum' });
                        currentRow++;

                        // 5. 빈 줄
                        sData.push(["", "", "", "", "", ""]);
                        sRowTypes.push({ type: 'blank' });
                        currentRow++;
                    });

                    if (sData.length === 0) {
                        sData.push(["해당 권역에 배정된 내역이 없습니다.", "", "", "", "", ""]);
                        sMerges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } });
                        sRowTypes.push({ type: 'blank' });
                    }

                    const ws = XLSX.utils.aoa_to_sheet(sData);
                    ws['!merges'] = sMerges;
                    ws['!cols'] = [
                        { wch: 24 }, // 상호
                        { wch: 12 }, // 대표자
                        { wch: 42 }, // 주소
                        { wch: 16 }, // 전화번호
                        { wch: 11 }, // 국산(포)
                        { wch: 11 }  // 미국산(포)
                    ];

                    const range = XLSX.utils.decode_range(ws['!ref']);
                    for (let R = range.s.r; R <= range.e.r; ++R) {
                        const rowInfo = sRowTypes[R] || { type: 'blank' };
                        for (let C = range.s.c; C <= range.e.c; ++C) {
                            const addr = XLSX.utils.encode_cell({ r: R, c: C });
                            if (!ws[addr]) ws[addr] = { t: 's', v: '' };

                            if (rowInfo.type === 'banner') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 12, bold: true, color: { rgb: "000000" } },
                                    fill: { fgColor: { rgb: "BDC6D4" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'header') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                                    fill: { fgColor: { rgb: "1F3864" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'data') {
                                const isSackCol = (C === 4 || C === 5);
                                ws[addr].s = {
                                    font: {
                                        name: "맑은 고딕",
                                        sz: 11,
                                        bold: isSackCol,
                                        color: { rgb: isSackCol ? "C00000" : "000000" }
                                    },
                                    alignment: {
                                        horizontal: C === 2 ? "left" : "center",
                                        vertical: "center"
                                    },
                                    border: borderThin
                                };
                            } else if (rowInfo.type === 'sum') {
                                ws[addr].s = {
                                    font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } },
                                    fill: { fgColor: { rgb: "FFD93B" } },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: borderSummary
                                };
                            }
                        }
                    }
                    return ws;
                };

                // ==========================================
                // 시트 1: 제주시 · 신제주
                // ==========================================
                const ws1 = buildRegionSheet(['제주시', '신제주']);
                XLSX.utils.book_append_sheet(wb, ws1, "제주시·신제주");

                // ==========================================
                // 시트 2: 서쪽 · 동쪽 · 서귀포 (미분류 포함)
                // ==========================================
                const ws2 = buildRegionSheet(['서쪽', '동쪽', '서귀포', '미분류']);
                XLSX.utils.book_append_sheet(wb, ws2, "서쪽·동쪽·서귀포");

                // ==========================================
                // 시트 3: 원본 내역 (A열: 지역, B열: 번호, C열: 상호 순)
                // ==========================================
                const s3Data = [
                    ["지역", "번호", "상호", "대표자", "주소", "전화번호", "국산(포)", "미국산(포)"]
                ];
                let totalKrAll = 0;
                let totalUsAll = 0;

                recoveredData.forEach(item => {
                    totalKrAll += (Number(item.sacks) || 0);
                    totalUsAll += (Number(item.usSacks) || 0);
                    s3Data.push([
                        item.region,
                        item.no,
                        item.name,
                        item.rep,
                        item.address,
                        item.phone,
                        item.sacks,
                        item.usSacks
                    ]);
                });

                s3Data.push(["", "", "", "", "", "총합계", totalKrAll, totalUsAll > 0 ? totalUsAll : 0]);

                const ws3 = XLSX.utils.aoa_to_sheet(s3Data);
                ws3['!cols'] = [
                    { wch: 10 }, // A: 지역
                    { wch: 8 },  // B: 번호
                    { wch: 24 }, // C: 상호
                    { wch: 12 }, // D: 대표자
                    { wch: 42 }, // E: 주소
                    { wch: 16 }, // F: 전화번호
                    { wch: 11 }, // G: 국산(포)
                    { wch: 11 }  // H: 미국산(포)
                ];

                const range3 = XLSX.utils.decode_range(ws3['!ref']);
                const lastRow3 = range3.e.r;
                for (let R = range3.s.r; R <= range3.e.r; ++R) {
                    for (let C = range3.s.c; C <= range3.e.c; ++C) {
                        const addr = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws3[addr]) ws3[addr] = { t: 's', v: '' };

                        if (R === 0) {
                            ws3[addr].s = {
                                font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                                fill: { fgColor: { rgb: "1F3864" } },
                                alignment: { horizontal: "center", vertical: "center" },
                                border: borderThin
                            };
                        } else if (R === lastRow3) {
                            ws3[addr].s = {
                                font: { name: "맑은 고딕", sz: 11, bold: true, color: { rgb: "000000" } },
                                fill: { fgColor: { rgb: "FFD93B" } },
                                alignment: { horizontal: "center", vertical: "center" },
                                border: borderSummary
                            };
                        } else {
                            const isSackCol = (C === 6 || C === 7);
                            ws3[addr].s = {
                                font: {
                                    name: "맑은 고딕",
                                    sz: 11,
                                    bold: isSackCol,
                                    color: { rgb: isSackCol ? "C00000" : "000000" }
                                },
                                alignment: {
                                    horizontal: C === 4 ? "left" : "center",
                                    vertical: "center"
                                },
                                border: borderThin
                            };
                        }
                    }
                }
                XLSX.utils.book_append_sheet(wb, ws3, `${itemLabel} 업체별 공급내역`);

                const cleanFileName = docToExport.fileName.replace(/\.[^/.]+$/, "");
                XLSX.writeFile(wb, `배송분류완료_${cleanFileName}.xlsx`);
                showToast("권역별 분류 엑셀 다운로드가 완료되었습니다!", "success");
            };

            const [newCompName, setNewCompName] = useState('');
            const [newCompRep, setNewCompRep] = useState('');
            const [newCompRegion, setNewCompRegion] = useState('제주시');
            const [newCompAddress, setNewCompAddress] = useState('');
            const [newCompPhone, setNewCompPhone] = useState('');

            const addRegion = async (e) => {
                e.preventDefault();
                const name = newCompName.trim();
                if (!name) return;
                
                const newEntry = {
                    name,
                    rep: newCompRep.trim(),
                    region: newCompRegion,
                    address: newCompAddress.trim(),
                    phone: newCompPhone.trim()
                };

                if (user && fbApi) {
                    try {
                        const { db, doc, setDoc } = fbApi;
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'regions', name.replace(/\//g, '_'));
                        await setDoc(docRef, newEntry);
                        setNewCompName(''); setNewCompRep(''); setNewCompAddress(''); setNewCompPhone('');
                        showToast(`'${name}' 하차지가 저장되었습니다.`);
                    } catch (err) {
                        console.error("Add region error:", err);
                    }
                } else {
                    setMasterData(prev => {
                        const next = { ...prev, [name]: newEntry };
                        try { localStorage.setItem(LOCAL_MASTER_KEY, JSON.stringify(next)); } catch (e) {}
                        return next;
                    });
                    setNewCompName(''); setNewCompRep(''); setNewCompAddress(''); setNewCompPhone('');
                    showToast(`'${name}' 로컬 저장 완료.`);
                }
            };

            const handleMasterExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const targetSheetName = wb.SheetNames.find(n => n.replace(/\s+/g, "").includes("떡집주소"))
                            || wb.SheetNames.find(n => n.includes("주소") || n.includes("명단"))
                            || wb.SheetNames[0];
                        const ws = wb.Sheets[targetSheetName];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        let headerIdx = -1;
                        let colMap = {};

                        for (let i = 0; i < data.length; i++) {
                            const row = data[i];
                            if (!row || !Array.isArray(row)) continue;
                            const rowStr = row.join(" ");
                            if (rowStr.includes("상호") || rowStr.includes("떡집명") || rowStr.includes("업체명")) {
                                headerIdx = i;
                                row.forEach((val, idx) => {
                                    if (val !== null && val !== undefined) {
                                        const cleanVal = String(val).replace(/\s+/g, "");
                                        if (cleanVal.includes("상호") || cleanVal.includes("업체명") || cleanVal.includes("떡집명")) colMap.name = idx;
                                        else if (cleanVal.includes("대표자") || cleanVal.includes("성명") || cleanVal.includes("대표")) colMap.rep = idx;
                                        else if (cleanVal.includes("주소") || cleanVal.includes("소재지")) colMap.address = idx;
                                        else if (cleanVal.includes("전화") || cleanVal.includes("연락처") || cleanVal.includes("휴대폰")) colMap.phone = idx;
                                        else if (cleanVal.includes("지역") || cleanVal.includes("권역")) colMap.region = idx;
                                    }
                                });
                                break;
                            }
                        }

                        if (headerIdx === -1 || colMap.name === undefined) {
                            showToast(`'${targetSheetName}' 시트에서 '상호' 열을 찾을 수 없습니다.`, "error");
                            return;
                        }

                        // 기존 잘못된 데이터를 남기지 않도록 완전히 새 명단 객체로 교체
                        const newMaster = {};
                        let successCount = 0;

                        for (let i = headerIdx + 1; i < data.length; i++) {
                            const row = data[i];
                            if (!row || !row[colMap.name]) continue;

                            const name = String(row[colMap.name]).trim();
                            if (!name || name.includes("합계") || name.includes("총합")) continue;

                            const rep = colMap.rep !== undefined && row[colMap.rep] ? String(row[colMap.rep]).trim() : "";
                            const address = colMap.address !== undefined && row[colMap.address] ? String(row[colMap.address]).trim() : "";
                            const phone = colMap.phone !== undefined && row[colMap.phone] ? String(row[colMap.phone]).trim() : "";
                            const explicitRegion = colMap.region !== undefined && row[colMap.region] ? String(row[colMap.region]).trim() : "";

                            const region = explicitRegion || inferRegionByAddress(address);

                            newMaster[name] = {
                                name,
                                rep,
                                region,
                                address,
                                phone
                            };
                            successCount++;
                        }

                        if (successCount === 0) {
                            showToast("엑셀에서 불러올 업체 데이터가 없습니다.", "error");
                            return;
                        }

                        // 클라우드 연결 시 기존 구버전 문서 삭제 후 새 명단 일괄 반영
                        if (user && fbApi) {
                            const { db, doc, setDoc, deleteDoc } = fbApi;
                            const oldKeys = Object.keys(masterData);
                            for (const oldName of oldKeys) {
                                if (!newMaster[oldName]) {
                                    try {
                                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'regions', oldName.replace(/\//g, '_')));
                                    } catch (delErr) {
                                        console.error("Delete old region error:", delErr);
                                    }
                                }
                            }
                            for (const [name, entry] of Object.entries(newMaster)) {
                                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'regions', name.replace(/\//g, '_'));
                                await setDoc(docRef, entry);
                            }
                        }

                        setMasterData(newMaster);
                        try { localStorage.setItem(LOCAL_MASTER_KEY, JSON.stringify(newMaster)); } catch (e) {}
                        showToast(`'${targetSheetName}' 시트 기준 ${successCount}곳 명단으로 완전 교체 완료!`, "success");
                    } catch (err) {
                        console.error("Master upload error:", err);
                        showToast("엑셀 명단 처리 중 오류가 발생했습니다.", "error");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            const filteredStats = useMemo(() => {
                let totalSacks = 0;
                let completedSacks = 0;
                let completedCount = 0;
                let totalCount = 0;
                const byRegion = { '제주시': 0, '신제주': 0, '서쪽': 0, '동쪽': 0, '서귀포': 0, '미분류': 0 };
                const completedByRegion = { '제주시': 0, '신제주': 0, '서쪽': 0, '동쪽': 0, '서귀포': 0, '미분류': 0 };
                const byCompany = {};
                const completedByCompany = {};

                const targetDocs = history.filter(doc => {
                    if (!doc.yearMonth) return false;
                    const [y, m] = doc.yearMonth.split('-');
                    if (y !== selectedYear) return false;
                    if (selectedMonth !== 'ALL' && m !== selectedMonth) return false;
                    return true;
                });

                targetDocs.forEach(doc => {
                    doc.data.forEach(row => {
                        const s = (Number(row.sacks) || 0) + (Number(row.usSacks) || 0);
                        const m = findSmartMaster(row.name, row.rep, row.phone, row.address) || {};
                        const canonicalName = m.name || row.name;
                        const resolvedAddr = m.address || row.address || "";
                        const r = (m.region && m.region !== "미분류") ? m.region : (row.region && row.region !== "미분류" ? row.region : inferRegionByAddress(resolvedAddr));
                        
                        totalSacks += s;
                        totalCount += 1;
                        byRegion[r] = (byRegion[r] || 0) + s;
                        byCompany[canonicalName] = (byCompany[canonicalName] || 0) + s;

                        const myS = getEffectiveMySacks(row);
                        if (row.completed && myS > 0) {
                            completedSacks += myS;
                            completedCount += 1;
                            completedByRegion[r] = (completedByRegion[r] || 0) + myS;
                            completedByCompany[canonicalName] = (completedByCompany[canonicalName] || 0) + myS;
                        }
                    });
                });

                const topCompanies = Object.entries(byCompany)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);

                const myCompletedCompanies = Object.entries(completedByCompany)
                    .sort((a, b) => b[1] - a[1]);

                return { totalSacks, completedSacks, completedCount, totalCount, byRegion, completedByRegion, topCompanies, myCompletedCompanies, docCount: targetDocs.length };
            }, [history, selectedYear, selectedMonth, masterData]);

            const availableYears = useMemo(() => {
                const years = new Set([new Date().getFullYear().toString()]);
                history.forEach(doc => {
                    if (doc.yearMonth) years.add(doc.yearMonth.split('-')[0]);
                });
                return Array.from(years).sort().reverse();
            }, [history]);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#f5f2eb] shadow-2xl flex flex-col relative pb-20 border-x border-[#e6dfd5]">
                    {toast && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-11/12 max-w-sm bg-stone-800 text-[#fdfbf7] px-4 py-3 rounded-2xl shadow-xl flex items-center text-sm font-medium">

                            <span className="truncate">{toast.msg}</span>
                        </div>

                    {/* 헤더: Rice Red Bean 대문자 강조 */}

                                <span><strong className="text-2xl font-black text-rose-800">R</strong>ed</span>

                            </h1>

                            <span className={`w-2 h-2 rounded-full mr-1.5 ${user ? 'bg-[#3b7a57] animate-pulse' : 'bg-[#b88b4a]'}`}></span>

                    {/* 메인 컨텐츠 */}

                        {/* 1. 업로드 탭 */}

                                    <div className="w-16 h-16 bg-[#f4eee4] text-stone-700 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner">
                                        <Icon name="upload-cloud" size={30} />
                                    </div>
                                    <h2 className="text-lg font-extrabold text-stone-800 mb-1">공급내역서 파일 업로드</h2>
                                    <p className="text-xs text-stone-500 mb-5 leading-relaxed">
                                        쌀 또는 팥 공급내역서 엑셀 파일을 선택하면<br/>권역별로 자동 분류하고 클라우드에 보관합니다.
                                    </p>
                                    <label className="block w-full bg-stone-800 hover:bg-stone-900 text-[#fdfbf7] font-bold py-4 px-6 rounded-2xl cursor-pointer transition active:scale-95 shadow-md">

                                                <h3 className="font-extrabold text-base text-stone-800 mt-1 truncate max-w-[200px]">{currentDoc.fileName}</h3>

                                                <p className="text-2xl font-black text-stone-800">{currentDoc.totalSacks}<span className="text-sm font-normal ml-0.5">포</span></p>
                                            </div>

                                                                    <span className="font-bold text-stone-700">{t.masterName}:</span>
                                                                    <span className="line-through text-stone-400">{t.fileRep}</span>
                                                                    <span className="text-stone-400">→</span>
                                                                    <span className="font-extrabold text-amber-800">{t.masterRep}</span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                        <div className="grid grid-cols-3 gap-2.5 mb-5">
                                            {['제주시', '신제주', '서쪽', '동쪽', '서귀포', '미분류'].map(r => {
                                                const sum = currentDoc.data.filter(d => {
                                                    const m = findSmartMaster(d.name, d.rep, d.phone, d.address) || {};
                                                    const resolvedAddr = m.address || d.address || "";
                                                    const reg = (m.region && m.region !== "미분류") ? m.region : (d.region && d.region !== "미분류" ? d.region : inferRegionByAddress(resolvedAddr));
                                                    return reg === r;
                                                }).reduce((acc, cur) => acc + (Number(cur.sacks) || 0) + (Number(cur.usSacks) || 0), 0);
                                                if (sum === 0 && r === '미분류') return null;
                                                return (
                                                    <div key={r} className={`p-3 rounded-2xl border text-center ${r === '미분류' ? 'bg-[#fdf3f2] border-[#f5d5d2]' : 'bg-[#f7f4ef] border-[#e8e2d9]'}`}>
                                                        <div className="text-xs text-stone-500 font-bold mb-0.5">{r}</div>
                                                        <div className="text-base font-extrabold text-stone-800">{sum}포</div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="grid grid-cols-2 gap-2.5">
                                            <button 
                                                onClick={() => { setSelectedDeliveryDocId(currentDoc.id); setActiveTab('my_delivery'); }} 
                                                className="w-full bg-amber-700 hover:bg-amber-800 text-[#fdfbf7] font-bold py-3.5 rounded-2xl flex items-center justify-center shadow-md transition active:scale-95 text-xs"
                                            >
                                                <Icon name="check-square" size={16} className="mr-1.5" />
                                                나의 하차지 체크
                                            </button>
                                            <button 
                                                onClick={() => exportToExcel(currentDoc)} 
                                                className="w-full bg-[#3b6e52] hover:bg-[#2f5942] text-[#fdfbf7] font-bold py-3.5 rounded-2xl flex items-center justify-center shadow-md transition active:scale-95 text-xs"
                                            >
                                                <Icon name="download" size={16} className="mr-1.5" />
                                                분류 엑셀 다운
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 2. 나의 하차지 탭 */}
                        {activeTab === 'my_delivery' && (() => {
                            const activeDoc = history.find(h => h.id === selectedDeliveryDocId) || history[0] || null;
                            const allRows = activeDoc ? activeDoc.data.map((r, i) => {
                                const m = findSmartMaster(r.name, r.rep, r.phone, r.address) || {};
                                const resolvedAddr = m.address || r.address || '';
                                const totalRowSacks = (Number(r.sacks) || 0) + (Number(r.usSacks) || 0);
                                const mySacksVal = getEffectiveMySacks(r);
                                const isSplit = Boolean(r.completed && r.mySacks !== undefined && r.mySacks !== null && Number(r.mySacks) < totalRowSacks);
                                return {
                                    ...r,
                                    name: m.name || r.name,
                                    origIdx: i,
                                    resolvedRegion: (m.region && m.region !== '미분류') ? m.region : (r.region && r.region !== '미분류' ? r.region : inferRegionByAddress(resolvedAddr)),
                                    address: resolvedAddr,
                                    phone: m.phone || r.phone || '',
                                    totalRowSacks,
                                    mySacksVal,
                                    isSplit
                                };
                            }) : [];

                            const filteredRows = deliveryRegionFilter === '전체'
                                ? allRows
                                : allRows.filter(r => r.resolvedRegion === deliveryRegionFilter);

                            const checkedFilteredRows = filteredRows.filter(r => r.completed);
                            const myDoneSacks = checkedFilteredRows.reduce((acc, cur) => acc + cur.mySacksVal, 0);
                            const myDonePlaces = checkedFilteredRows.length;
                            const targetIndices = filteredRows.map(r => r.origIdx);

                            return (
                                <div className="space-y-4">
                                    {/* 문서 선택 및 권역 필터 */}
                                    <div className="bg-[#fffdfa] p-4 rounded-[24px] shadow-sm border border-[#e6dfd5] space-y-3">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-extrabold text-stone-700 flex items-center">
                                                <Icon name="file-spreadsheet" size={15} className="mr-1.5 text-amber-700" />
                                                작업할 내역서 선택
                                            </span>
                                            <span className="text-[11px] text-stone-400 font-bold">체크 시 자동 저장</span>
                                        </div>
                                        {history.length === 0 ? (
                                            <div className="text-xs text-stone-400 py-2 text-center">먼저 [업로드] 탭에서 엑셀 파일을 올려주세요.</div>
                                        ) : (
                                            <select
                                                value={activeDoc ? activeDoc.id : ''}
                                                onChange={(e) => setSelectedDeliveryDocId(e.target.value)}
                                                className="w-full bg-[#f7f4ef] border border-[#d6cec2] rounded-xl px-3 py-2.5 text-xs font-bold text-stone-800 outline-none"
                                            >
                                                {history.map(h => (
                                                    <option key={h.id} value={h.id}>
                                                        [{h.yearMonth}] {h.fileName}
                                                    </option>

                                            </select>
                                        )}

                                        {/* 권역 필터 버튼 */}
                                        <div className="flex gap-1.5 overflow-x-auto pb-1">
                                            {['전체', '제주시', '신제주', '서쪽', '동쪽', '서귀포'].map(reg => (
                                                <button
                                                    key={reg}
                                                    onClick={() => setDeliveryRegionFilter(reg)}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold shrink-0 transition ${
                                                        deliveryRegionFilter === reg
                                                            ? 'bg-stone-800 text-white shadow-sm'
                                                            : 'bg-[#f4eee4] text-stone-600 hover:bg-[#e8e0d3]'
                                                    }`}
                                                >
                                                    {reg}
                                                </button>
                                            ))}
                                        </div>

                                        {/* 권역별 일괄 체크 / 체크 해지 버튼 */}
                                        {activeDoc && filteredRows.length > 0 && (
                                            <div className="flex gap-2 pt-1">
                                                <button
                                                    onClick={() => setBulkDeliveryComplete(activeDoc, targetIndices, true)}
                                                    className="flex-1 bg-[#e3ece6] hover:bg-[#d2e2d7] text-[#2c5e43] py-2 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center transition active:scale-95"
                                                >
                                                    <Icon name="check-square" size={14} className="mr-1.5" />
                                                    [{deliveryRegionFilter}] 전체 체크
                                                </button>
                                                <button
                                                    onClick={() => setBulkDeliveryComplete(activeDoc, targetIndices, false)}
                                                    className="flex-1 bg-[#fdf3f2] hover:bg-[#f9e2e0] text-[#9e3b33] py-2 px-3 rounded-xl text-xs font-extrabold flex items-center justify-center transition active:scale-95 border border-[#f5d5d2]"
                                                >
                                                    <Icon name="rotate-ccw" size={14} className="mr-1.5" />
                                                    [{deliveryRegionFilter}] 체크 해지
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {/* 내가 돌린 갯수 요약 배너 */}
                                    {activeDoc && (
                                        <div className="bg-stone-800 text-[#fdfbf7] p-5 rounded-[24px] shadow-md flex justify-between items-center">

                                                <p className="text-stone-400 text-[11px] font-bold mb-0.5">

                                                    <span className="text-sm font-bold text-stone-200">포</span>

                                                                        {row.resolvedRegion}

                                                                        {row.name}

                                                                </div>
                                                                {row.address && (
                                                                    <p className="text-[11px] text-stone-400 truncate mt-0.5 max-w-[175px]">{row.address}</p>
